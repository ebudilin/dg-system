<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Финансы · Дорогой Город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky ledger header with period + tabs; summary tiles over detail tables; wide tables scroll inside their own box */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#15201C; --muted:#5B6863; --line:#D8DFDC;
  --accent:#1F5A48; --accent-ink:#FFFFFF; --accent-soft:#DDEBE5;
  --pos:#1D7A45; --neg:#B0302A; --warn:#9A6400; --pos-soft:#E0F1E6; --neg-soft:#F7E3E1; --warn-soft:#F5ECD8;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#121916; --ink:#E4EBE8; --muted:#95A39D; --line:#28332F;
  --accent:#7CC7AC; --accent-ink:#0C1A15; --accent-soft:#1D3029;
  --pos:#62CC8F; --neg:#F08A80; --warn:#E2B458; --pos-soft:#18301F; --neg-soft:#3A1D1B; --warn-soft:#352A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#121916; --ink:#E4EBE8; --muted:#95A39D; --line:#28332F;
  --accent:#7CC7AC; --accent-ink:#0C1A15; --accent-soft:#1D3029;
  --pos:#62CC8F; --neg:#F08A80; --warn:#E2B458; --pos-soft:#18301F; --neg-soft:#3A1D1B; --warn-soft:#352A14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:6px;margin-left:10px;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.crm-link{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--ink);text-decoration:none;white-space:nowrap}
.period .who button:not(.primary){width:auto;height:30px;padding:0 10px;font-size:12px;flex:none}
.who span{line-height:1.25;text-align:right}
body.ro #addop,body.ro [data-new-deal],body.ro [data-new-client],body.ro [data-pay-deal],body.ro [data-pay-in-deal],body.ro [data-inc-all],body.ro #dlgform button[type=submit],body.ro [data-del-deal],body.ro [data-del-client],body.ro [data-del-op]{display:none!important}
.acc-tbl td,.acc-tbl th{white-space:nowrap}
@media (max-width:700px){.who span{display:none}}
.like-btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.period{display:flex;align-items:center;gap:6px}
.period button:not(.primary){width:32px;height:32px;padding:0}
.period{flex-wrap:wrap}
.period .lbl{min-width:132px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--neg);border-color:var(--neg)}
button.ghost{border-color:transparent;background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--font-num)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{letter-spacing:.02em}
h2{font-size:17px;margin:24px 0 10px;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .k,.tile.hero .s{color:var(--accent-ink);opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.total{font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr.sec td{background:var(--sunk);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.report th:first-child,.report td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.report tr.sec td:first-child,.report th:first-child{background:var(--sunk)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.in{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.out{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.tr{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.work{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.deal{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.closed{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:18px 0 12px}
.toolbar>*{flex:0 1 auto}
.toolbar .grow{flex:1 1 200px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:80px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(10,16,14,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
@media (max-width:480px){.fg{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts>div{display:flex;gap:8px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font:11px var(--font-ui)}
.chart .grid-l{stroke:var(--line)}
.chart .b-in{fill:var(--pos)} .chart .b-out{fill:var(--neg);opacity:.75}
.chart .ln{stroke:var(--ink);fill:none;stroke-width:1.5}
.chart .dot{fill:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-row{display:grid;gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100vw - 32px)}
.note{font-size:12px;color:var(--muted);margin-top:8px;max-width:70ch}
.pf input{width:130px;text-align:right}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}

/* v5: липкие заголовки таблиц, цвет раздела */
header.top{background:var(--hdr,var(--bg));border-top:4px solid var(--accent)}
.tbl-wrap{max-height:calc(100dvh - 210px);overflow:auto}
.tbl-wrap thead th{position:sticky;top:0;z-index:2}
.report thead th:first-child{z-index:3}
dialog .tbl-wrap{max-height:none}
.brand .sect-badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);vertical-align:3px}
@media (max-width:700px){.tbl-wrap{max-height:calc(100dvh - 140px)}.report th:first-child,.report td:first-child{min-width:130px;max-width:150px}}

:root{--accent:#2E4C93;--accent-ink:#FFFFFF;--accent-soft:#DFE5F4;--hdr:#E4E9F4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#93ABEB;--accent-ink:#0D1424;--accent-soft:#1E2740;--hdr:#121A2B}}
:root[data-theme="dark"]{--accent:#93ABEB;--accent-ink:#0D1424;--accent-soft:#1E2740;--hdr:#121A2B}
/* переключатель CRM / Финансы */
.appsw{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.appsw a{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 18px;border-radius:9px;text-decoration:none;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.appsw a i{width:10px;height:10px;border-radius:50%;flex:none}
.appsw .sw-crm i{background:#2E8A66}.appsw .sw-fin i{background:#3A78C4}
.appsw a.sw-crm[aria-current="page"]{background:#1F5A48;color:#FFFFFF}
.appsw a.sw-fin[aria-current="page"]{background:#1E4E8C;color:#FFFFFF}
.appsw a[aria-current="page"] i{background:#FFFFFF;opacity:.85}
.appsw a:not([aria-current]):hover{background:var(--sunk);color:var(--ink)}
@media (max-width:700px){.appsw{display:flex;width:100%;order:-1}.appsw a{flex:1;padding:11px 8px;font-size:16px}}
</style>
</head><body>


<header class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="bar">
      <div class="brand"><b><a href="/" style="color:inherit;text-decoration:none" title="Перейти в CRM">Дорогой Город</a><span class="sect-badge">Финансы</span></b><span id="sync">Подключение к базе…</span></div>
      <nav class="appsw" id="appsw" aria-label="Раздел системы"><a href="/" class="sw-crm"><i></i>CRM</a><a href="/finance" class="sw-fin" aria-current="page"><i></i>Финансы</a></nav>
      <div class="period">
        <button id="prev" aria-label="Предыдущий период">‹</button>
        <div class="lbl" id="plabel"></div>
        <button id="next" aria-label="Следующий период">›</button>
        <button class="primary" id="addop" style="margin-left:8px">+ Операция</button>
        <div class="who" id="who"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>

<dialog id="dlg"><form class="dlg" id="dlgform" method="dialog"></form></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const money=n=>{n=Math.round(+n||0);return (n<0?'−':'')+NF.format(Math.abs(n))+' ₽'};
const moneyS=n=>{n=+n||0;const a=Math.abs(n),s=n<0?'−':'';if(a>=1e6)return s+(a/1e6).toFixed(a>=1e7?0:1).replace('.',',')+' млн';if(a>=1e3)return s+Math.round(a/1e3)+' тыс';return s+Math.round(a)};
const cls=n=>n<0?'neg':(n>0?'pos':'');
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curMonth=()=>todayStr().slice(0,7);
const addM=(m,k)=>{let y=+m.slice(0,4),mo=+m.slice(5,7)-1+k;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
const range=(a,b)=>{const r=[];let m=a;while(m<=b&&r.length<240){r.push(m);m=addM(m,1)}return r};
const mLabel=m=>MONF[+m.slice(5,7)-1]+' '+m.slice(0,4);
const mShort=m=>MON[+m.slice(5,7)-1];
const dFmt=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(2,4):'';
const uid=p=>p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=v=>{if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3200)}

/* ---------- defaults (used until settings are saved) ---------- */
const DEFAULT_CFG={
  startMonth:'2026-09', taxRate:6, splitBase:'gross',
  accounts:[
    {id:'rs',name:'Расчётный счёт ООО',opening:0},
    {id:'cash',name:'Касса (наличные)',opening:0},
    {id:'card_e',name:'Карта Евгения',opening:0},
    {id:'card_v',name:'Карта Владимира',opening:0}],
  categories:[
    {id:'com',name:'Комиссия по сделкам',kind:'in',pnl:'revenue',role:'commission'},
    {id:'legal',name:'Юридическое сопровождение',kind:'in',pnl:'revenue'},
    {id:'other_in',name:'Прочие доходы',kind:'in',pnl:'revenue'},
    {id:'owner_in',name:'Взнос / заём учредителя',kind:'in',pnl:'none'},
    {id:'agentpay',name:'Выплаты агентам',kind:'out',pnl:'var',role:'agentpay'},
    {id:'salary',name:'Зарплата (оклады)',kind:'out',pnl:'fixed'},
    {id:'payroll_tax',name:'Налоги и взносы с ФОТ',kind:'out',pnl:'fixed'},
    {id:'rent',name:'Аренда офиса',kind:'out',pnl:'fixed'},
    {id:'ads',name:'Реклама и покупка лидов',kind:'out',pnl:'fixed'},
    {id:'listings',name:'Циан, Авито, площадки',kind:'out',pnl:'fixed'},
    {id:'it',name:'Связь, CRM, сервисы',kind:'out',pnl:'fixed'},
    {id:'acc',name:'Бухгалтерия и банк',kind:'out',pnl:'fixed'},
    {id:'office',name:'Офис и хозрасходы',kind:'out',pnl:'fixed'},
    {id:'other_out',name:'Прочие расходы',kind:'out',pnl:'fixed'},
    {id:'usn',name:'Налог УСН',kind:'out',pnl:'none',role:'tax'},
    {id:'divs',name:'Выплаты учредителям (дивиденды)',kind:'out',pnl:'none'},
    {id:'loan_out',name:'Возврат займов',kind:'out',pnl:'none'}],
  agents:[
    {id:'evg',name:'Евгений',share:50},{id:'vdr',name:'Владимир Дрягин',share:50},
    {id:'dbr',name:'Дмитрий Брылин',share:40},{id:'agn',name:'Александр Гансецкий',share:20},
    {id:'edr',name:'Элеонора Дрягина',share:40},{id:'vst',name:'Владимир Стасенко',share:40},
    {id:'lya',name:'Лилия Якубова',share:0}],
  owners:[{name:'Евгений',share:45},{name:'Владимир Дрягин',share:45},{name:'Элеонора Дрягина',share:10}]
};
const PNL_LABEL={revenue:'Выручка',var:'Переменный расход',fixed:'Постоянный расход',none:'Не влияет на прибыль'};
const DEAL_KINDS=['Вторичка','Новостройка','Коммерция','Аренда','Загородная','Юр. сопровождение'];
const DEAL_ST={work:'В работе',deal:'Договор подписан',closed:'Закрыта',lost:'Сорвалась'};
const CP_TYPES=[['owner','Собственник (продавец/арендодатель)'],['buyer','Покупатель'],['tenant','Арендатор'],['agent','Агент'],['partner','Партнёр'],['founder','Учредитель'],['employee','Сотрудник'],['investor','Инвестор'],['contractor','Подрядчик'],['service','Сервис / поставщик'],['bank','Банк'],['outagent','Агент другого агентства']];
const CP_SHORT={owner:'Собственник',buyer:'Покупатель',tenant:'Арендатор',agent:'Агент',partner:'Партнёр',founder:'Учредитель',employee:'Сотрудник',investor:'Инвестор'};

/* ---------- state ---------- */
let dbState='connecting', cfg=structuredClone(DEFAULT_CFG), cfgExists=false;
const opsByMonth={}; let deals={}, plans={}, clients={}, archOps=[];
const ALL_TABS=[['summary','Сводка'],['ops','Операции'],['deals','Сделки'],['clients','Контрагенты'],['cash','ДДС'],['pnl','ОПиУ'],['plan','План-факт'],['settings','Настройки']];
let ME=null;
const isOwner=()=>!!ME&&ME.role==='owner', canEdit=()=>!!ME&&ME.finance==='edit';
const TABS=ALL_TABS.filter(t=>true);
function syncTabs(){TABS.length=0;ALL_TABS.forEach(t=>{if((t[0]==='settings'||t[0]==='access')&&!isOwner())return;TABS.push(t)});if(!TABS.some(t=>t[0]===V.tab))V.tab='summary'}
const hashTab=(location.hash||'').slice(1);
const V={tab:TABS.some(t=>t[0]===hashTab)?hashTab:'summary', month:curMonth(), year:curMonth().slice(0,4), f:{acc:'',cat:'',type:'',q:''}, dealF:'active', cq:'', cpType:''};
let draft=null, draftDirty=false;

/* ---------- lookups & math ---------- */
const catById=id=>cfg.categories.find(c=>c.id===id);
const accById=id=>cfg.accounts.find(a=>a.id===id);

let writeChain=Promise.resolve(), version=null, saving=0, loadErr='';
async function api(fn,...args){
  let r;try{r=await fetch('/api/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(args)})}
  catch(e){throw new Error('Нет связи с сервером. Проверьте интернет.')}
  if(r.status===401){location.href='/login';throw new Error('Сессия закончилась.')}
  let d=null;try{d=await r.json()}catch(_){}
  if(!r.ok)throw new Error((d&&d.error)||('Ошибка сервера ('+r.status+')'));
  return d.result}

function chart(){
  const end=V.month,ms=range(addM(end,-11),end).filter(m=>m>=cfg.startMonth||archM(m));
  if(!ms.length)return '<div class="empty">Нет данных</div>';
  const d=ms.map(m=>{const c=cashMonth(m);return{m,i:c.tin,o:c.tout}});
  const bal=ms.map(m=>m<cfg.startMonth||archM(m)?null:sumObj(balances(addM(m,1)+'-01')));
  const mx=Math.max(1,...d.map(x=>Math.max(x.i,x.o)),...bal.filter(v=>v!=null).map(Math.abs));
  const W=640,H=220,L=62,B=24,T=10,ih=H-B-T,cw=(W-L-8)/Math.max(6,ms.length),bw=Math.min(18,cw/2-4);
  const y=v=>T+ih-(v/mx)*ih;
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4,yy=y(v);g+=`<line class="grid-l" x1="${L}" x2="${W-4}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+4}" text-anchor="end">${moneyS(v)}</text>`}
  let bars='',pts=[];d.forEach((x,i)=>{const cx=L+cw*i+cw/2;
    bars+=`<rect class="b-in" x="${cx-bw-1}" y="${y(x.i)}" width="${bw}" height="${Math.max(0,T+ih-y(x.i))}" rx="2"><title>${mLabel(x.m)}: поступления ${money(x.i)}</title></rect>`;
    bars+=`<rect class="b-out" x="${cx+1}" y="${y(x.o)}" width="${bw}" height="${Math.max(0,T+ih-y(x.o))}" rx="2"><title>${mLabel(x.m)}: выплаты ${money(x.o)}</title></rect>`;
    bars+=`<text class="ax" x="${cx}" y="${H-6}" text-anchor="middle">${mShort(x.m)}</text>`;if(bal[i]!=null)pts.push([cx,y(Math.max(0,bal[i]))])});
  const ln=pts.length>1?`<polyline class="ln" points="${pts.map(p=>p.join(',')).join(' ')}"/>`:'';
  const last=pts[pts.length-1]||[-10,-10];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Поступления, выплаты и остаток по месяцам">${g}${bars}${ln}<circle class="dot" cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>
  <div class="legend"><span><i style="background:var(--pos)"></i>Поступления</span><span><i style="background:var(--neg);opacity:.75"></i>Выплаты</span><span><i style="background:var(--ink);height:2px;vertical-align:3px"></i>Остаток на конец месяца</span></div>`;
}

/* ---------- ДДС ---------- */

  const nb=m=>m<cfg.startMonth||archM(m);const open=ms.map(m=>nb(m)?null:sumObj(balances(m+'-01'))),close=ms.map(m=>nb(m)?null:sumObj(balances(addM(m,1)+'-01')));
  const fo=open.find(v=>v!=null),lc=close.filter(v=>v!=null).pop();
  const T=a=>a.reduce((s,v)=>s+v,0);
  const cell=(v,c='')=>`<td class="r num ${c}">${v?money(v):'<span class="muted">—</span>'}</td>`;
  let h=`<h2>Движение денежных средств, ${V.year}</h2><div class="tbl-wrap report"><table><thead><tr><th>Статья</th>${ms.map(m=>`<th class="r">${mShort(m)}${archM(m)?'*':''}</th>`).join('')}<th class="r">Год</th></tr></thead><tbody>`;
  h+=`<tr class="sec"><td>Остаток на начало</td>${open.map(v=>`<td class="r num">${v==null?'<span class="muted">—</span>':money(v)}</td>`).join('')}<td class="r num">${fo==null?'—':money(fo)}</td></tr>`;
  h+=`<tr class="sec"><td>Поступления</td>${data.map(d=>cell(d.tin,'pos')).join('')}${cell(T(data.map(d=>d.tin)),'pos')}</tr>`;

  h+=`<tr class="sec"><td>Выплаты</td>${data.map(d=>cell(-d.tout,'neg')).join('')}${cell(-T(data.map(d=>d.tout)),'neg')}</tr>`;
  outCats.forEach(c=>{const v=data.map(d=>d.outC[c.id]||0);h+=`<tr><td>${esc(c.name)}</td>${v.map(x=>cell(-x)).join('')}${cell(-T(v))}</tr>`});
  h+=`<tr class="tot"><td>Чистый поток</td>${data.map(d=>`<td class="r num ${cls(d.net)}">${money(d.net)}</td>`).join('')}<td class="r num ${cls(T(data.map(d=>d.net)))}">${money(T(data.map(d=>d.net)))}</td></tr>`;

/* ---------- ОПиУ ---------- */
function vPnl(){
  const ms=yearMonths(),ops=reportOps(),P=ms.map(m=>pnlMonth(m,ops)),T=a=>a.reduce((s,v)=>s+v,0);
  const has=(k,id)=>P.some(p=>p[k][id]);
  const line=(label,vals,c='',neg=false)=>`<tr class="${c}"><td>${label}</td>${vals.map(v=>`<td class="r num ${c==='tot'?cls(v):''}">${v?money(neg?-v:v):'<span class="muted">—</span>'}</td>`).join('')}<td class="r num">${money(neg?-T(vals):T(vals))}</td></tr>`;

  h+=line('Выручка',P.map(p=>p.revenue),'sec');
  cfg.categories.filter(c=>c.kind==='in'&&c.pnl==='revenue'&&has('rev',c.id)).forEach(c=>h+=line(esc(c.name),P.map(p=>p.rev[c.id]||0)));
  h+=line('Налог УСН (начислено по счетам)',P.map(p=>p.tax),'',true);
  h+=line('Выплаты агентам (начислено по сплитам)',P.map(p=>p.agent),'',true);
  cfg.categories.filter(c=>c.pnl==='var'&&c.role!=='agentpay'&&has('vr',c.id)).forEach(c=>h+=line(esc(c.name),P.map(p=>p.vr[c.id]||0),'',true));
  h+=line('Маржинальный доход',P.map(p=>p.margin),'tot');
  h+=line('Постоянные расходы',P.map(p=>p.fixT),'sec',true);
  cfg.categories.filter(c=>c.pnl==='fixed'&&has('fixed',c.id)).forEach(c=>h+=line(esc(c.name),P.map(p=>p.fixed[c.id]||0),'',true));
  h+=line('Операционная прибыль',P.map(p=>p.profit),'tot');
  h+=`<tr><td>Рентабельность</td>${P.map(p=>`<td class="r num muted">${p.revenue?Math.round(p.profit/p.revenue*100)+'%':'—'}</td>`).join('')}<td class="r num muted">${T(P.map(p=>p.revenue))?Math.round(T(P.map(p=>p.profit))/T(P.map(p=>p.revenue))*100)+'%':'—'}</td></tr>`;
  h+=`</tbody></table></div>${ms.some(archM)?`<p class="note">* Месяцы ${archLabel()} — по операциям архива, отмеченным «учитывать».</p>`:''}`;
  const yp=T(P.map(p=>p.profit));
  h+=`<div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))"><div class="card"><h3>Прибыль ${V.year} по долям учредителей</h3><div class="rows">${cfg.owners.map(o=>`<div class="row"><span>${esc(o.name)} · ${num(o.share)}%</span><span class="num ${cls(yp)}">${money(yp*num(o.share)/100)}</span></div>`).join('')}
    <div class="row total"><span>Операционная прибыль</span><span class="num ${cls(yp)}">${money(yp)}</span></div></div>
    <p class="note">Расчётная доля до вывода. Фактические выплаты учредителям вносятся статьёй «Выплаты учредителям» и в прибыль не входят.</p></div>
    <div class="card"><h3>Как считается</h3><p class="note" style="margin:0">Выручка — поступления по статьям выручки, в месяце начисления (по умолчанию это месяц оплаты). УСН и доля агентов начисляются расчётно от каждого поступления, поэтому их фактическая уплата в прибыль повторно не попадает. Займы, взносы и дивиденды на прибыль не влияют.</p></div></div>`;
  return h;
}

/* ---------- План-факт ---------- */
function planLines(){
  const L=[];cfg.categories.filter(c=>c.kind==='in'&&c.pnl==='revenue').forEach(c=>L.push({k:'c:'+c.id,label:c.name,grp:'rev'}));
  L.push({k:'tax',label:'Налог УСН (расчётно от плана выручки)',grp:'tax',auto:true});
  L.push({k:'agent',label:'Выплаты агентам (начислено)',grp:'var'});
  cfg.categories.filter(c=>c.pnl==='var'&&c.role!=='agentpay').forEach(c=>L.push({k:'c:'+c.id,label:c.name,grp:'var'}));
  cfg.categories.filter(c=>c.pnl==='fixed').forEach(c=>L.push({k:'c:'+c.id,label:c.name,grp:'fixed'}));
  return L;
}
function vPlan(){
  const m=V.month,p=pnlMonth(m,reportOps()),pl=(plans[m]&&plans[m].lines)||{},L=planLines();
  const fact=l=>l.k==='tax'?p.tax:l.k==='agent'?p.agent:(l.grp==='rev'?p.rev:l.grp==='var'?p.vr:p.fixed)[l.k.slice(2)]||0;
  const planRev=L.filter(l=>l.grp==='rev').reduce((s,l)=>s+num(pl[l.k]),0);
  const plan=l=>l.k==='tax'?planRev*rate():num(pl[l.k]);
  const sum=(g,fn)=>L.filter(l=>g.includes(l.grp)).reduce((s,l)=>s+fn(l),0);
  const pR=sum(['rev'],plan),fR=sum(['rev'],fact),pC=sum(['tax','var','fixed'],plan),fC=sum(['tax','var','fixed'],fact);
  const row=l=>{const pv=plan(l),fv=fact(l),dv=l.grp==='rev'?fv-pv:pv-fv,pct=pv?Math.round(fv/pv*100):null;
    return `<tr><td>${esc(l.label)}</td><td class="r">${l.auto?`<span class="num">${money(pv)}</span>`:`<input type="number" inputmode="decimal" step="1000" data-plan="${esc(l.k)}" id="pl-${esc(l.k)}" value="${pl[l.k]!=null?esc(pl[l.k]):''}" placeholder="0">`}</td>
    <td class="r num">${money(fv)}</td><td class="r num ${pv||fv?cls(dv):''}">${pv||fv?money(dv):'—'}</td><td class="r num muted">${pct==null?'—':pct+'%'}</td></tr>`};
  const sec=(t,g)=>`<tr class="sec"><td colspan="5">${t}</td></tr>`+L.filter(l=>g.includes(l.grp)).map(row).join('');
  let h=`<h2>План-факт: ${mLabel(m).toLowerCase()}</h2><div class="tbl-wrap pf"><table><thead><tr><th>Статья</th><th class="r">План</th><th class="r">Факт</th><th class="r">Отклонение</th><th class="r">Исполнение</th></tr></thead><tbody>`;
  h+=sec('Выручка',['rev'])+sec('Переменные расходы и налог',['tax','var'])+sec('Постоянные расходы',['fixed']);
  const pp=pR-pC,fp=fR-fC;
  h+=`<tr class="tot"><td>Прибыль</td><td class="r num">${money(pp)}</td><td class="r num ${cls(fp)}">${money(fp)}</td><td class="r num ${cls(fp-pp)}">${money(fp-pp)}</td><td class="r num muted">${pp?Math.round(fp/pp*100)+'%':'—'}</td></tr>`;
  h+=`</tbody></table></div><p class="note">Отклонение со знаком «+» — хорошо: выручки больше плана или расходов меньше. План сохраняется сразу после ввода. <button type="button" class="ghost" data-copy-plan>Скопировать план с прошлого месяца</button></p>`;
  return h;
}

async function closePeriodUI(){
  const D=($('#s-close')||{}).value||'';V.closeDate=D;
  if(!/^\d{4}-\d{2}-01$/.test(D))return toast('Выберите первое число месяца.');
  if(draftDirty)return toast('Сначала сохраните или отмените изменения в настройках.');
  const cnt=allOps().filter(o=>o.date<D).length;if(!cnt)return toast('Операций раньше этой даты нет.');
  if(!V.closeConfirm){V.closeConfirm=true;render();toast('Будет перенесено операций: '+cnt+'. Нажмите ещё раз, чтобы подтвердить.');return}
  V.closeConfirm=false;if(dbState!=='ok')return toast('Нет связи с сервером.');
  const A=JSON.parse(JSON.stringify(cfg.archive||{months:{},deals:{},cps:{}}));A.months=A.months||{};A.deals=A.deals||{};A.cps=A.cps||{};
  opsCut=D;let out;
  try{
    const old=allOps(),bal=balances(D),L=liabilities();
    for(const o of old){if(o.type==='tr')continue;const m=o.date.slice(0,7),M=A.months[m]||(A.months[m]={in:{},out:{},tax:0});
      const side=o.type==='in'?M.in:M.out;side[o.cat]=(side[o.cat]||0)+o.amount;if(o.type==='in')M.tax+=taxAccrual(o)}
    for(const d of Object.values(deals)){const st=dealStats(d);if(!st.ops.length)continue;const p=A.deals[d.id]||(A.deals[d.id]={rec:0,tax:0,acc:0,paid:0,exp:0,dist:0});
      for(const k of ['rec','tax','acc','paid','exp','dist'])p[k]+=st[k]}
    for(const c of Object.values(clients)){const st=cpStats(c.id);if(!st.ops.length&&!st.agent.acc)continue;
      const p=A.cps[c.id]||(A.cps[c.id]={in:0,out:0,divs:0,salary:0,agentPaid:0,agentAcc:0,divsByDeal:{}});
      p.in+=st.inSum;p.out+=st.outSum;p.divs+=st.divs.sum;p.salary+=st.salary.sum;p.agentPaid+=st.agent.paid;p.agentAcc+=st.agent.acc;
      for(const k in st.divs.byDeal){const kk=k||'';p.divsByDeal[kk]=(p.divsByDeal[kk]||0)+st.divs.byDeal[k]}}
    A.before=D;
    const debts=[];
    holders().forEach(h=>{const v=investorStats(h).debt;if(Math.abs(v)>=1)debts.push({cpId:h,kind:'founder',amount:Math.round(v)})});
    Object.entries(L.agents).forEach(([id,v])=>{if(Math.abs(v)>=1)debts.push({cpId:id,kind:'agent',amount:Math.round(v)})});
    out=Object.assign(JSON.parse(JSON.stringify(cfg)),{startMonth:D.slice(0,7),archive:A,openingDebts:debts,
      accounts:cfg.accounts.map(a=>Object.assign({},a,{opening:a.holderId?0:Math.round((bal[a.id]||0)*100)/100,openingTax:Math.round((L.taxBy[a.id]||0)*100)/100}))});
  }finally{opsCut=null}
  await queue(async()=>{draft=null;draftDirty=false;apply(await api('closePeriod',D,out));render();toast('Операции до '+dFmt(D)+' перенесены в архив')});
}

  if(D.accounts.some(a=>!String(a.name).trim())||D.categories.some(c=>!String(c.name).trim()))return toast('У каждого счёта и статьи должно быть название.');
  const earliest=Object.keys(opsByMonth).filter(m=>(opsByMonth[m]||[]).length).sort()[0];
  if(earliest&&D.startMonth>earliest)return toast('Есть операции за '+mLabel(earliest)+' — начало учёта не может быть позже.');
  const out={startMonth:D.startMonth,taxRate:num(D.taxRate),splitBase:D.splitBase==='net'?'net':'gross',
    accounts:D.accounts.map(a=>({id:a.id,name:String(a.name).trim(),opening:num(a.opening),tax:a.tax===''||a.tax==null?0:num(a.tax),openingTax:num(a.openingTax),holderId:a.holderId||''})),
    openingDebts:(D.openingDebts||[]).filter(x=>x.cpId&&num(x.amount)).map(x=>({cpId:x.cpId,kind:x.kind==='agent'?'agent':'founder',amount:num(x.amount)})),
    archive:cfg.archive||undefined,
    agents:cfg.agents,
    owners:D.owners.filter(o=>o.cpId||String(o.name||'').trim()).map(o=>({name:o.cpId?cpName(o.cpId):String(o.name).trim(),cpId:o.cpId||'',share:num(o.share)})),
    categories:D.categories.map(c=>{const r={id:c.id,name:String(c.name).trim(),kind:c.kind,pnl:c.pnl};if(c.role)r.role=c.role;return r})};
  if(dbState!=='ok')return toast('Нет связи с сервером.');
  await queue(async()=>{draft=null;draftDirty=false;apply(await api('saveConfig',out));render();toast('Настройки сохранены')});
}

    <div class="row"><span>Загрузить данные из файла выгрузки. <b>Заменит</b> все операции, сделки, контрагентов, планы и настройки. Пользователи сохраняются.</span><label class="btn"><input type="file" id="acc-import" accept=".json,application/json" hidden><span class="like-btn">Загрузить .json…</span></label></div></div>
    <p class="note" style="margin:8px 0 0">Сервер также сам делает резервную копию базы каждую ночь.</p></div>`;
  h+=`<h2>Журнал изменений</h2><div class="tbl-wrap"><table class="acc-tbl"><thead><tr><th>Когда</th><th>Кто</th><th>Действие</th><th>Что</th></tr></thead><tbody>
    ${(ACC.audit||[]).map(a=>`<tr><td class="num">${dt(a.at)}</td><td>${esc(a.user_name||'')}</td><td>${esc(a.action)}</td><td class="muted">${esc([a.entity,a.entity_id].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Пока пусто</td></tr>'}
  </tbody></table></div><p class="note">Показаны последние 150 записей.</p>`;
  return h}
$('#app').addEventListener('change',async e=>{
  const r=e.target.closest('[data-acc-role]');
  if(r){try{const u=ACC.users.find(x=>x.id==r.dataset.accRole);const out=await api('saveUser',{id:u.id,name:u.name,role:r.value,active:u.active});ACC.users=out.users;toast('Роль изменена');render()}catch(err){toast(err.message);render()}return}
  if(e.target.id==='acc-import'){const f=e.target.files[0];if(!f)return;
    const ok=prompt('Импорт заменит все текущие данные (кроме пользователей). Чтобы продолжить, напишите слово ЗАМЕНИТЬ');
    if(ok!=='ЗАМЕНИТЬ'){e.target.value='';return toast('Импорт отменён')}
    try{const data=JSON.parse(await f.text());const c=await api('importData',data,'ЗАМЕНИТЬ');
      toast(`Загружено: операций ${c.ops}, в архиве ${c.archOps}, сделок ${c.deals}, контрагентов ${c.clients}`);apply(await api('loadAll'));ACC.audit=null;ACC.users=null;render()}
    catch(err){toast('Импорт не выполнен: '+err.message)}e.target.value=''}});
$('#app').addEventListener('click',async e=>{const b=e.target.closest('[data-acc]');if(!b)return;const a=b.dataset.acc;
  try{
    if(a==='hidepw'){ACC.newPw=null;render();return}
    if(a==='add'){const name=$('#acc-name').value.trim(),login=$('#acc-login').value.trim().toLowerCase(),role=$('#acc-role').value,pw=genPw();
      const out=await api('saveUser',{name,login,role,password:pw});ACC.users=out.users;ACC.newPw={login,pw};ACC.audit=await api('listAudit',150);render();return}
    if(a==='reset'){if(!confirm('Выдать пользователю новый временный пароль? Текущие входы будут завершены.'))return;const pw=genPw();
      const out=await api('resetUserPassword',Number(b.dataset.id),pw);ACC.users=out.users;ACC.newPw={login:b.dataset.login,pw};render();return}
    if(a==='toggle'){const u=ACC.users.find(x=>x.id==b.dataset.id);const out=await api('saveUser',{id:u.id,name:u.name,role:u.role,active:!u.active});ACC.users=out.users;render();return}
    if(a==='export'){const d=await api('exportData');const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
      const url=URL.createObjectURL(blob);const l=document.createElement('a');l.href=url;l.download='dg-export-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return}
  }catch(err){toast(err.message)}});

window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(TABS.some(t=>t[0]===k)&&k!==V.tab){V.tab=k;render()}});
init();
})();
</script>
