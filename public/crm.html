<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · Дорогой Город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>

/* Layout: sticky ledger header with period + tabs; summary tiles over detail tables; wide tables scroll inside their own box */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EEF2F7; --ink:#17243B; --muted:#65748B; --line:#E1E7EF;
  --accent:#4E6EAF; --accent-ink:#FFFFFF; --accent-soft:#E8EDF7; --accent-2:#348E83; --accent-2-soft:#E1F1ED;
  --pos:#27836F; --neg:#BD5965; --warn:#AA7B25; --pos-soft:#E1F1ED; --neg-soft:#F8E7EA; --warn-soft:#F7F0DF;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"Inter",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px; --r-lg:14px; --r-sm:6px;
  --sh-sm:0 1px 2px rgba(23,36,59,.04); --sh:0 8px 24px rgba(23,36,59,.07);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111827; --surface:#182235; --sunk:#141E30; --ink:#E5EAF3; --muted:#98A6BB; --line:#2A3850;
  --accent:#9BB4E0; --accent-ink:#14213B; --accent-soft:#263754;
  --pos:#72C4AE; --neg:#E59AA5; --warn:#D5B570; --pos-soft:#1E3936; --neg-soft:#412A34; --warn-soft:#3C3526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111827; --surface:#182235; --sunk:#141E30; --ink:#E5EAF3; --muted:#98A6BB; --line:#2A3850;
  --accent:#9BB4E0; --accent-ink:#14213B; --accent-soft:#263754;
  --pos:#72C4AE; --neg:#E59AA5; --warn:#D5B570; --pos-soft:#1E3936; --neg-soft:#412A34; --warn-soft:#3C3526; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:6px;margin-left:10px;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who span{line-height:1.25;text-align:right}
.acc-tbl td,.acc-tbl th{white-space:nowrap}
@media (max-width:700px){.who span{display:none}}
.like-btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.period{display:flex;align-items:center;gap:6px}
.period button:not(.primary){width:32px;height:32px;padding:0}
.period{flex-wrap:wrap}
.period .lbl{min-width:132px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--neg);border-color:var(--neg)}
button.ghost{border-color:transparent;background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--font-num)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{letter-spacing:.02em}
h2{font-size:17px;margin:24px 0 10px;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .k,.tile.hero .s{color:var(--accent-ink);opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.total{font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr.sec td{background:var(--sunk);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.in{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.out{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.tr{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.work{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.deal{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.closed{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:18px 0 12px}
.toolbar>*{flex:0 1 auto}
.toolbar .grow{flex:1 1 200px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:80px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(10,16,14,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
@media (max-width:480px){.fg{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts>div{display:flex;gap:8px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-row{display:grid;gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100vw - 32px)}
.note{font-size:12px;color:var(--muted);margin-top:8px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}

/* CRM */
.top .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sect a{padding:6px 14px;text-decoration:none;color:var(--muted);font-weight:500}
.sect a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who span{line-height:1.25;text-align:right}
.who button{padding:5px 10px;font-size:12px}
@media (max-width:700px){.who span{display:none}}
body.ro [data-need-w]{display:none!important}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px;font-weight:600}
.col-h small{color:var(--muted);font-weight:500;font-family:var(--font-num)}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.lc:hover{border-color:var(--muted)}
.lc[draggable="true"]{cursor:grab}
.lc b{font-weight:600;font-size:13px}
.lc .m{font-size:12px;color:var(--muted)}
.lc .nx{font-size:12px}
.lc .nx.late{color:var(--neg)}
.chip.st-new{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.st-won{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.st-lost{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.lost{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.trow:last-child{border-bottom:0}
.trow input[type=checkbox]{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--accent)}
.trow .tt{flex:1;min-width:0;cursor:pointer}
.trow .tt .m{font-size:12px;color:var(--muted)}
.trow.done .tt b{text-decoration:line-through;color:var(--muted)}
.trow .due{font-family:var(--font-num);font-size:12px;white-space:nowrap}
.trow .due.late{color:var(--neg);font-weight:600}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:16px 0 6px}
.box{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
dialog.wide{width:min(860px,calc(100vw - 24px))}
.dlg2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.dlg2{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .card{padding:12px}
.feed{display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto}
.fi{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.fi:last-child{border-bottom:0}
.fi .h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.fi .tx{white-space:pre-wrap;margin-top:2px}
.fi.ev .tx{color:var(--muted)}
.addnote{display:flex;flex-direction:column;gap:6px}
.addnote .r{display:flex;gap:6px}
.addnote .r select{width:auto}
.links{display:flex;flex-direction:column;gap:4px;font-size:13px}
.links a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--line);cursor:pointer;align-self:flex-start}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink)}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto}
.toolbar input[type=checkbox]{min-width:0;width:auto}
.qadd{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px auto;gap:8px;margin:18px 0 6px}
@media (max-width:700px){.qadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qadd input:first-child{grid-column:1/-1}}
.like-btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}
.acc-tbl td,.acc-tbl th{white-space:nowrap}
 .acc-tbl select{width:auto}
.users-tbl{table-layout:fixed}.users-tbl th,.users-tbl td{white-space:normal;overflow-wrap:anywhere}.users-tbl select{width:100%;max-width:100%}.users-tbl td:last-child button{margin:2px}.users-tbl td:last-child{text-align:left}.users-tbl th:nth-child(1){width:15%}.users-tbl th:nth-child(2){width:9%}.users-tbl th:nth-child(3){width:13%}.users-tbl th:nth-child(4){width:14%}.users-tbl th:nth-child(5){width:21%}.users-tbl th:nth-child(6){width:13%}.users-tbl th:nth-child(7){width:15%}.users-tbl .chip{white-space:normal}
@media(max-width:900px){.users-tbl{min-width:780px}.users-wrap{overflow-x:auto}}
dialog.xwide{width:min(1040px,calc(100vw - 24px))}
@media (max-width:700px){dialog.xwide{width:100vw;max-height:100vh;border-radius:0}}
.ohead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ohead h2{margin:0 0 2px}
.ohead-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:200px}
.ready{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.ready .meter{width:120px;margin:0}
.otabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.otabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 10px;color:var(--muted);font-weight:500}
.otabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.otabs button:disabled{opacity:.45;cursor:default}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fg3 .full{grid-column:1/-1}.fg3 .span2{grid-column:span 2}
@media (max-width:700px){.fg3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fg3 .span2{grid-column:1/-1}}
.pane h3{margin:4px 0 8px}
.r2{display:flex;gap:8px;align-items:center}
.r2 select,.r2 input{flex:1}
.owners{display:flex;flex-direction:column;gap:8px}
.owner{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--sunk)}
.owner.new{background:var(--surface)}
.tips{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tip{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.tip:last-child{border-bottom:0}
.tip input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.tip span{flex:1}.tip.done span{text-decoration:line-through;color:var(--muted)}
.tip button{padding:4px 10px;font-size:12px}
.tip.rec{background:var(--sunk)}.tip .rec-i{flex:none;font-size:16px;color:var(--accent);width:18px;text-align:center}
details.remind{margin:0 0 14px}details.remind summary{cursor:pointer;list-style:none}details.remind summary::-webkit-details-marker{display:none}
.trow button{padding:4px 10px;font-size:12px}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.ph{position:relative;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph a{display:block;width:100%;height:100%}
.ph-main{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
.ph-bar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;padding:4px;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.ph-bar button{padding:2px 7px;font-size:12px;background:rgba(255,255,255,.92);color:#15201C;border:0}
.ph-bar button:disabled{opacity:.4}
.ph-add{cursor:pointer;border-style:dashed;color:var(--muted);font-weight:600}
.ph-add:hover{border-color:var(--accent);color:var(--accent)}
pre.xml{white-space:pre-wrap;word-break:break-all;font:11px/1.4 var(--font-num);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px;max-height:300px;overflow:auto}
.tbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:var(--neg);color:#fff;font-size:11px;text-align:center;margin-left:3px}
.lnk{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--muted);cursor:pointer;font-size:12px}
.ochip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.os-draft{--oc:#6B7671;--ob:#E9EDEB}.os-active{--oc:#1D7A45;--ob:#DDF1E4}.os-paused{--oc:#9A6400;--ob:#F6ECD6}
.os-deposit{--oc:#2456A6;--ob:#E0EAF8}.os-failed{--oc:#B0302A;--ob:#F7E3E1}.os-sold{--oc:#5B3FA0;--ob:#ECE6F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .os-draft{--oc:#A9B5B0;--ob:#25302C} :root:not([data-theme="light"]) .os-active{--oc:#62CC8F;--ob:#18301F} :root:not([data-theme="light"]) .os-paused{--oc:#E2B458;--ob:#352A14} :root:not([data-theme="light"]) .os-deposit{--oc:#8DB4F2;--ob:#1B2740} :root:not([data-theme="light"]) .os-failed{--oc:#F08A80;--ob:#3A1D1B} :root:not([data-theme="light"]) .os-sold{--oc:#B9A3EE;--ob:#2A2140}}
.ochip{color:var(--oc);background:var(--ob)}
select.ostsel{width:auto;font-weight:600;color:var(--oc);background:var(--ob);border-color:transparent}
.stbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ost{color:var(--oc);background:var(--ob);border-color:transparent;font-size:12px;padding:5px 10px;border-radius:999px}
.ost b{font-family:var(--font-num);margin-left:4px}
.ost[aria-pressed="true"]{outline:2px solid var(--oc);outline-offset:1px}



/* v5: липкие заголовки таблиц, цвет раздела */
header.top{background:var(--hdr,var(--bg));border-top:4px solid var(--accent)}
.tbl-wrap{max-height:calc(100dvh - 210px);overflow:auto}
.tbl-wrap thead th{position:sticky;top:0;z-index:2}
.report thead th:first-child{z-index:3}
dialog .tbl-wrap{max-height:none}
.brand .sect-badge{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);vertical-align:3px}
@media (max-width:700px){.tbl-wrap{max-height:calc(100dvh - 140px)}.report th:first-child,.report td:first-child{min-width:130px;max-width:150px}}

:root{--hdr:#E8EDF7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hdr:#122019}}
:root[data-theme="dark"]{--hdr:#122019}
.grpseg{margin:0 0 12px;flex-wrap:wrap}
.grpseg button{flex:0 1 auto}

/* переключатель CRM / Финансы */

/* меню пользователя */
.me-wrap{position:relative}

.who .me-chip:hover{border-color:var(--muted)}
.me-chip .nm{display:flex;flex-direction:column;line-height:1.2;text-align:left;color:var(--muted)}.me-chip .nm b{color:var(--ink);font-size:13px}
.ava{border-radius:50%;object-fit:cover;flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font-weight:700;vertical-align:middle}
.me-menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 28px rgba(0,0,0,.14);padding:6px;z-index:30;display:flex;flex-direction:column}
.me-menu[hidden]{display:none}

.who .me-menu button:hover{background:var(--sunk)}
.me-menu .mh{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:12px;color:var(--muted)}.me-menu .mh b{display:block;color:var(--ink);font-size:14px}
@media (max-width:700px){.me-chip .nm,.me-chip .car{display:none}.who .me-chip{padding:3px}}
.prof-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}

/* DG UI · спокойная светлая тема */
body{font:14px/1.55 var(--font-ui);letter-spacing:-.006em;-webkit-font-smoothing:antialiased}
.wrap{max-width:1320px;padding-inline:24px}

/* ---- шапка: логотип · поиск · действия; меню отдельной строкой ---- */
header.top{background:rgba(243,245,248,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{padding-bottom:0}
.bar{display:flex;align-items:center;gap:16px;padding-block:9px 8px;flex-wrap:nowrap}
.brand{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;flex:none;text-decoration:none;color:inherit;border-radius:8px;padding:3px 8px 3px 3px;transition:background .15s}
.brand:hover{background:var(--sunk)}
.brand:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:750;letter-spacing:-.02em;flex:none}
.brand-tx{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-tx b{font-size:15px;font-weight:700;letter-spacing:-.028em;white-space:nowrap;line-height:1.25}
.brand-tx span{font-size:11px;color:var(--muted);letter-spacing:.01em}
.bar .hsearch{flex:1 1 auto;max-width:560px;min-width:120px}
.bar .right{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
.navbar{display:flex;align-items:center;gap:14px;padding-top:0;margin-top:-2px}
nav.tabs{flex:1 1 auto;display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-size:13px;padding:6px 12px;border:1px solid transparent;border-radius:6px;white-space:nowrap}
nav.tabs a:hover{background:var(--sunk);border-color:transparent;color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.appsw{display:inline-flex;gap:2px;padding:2px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;flex:none;margin-bottom:6px}
.appsw a{display:block;font-size:12px;font-weight:600;padding:5px 11px;border-radius:5px;text-decoration:none;color:var(--muted)}
.appsw a:hover{color:var(--ink)}
.appsw a[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:var(--sh-sm)}
.appsw a i{display:none}
button,input,select,textarea{border-radius:6px}
button{box-shadow:none;font-weight:550;transition:background .15s,border-color .15s,color .15s}
button:hover{transform:none;border-color:#AAB7C9;background:var(--sunk)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
button.primary:hover{background:#45639D;border-color:#45639D}
input,select,textarea{padding:8px 11px;border-color:var(--line);background:var(--surface)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);outline-offset:0;border-color:var(--accent)}
.card,.tile,.tbl-wrap{border-radius:var(--r);border-color:var(--line);box-shadow:var(--sh-sm)}
.card{padding:18px}
.tile{padding:16px 18px;gap:6px}
.tile:hover{transform:none;box-shadow:var(--sh)}
.tile .k{font-size:12px;font-weight:500}
.tile .v{font-size:24px;letter-spacing:-.035em;font-weight:700}
.tile.hero{background:var(--accent);border-color:var(--accent)}
h2{font-size:18px;letter-spacing:-.02em;margin-top:26px}
h3{font-size:11px;letter-spacing:.065em}
th{font-size:11px;letter-spacing:.045em;color:var(--muted);font-weight:650;background:var(--sunk)}
td{font-size:13px}
tbody tr:hover{background:#F7F9FC}
.chip{border-radius:5px;font-size:11px;padding:3px 8px}
.seg,.grpseg{background:var(--sunk);border-radius:7px;padding:3px;gap:2px}
.seg button,.grpseg button{border:0;background:transparent;box-shadow:none;border-radius:5px;padding:6px 11px}
.seg button[aria-pressed="true"],.grpseg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);border-color:transparent;box-shadow:var(--sh-sm)}
.toolbar{gap:10px}
dialog,.dlg{border-radius:12px}
.note,.muted{color:var(--muted)}
@media (max-width:760px){.wrap{padding-inline:14px}.card{padding:14px}.tile{padding:14px}.brand b{font-size:18px}}


/* Задачи: рабочая область и канбан */
.task-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 14px}
.task-stats>div{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 15px;display:flex;flex-direction:column}
.task-stats b{font-size:22px;line-height:1.2;letter-spacing:-.03em}.task-stats span{font-size:12px;color:var(--muted);margin-top:3px}.task-stats .danger b{color:var(--neg)}
.task-toolbar{align-items:end}.task-toolbar .grow{min-width:190px}
.task-board{display:grid;grid-template-columns:repeat(6,minmax(220px,1fr));gap:10px;overflow-x:auto;padding:2px 2px 14px;align-items:start}
.task-col{background:var(--sunk);border:1px solid var(--line);border-radius:9px;min-width:220px;transition:border-color .15s,background .15s}
.task-col>header{display:flex;align-items:center;justify-content:space-between;padding:12px 13px;font-size:12px;font-weight:650;color:var(--muted)}
.task-col>header b{min-width:23px;text-align:center;background:var(--surface);border-radius:6px;padding:2px 5px;color:var(--ink)}
.task-col-body{padding:0 8px 8px;min-height:80px}.task-empty{text-align:center;color:var(--muted);font-size:12px;padding:26px 4px}
.task-col.is-overdue>header{color:var(--neg)}.task-col.dragover{background:var(--accent-soft);border-color:var(--accent)}
.task-card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:11px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh-sm)}
.task-card:hover{border-color:#B4C0D1}.task-card.dragging{opacity:.45}.task-card-top{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.4}.task-card-top input{flex:none;width:15px;margin-top:2px}
.task-link{font-size:11px;color:var(--accent);margin-top:8px;line-height:1.4}.task-note{font-size:11px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-card footer{display:flex;justify-content:space-between;gap:8px;margin-top:11px;font-size:10px;color:var(--muted)}.task-card .late{color:var(--neg);font-weight:650}.task-card .today{color:var(--warn);font-weight:650}
/* Звонки и обращения */
.comm-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 14px}.comm-summary>div{padding:14px 16px;border:1px solid var(--line);border-radius:9px;background:var(--surface);display:flex;flex-direction:column;gap:4px}.comm-summary span{font-size:12px;color:var(--muted)}.comm-summary b{font-size:23px;letter-spacing:-.03em}.comm-summary .needs-action{border-color:#D9C797;background:var(--warn-soft)}
.comm-toolbar .grow{min-width:180px}.comm-table td{vertical-align:top}.comm-table tr.is-new{background:#F5F8FC}.small{font-size:11px;margin-top:3px}
.object-chip{display:inline-block;max-width:210px;color:var(--accent);font-weight:600;font-size:12px;line-height:1.4;cursor:pointer}.category-chip{display:inline-block;padding:4px 8px;border-radius:7px;background:var(--sunk);font-size:11px;color:var(--muted)}.category-chip.lead{background:var(--accent-soft);color:var(--accent)}.category-chip.spam{background:var(--neg-soft);color:var(--neg)}.category-chip.new{background:var(--warn-soft);color:var(--warn)}
.inq-section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}.section-head h2{margin:0}.section-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.inq-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.inq-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:15px;cursor:pointer;box-shadow:var(--sh-sm)}.inq-card:hover{border-color:#B4C0D1;box-shadow:var(--sh)}
.inq-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.inq-card time{font-size:11px;color:var(--muted)}.inq-card>b{display:block;font-size:14px}.inq-object{margin-top:11px;font-size:12px;color:var(--accent);font-weight:600;line-height:1.45}.inq-result{font-size:12px;color:var(--muted);margin-top:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.inq-card footer{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:13px;font-size:11px;color:var(--muted)}
@media(max-width:1000px){.inq-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.comm-table{overflow-x:auto}.task-toolbar{flex-wrap:wrap}}
@media(max-width:680px){.task-stats,.comm-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.inq-grid{grid-template-columns:1fr}.task-board{grid-template-columns:repeat(6,240px)}.section-head{align-items:flex-start;flex-direction:column}.task-stats b,.comm-summary b{font-size:20px}}

.task-quick>div{display:flex;gap:6px;flex-wrap:wrap}.task-quick button{font-size:11px;padding:5px 9px}

/* ===== Обсуждения и общий поиск ===== */
.hsearch{position:relative;flex:1 1 240px;max-width:420px;min-width:160px}
.hsearch input{width:100%;padding:7px 12px 7px 34px;border-radius:7px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.hsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.hsearch .kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--sunk)}
.bell{position:relative}
.bell .n{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;border-radius:9px;background:var(--neg);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.srch{position:fixed;inset:0;z-index:60;background:rgba(20,30,50,.34);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:8vh 16px 16px}
.srch.on{display:flex}
.srch-box{width:100%;max-width:720px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 60px rgba(16,26,45,.24);overflow:hidden;display:flex;flex-direction:column;max-height:76vh}
.srch-top{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.srch-top input{flex:1;border:0;background:transparent;font-size:15px;padding:4px 0}
.srch-top input:focus{outline:none;box-shadow:none}
.srch-body{overflow-y:auto;padding:8px 8px 12px}
.srch-group{margin:6px 0 2px;padding:6px 10px 4px;font-size:11px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.srch-item{display:flex;gap:11px;padding:9px 11px;border-radius:6px;cursor:pointer;align-items:flex-start}
.srch-item:hover,.srch-item.on{background:var(--sunk)}
.srch-ic{width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.srch-tx{flex:1;min-width:0}
.srch-tx b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-tx .m{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srch-tx .hit{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.45}
.srch-empty{padding:34px 16px;text-align:center;color:var(--muted);font-size:13px}
.srch-foot{padding:8px 14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
/* обсуждение */
.disc-card h3{margin-bottom:10px}
.disc-list{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.disc-item{display:flex;gap:10px}
.disc-av{width:28px;height:28px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.disc-b{flex:1;min-width:0}
.disc-h{display:flex;align-items:baseline;gap:8px;font-size:12px}
.disc-h b{font-size:13px}
.disc-h time{color:var(--muted);font-size:11px;margin-left:auto}
.disc-h .del{color:var(--muted);cursor:pointer;text-decoration:none;font-size:11px}
.disc-tx{font-size:13px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:3px}
.disc-tx .mn{color:var(--accent);font-weight:600;background:var(--accent-soft);border-radius:5px;padding:0 3px}
.disc-files{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.disc-file{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:5px;background:var(--sunk);color:var(--ink);text-decoration:none;max-width:240px}
.disc-file:hover{border-color:var(--muted)}
.disc-file span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc-editor{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px}
.disc-editor textarea{width:100%;border:0;resize:vertical;min-height:56px;font-size:13px;padding:4px;background:transparent}
.disc-editor textarea:focus{outline:none;box-shadow:none}
.disc-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.disc-bar .grow{flex:1}
.disc-att{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.disc-att:hover{border-color:var(--muted)}
.disc-staged{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.disc-staged .f{display:inline-flex;align-items:center;gap:6px;font-size:11px;background:var(--accent-soft);color:var(--accent);border-radius:7px;padding:3px 8px}
.disc-staged .f b{cursor:pointer;font-weight:700}
.ment{position:absolute;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:7px;box-shadow:0 12px 30px rgba(16,26,45,.18);padding:4px;min-width:200px;max-height:220px;overflow-y:auto;display:none}
.ment.on{display:block}

.ment button:hover,.ment button.on{background:var(--sunk)}
.disc-empty{font-size:12px;color:var(--muted);padding:4px 0 10px}

/* ===== футер и реквизиты ===== */
.site-foot{margin-top:40px;border-top:1px solid var(--line);background:var(--surface)}
.site-foot .in{max-width:1320px;margin:0 auto;padding:18px 24px;display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;justify-content:space-between}
.site-foot nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.site-foot a{font-size:13px;color:var(--muted);text-decoration:none}
.site-foot a:hover{color:var(--accent)}
.site-foot .req{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);border:1px solid var(--accent-soft);background:var(--accent-soft);padding:7px 12px;border-radius:6px;text-decoration:none}
.site-foot .req:hover{filter:brightness(.97)}
.site-foot .copy{font-size:12px;color:var(--muted);width:100%}
@media (max-width:760px){.site-foot .in{padding:16px 14px}}
/* карточка доступа к объекту */
.access-card{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:14px;margin-top:12px}
.access-card h3{margin-bottom:10px}
.keycheck{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 11px;border-radius:7px;font-size:13px}
.keycheck.ok{background:var(--pos-soft);color:var(--pos)}
.keycheck.warn{background:var(--warn-soft);color:var(--warn)}
.keycheck.none{background:var(--sunk);color:var(--muted)}
.keycheck .grow{flex:1}
</style></head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="/" id="brandhome" aria-label="Дорогой Город — на главный экран">
        <span class="brand-mark" aria-hidden="true">ДГ</span>
        <span class="brand-tx"><b>Дорогой Город</b><span id="brand-sub">CRM</span></span>
      </a>
      <div class="hsearch"><span class="ic" aria-hidden="true">🔍</span><input id="gsearch" placeholder="Поиск: клиент, телефон, сделка, объект, wiki…" autocomplete="off" aria-label="Общий поиск"><span class="kbd">Ctrl K</span></div>
      <div class="right">
        <button class="bell" id="bell" type="button" title="Уведомления" aria-label="Уведомления">🔔<span class="n" id="bell-n" hidden>0</span></button>
        <button class="primary" id="addbtn" data-need-w>+ Заявка</button>
        <div class="who" id="who"></div>
      </div>
    </div>
    <div class="navbar">
      <nav class="tabs" id="tabs" aria-label="Разделы CRM"></nav>
      <nav class="appsw" id="appsw" aria-label="Раздел системы"><a href="/" class="sw-crm" aria-current="page">CRM</a><a href="/finance" class="sw-fin">Финансы</a></nav>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="srch" id="srch" role="dialog" aria-modal="true" aria-label="Поиск по CRM">
  <div class="srch-box">
    <div class="srch-top"><span style="color:var(--muted)">🔍</span><input id="srch-q" placeholder="Клиент, телефон, объект, сделка, задача, материал wiki…" autocomplete="off"><button type="button" class="ghost" id="srch-close">Закрыть</button></div>
    <div class="srch-body" id="srch-body"><div class="srch-empty">Начните вводить запрос — ищем по всей CRM, звонкам и справочнику.</div></div>
    <div class="srch-foot"><span>↑ ↓ — выбрать · Enter — открыть · Esc — закрыть</span><span id="srch-count"></span></div>
  </div>
</div>
<dialog id="dlg"><form class="dlg" id="dlgform" method="dialog"></form></dialog>
<datalist id="sources"></datalist>
<div class="toast" id="toast" hidden></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU');
const money=n=>(n===''||n==null)?'':NF.format(Math.round(+n||0))+' ₽';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const nowLocal=()=>{const d=new Date();return ymd(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes())};
const dFmt=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(2,4):'';
const dtFmt=ms=>{const d=new Date(ms);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dueLbl=t=>{if(!t.due)return '';const td=today();if(t.due===td)return 'сегодня'+(t.time?' '+t.time:'');if(t.due===addDays(td,1))return 'завтра'+(t.time?' '+t.time:'');return dFmt(t.due)+(t.time?' '+t.time:'')};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}

const DEAL_KINDS=['Вторичка','Новостройка','Коммерция','Аренда','Загородная','Юр. сопровождение'];
const DEAL_ST={work:'В работе',deal:'Договор подписан',closed:'Закрыта',lost:'Сорвалась'};
const CP_TYPES=[['owner','Собственник'],['buyer','Покупатель'],['tenant','Арендатор'],['agent','Агент'],['partner','Партнёр'],['founder','Учредитель'],['employee','Сотрудник'],['investor','Инвестор'],['contractor','Подрядчик'],['service','Сервис / поставщик'],['bank','Банк'],['outagent','Агент другого агентства']];
const CP_GROUPS=[['clients','Клиенты'],['partners','Партнёры и сервисы'],['team','Команда'],['other','Прочие']];
function cpGroup(c){const t=c.types||[];if(t.some(x=>['agent','founder','employee'].includes(x)))return 'team';if(t.some(x=>['owner','buyer','tenant','investor'].includes(x)))return 'clients';if(t.some(x=>['partner','contractor','service','bank','outagent'].includes(x)))return 'partners';if(D.leads.some(l=>l.clientId===c.id)||D.deals.some(d=>d.clientId===c.id)||D.objects.some(o=>(o.owners||[]).includes(c.id)))return 'clients';return 'other'}
const SOURCES=['Рекомендация','Повторный клиент','Авито','ЦИАН','Яндекс Недвижимость','Сайт dorogoigorod.ru','Сайт fedset.ru','Instagram / Reels','Telegram','Звонок','Партнёр / агент','Застройщик'];
const OPEN_STAGES=['new','work','show','talks'];

let D=null, ME=null, version=null, saving=0, dlgCtx=null;
const V={tab:(location.hash||'').slice(1)||'calls', lf:{owner:'',q:'',kind:'',lost:false}, cf:{q:'',type:'',quiet:30,open:true,grp:'clients'}, of:{q:'',kind:'',offer:'',status:'work',resp:''}, tf:{who:'me',done:false,view:'list',q:'',link:''}, df:{q:'',st:'open'}, clf:{view:'todo',mine:false,type:'all',q:''}};
try{const tv=localStorage.getItem('dg_task_view');if(tv==='board'||tv==='list')V.tf.view=tv}catch(_){}
const can=()=>!!ME&&(ME.role==='owner'||ME.role==='staff');
const fin=()=>!!ME&&(ME.finance==='view'||ME.finance==='edit');
const finW=()=>!!ME&&ME.finance==='edit';
const owner=()=>!!ME&&ME.role==='owner';

/* ---------- сервер ---------- */
async function api(fn,...args){
  let r;try{r=await fetch('/api/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(args)})}
  catch(e){throw new Error('Нет связи с сервером. Проверьте интернет.')}
  if(r.status===401){location.href='/login';throw new Error('Сессия закончилась.')}
  let d=null;try{d=await r.json()}catch(_){}
  if(!r.ok)throw new Error((d&&d.error)||('Ошибка сервера ('+r.status+')'));
  return d.result}
async function run(fn,...args){saving++;try{const res=await api(fn,...args);if(res&&res.version!=null&&res.leads)apply(res);return res}catch(e){toast(e.message);throw e}finally{saving--}}
function apply(d){D=d;version=d.version;ME=d.me;document.body.classList.toggle('ro',!can());renderHead();render();if(dlgCtx&&dlgCtx.refresh)dlgCtx.refresh()}

/* ---------- справочники ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const cl=id=>D&&byId(D.clients,id);
const clName=id=>{const c=cl(id);return c?c.name:''};
const usr=id=>D&&D.users.find(u=>u.id===id);
const uName=id=>{const u=usr(id);return u?u.name:''};
const obj=id=>D&&byId(D.objects,id);
const objName=o=>o?(o.title||o.address||'Объект'):'';
const lead=id=>D&&byId(D.leads,id);
const deal=id=>D&&byId(D.deals,id);
const dealName=d=>d?((d.client||clName(d.clientId)||'Сделка')+(d.object?' · '+d.object:'')):'';
const openTasks=f=>D.tasks.filter(t=>!t.done&&f(t)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'').localeCompare(b.time||''));
const nextTask=f=>openTasks(f)[0];
const agentsList=()=>D.clients.filter(c=>(c.types||[]).includes('agent')).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(l)}</option>`).join('');
const usersOpt=sel=>opt(D.users.filter(u=>u.active||u.id===sel).map(u=>[u.id,u.name]),sel);
const clientsOpt=(sel,empty)=>{const by={};D.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).forEach(c=>{(by[cpGroup(c)]=by[cpGroup(c)]||[]).push(c)});
  return opt([['',empty||'— не выбран —']],sel)+CP_GROUPS.filter(([g])=>by[g]).map(([g,l])=>`<optgroup label="${l}">${opt(by[g].map(c=>[c.id,c.name]),sel)}</optgroup>`).join('')};
const objectsOpt=sel=>opt([['','— не выбран —'],...D.objects.map(o=>[o.id,objName(o)+(o.status!=='active'?' ('+(D.dict.objStatus[o.status]||'')+')':'')])],sel);

/* ---------- шапка и вкладки ---------- */
const TABS=()=>[['calls','Звонки и обращения'+(D&&D.newCalls?` <b class="tbadge">${D.newCalls}</b>`:'')],['leads','Заявки'],['tasks','Задачи'],['clients','Клиенты'],['objects','Объекты'],['deals','Сделки'],['kb','Справочник']];
function renderHead(){
  // переключатель разделов видят только те, кому открыт раздел «Финансы»
  const sw=$('#appsw'); if(sw) sw.style.display=fin()?'':'none';
  const sub=$('#brand-sub'); if(sub) sub.textContent=fin()?'CRM и финансы':'CRM';
  $('#who').innerHTML=ME?meChip(ME.roleName):'';
  if(ME&&ME.mustChange&&!openPw.shown){openPw.shown=true;setTimeout(()=>openPw(true),300)}
}
function render(){
  if(!TABS().some(t=>t[0]===V.tab))V.tab='calls';
  $('#tabs').innerHTML=TABS().map(([k,l])=>`<a href="#${k}" data-tab="${k}" ${V.tab===k?'aria-current="page"':''}>${l}</a>`).join('');
  $('#addbtn').textContent={leads:'+ Заявка',tasks:'+ Задача',clients:'+ Клиент',objects:'+ Объект',deals:'+ Сделка',inqs:'+ Обращение'}[V.tab]||'+ Заявка';
  $('#addbtn').hidden=!can()||['admin','calls','kb'].includes(V.tab);
  if(!D){$('#app').innerHTML='<div class="card empty" style="margin-top:18px">Загружаю…</div>';return}
  const keep=document.activeElement&&document.activeElement.id,pos=keep&&document.activeElement.selectionStart;
  $('#app').innerHTML=({today:vToday,leads:vLeads,tasks:vTasks,clients:vClients,objects:vObjects,deals:vDeals,calls:vCalls,admin:vAdmin,kb:vKb}[V.tab])();
  if(keep){const el=document.getElementById(keep);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
  discMount();
}

/* ---------- Сегодня ---------- */
function taskRow(t){
  const late=t.due&&t.due<today();
  const link=t.leadId&&lead(t.leadId)?'Заявка: '+lead(t.leadId).title:t.clientId&&cl(t.clientId)?'Клиент: '+clName(t.clientId):t.dealId&&deal(t.dealId)?'Сделка: '+dealName(deal(t.dealId)):t.objectId&&obj(t.objectId)?'Объект: '+objName(obj(t.objectId)):'';
  return `<div class="trow ${t.done?'done':''}"><input type="checkbox" data-done="${esc(t.id)}" ${t.done?'checked':''} ${can()?'':'disabled'} aria-label="Выполнено">
    <div class="tt" data-open-task="${esc(t.id)}"><b>${esc(t.title)}</b><div class="m">${esc([link,V.tf.who==='all'||V.tab!=='tasks'||t.assigneeId!==ME.id?taskWho(t):''].filter(Boolean).join(' · '))}</div></div>
    <div class="due ${late&&!t.done?'late':''}">${esc(dueLbl(t))}</div></div>`}
function objLast(o,k){const oc=(D.objContact||{})[o.id]||{};if(k==='owner_report')return oc.report||0;return Math.max(oc.call||0,oc.report||0,...(o.owners||[]).map(id=>lastC(id)))}
function objReminders(){
  const out=[],now=Date.now(),R=D.dict.obj.recurring||{owner_call:7,owner_report:14};
  for(const o of D.objects){if(!['active','deposit','paused'].includes(o.status))continue;const since=o.activeSince||o.createdAt;
    for(const [k,days] of Object.entries(R)){const last=objLast(o,k),ref=last||since,d=Math.floor((now-ref)/864e5);
      if(d>=days){const tip=(o.tips||[]).find(t=>t.key===k),tk=tip&&tip.taskId&&D.tasks.find(t=>t.id===tip.taskId&&!t.done);
        out.push({o,k,d,last,tk})}}}
  return out.sort((a,b)=>b.d-a.d)}
function objRemindHtml(list){if(!list.length)return '';
  return `<div class="grp">Собственники ждут новостей</div><div class="box tlist">${list.map(x=>`<div class="trow"><div class="tt" data-open-object="${esc(x.o.id)}"><b>${x.k==='owner_report'?'Отчёт собственнику':'Связаться с собственником'}</b><div class="m">${esc(objName(x.o))} · ${esc(uName(x.o.responsibleId)||'без ответственного')}</div></div>
    <div class="due late">${x.last?x.d+' дн. назад':'ещё не было'}</div>${x.tk?'<span class="muted" style="font-size:12px">задача есть</span>':can()?`<button type="button" data-obj-remind="${esc(x.o.id)}" data-what="${x.k}">Задача</button>`:''}</div>`).join('')}</div>`}
function vToday(){
  const td=today(),mine=isMine;
  const late=openTasks(t=>mine(t)&&t.due&&t.due<td),now=openTasks(t=>mine(t)&&t.due===td),soon=openTasks(t=>mine(t)&&t.due>td&&t.due<=addDays(td,7));
  const open=D.leads.filter(l=>OPEN_STAGES.includes(l.stage)),fresh=open.filter(l=>l.stage==='new');
  const noStep=open.filter(l=>!nextTask(t=>t.leadId===l.id));
  let h=`<div class="tiles">
    <div class="tile click" data-go="tasks"><span class="k">Мои задачи на сегодня</span><span class="v">${now.length}</span><span class="s">${late.length?`<span class="neg">просрочено: ${late.length}</span>`:'просроченных нет'}</span></div>
    <div class="tile click" data-go="leads"><span class="k">Заявки в работе</span><span class="v">${open.length}</span><span class="s">новых: ${fresh.length}</span></div>
    <div class="tile click" data-go="leads"><span class="k">Заявки без следующего шага</span><span class="v ${noStep.length?'warn':''}">${noStep.length}</span><span class="s">нет открытой задачи</span></div>
    <div class="tile click" data-go="objects"><span class="k">Объекты в работе</span><span class="v">${D.objects.filter(o=>o.status==='active').length}</span><span class="s">всего в базе: ${D.objects.length}</span></div></div>`;
  h+=`<div class="cols">`;
  h+=`<div><div class="grp">Мои задачи</div>`;
  if(!late.length&&!now.length&&!soon.length)h+=`<div class="card empty">На ближайшую неделю задач нет.</div>`;
  if(late.length)h+=`<div class="grp neg" style="margin-top:6px">Просрочено</div><div class="box tlist">${late.map(taskRow).join('')}</div>`;
  if(now.length)h+=`<div class="grp">Сегодня</div><div class="box tlist">${now.map(taskRow).join('')}</div>`;
  if(soon.length)h+=`<div class="grp">Ближайшие 7 дней</div><div class="box tlist">${soon.map(taskRow).join('')}</div>`;
  const cr=clientReminders(6),orm=objReminders();
  if(cr.bd.length||cr.quiet.length||orm.length)h+=`<div class="grp" style="margin-top:18px">Напоминания</div>${objRemindHtml(orm.slice(0,8))}${remindHtml(cr,true)}`;
  h+=`</div><div><div class="grp">Новые заявки</div>${fresh.length?`<div class="box tlist">${fresh.map(l=>`<div class="trow"><div class="tt" data-open-lead="${esc(l.id)}"><b>${esc(l.title)}</b><div class="m">${esc([l.source,uName(l.ownerId),dFmt(new Date(l.createdAt).toISOString().slice(0,10))].filter(Boolean).join(' · '))}</div></div></div>`).join('')}</div>`:'<div class="card empty">Новых заявок нет.</div>'}
    ${noStep.length?`<div class="grp">Нет следующего шага</div><div class="box tlist">${noStep.slice(0,12).map(l=>`<div class="trow"><div class="tt" data-open-lead="${esc(l.id)}"><b>${esc(l.title)}</b><div class="m">${esc(D.dict.stages[l.stage])} · ${esc(uName(l.ownerId)||'без ответственного')}</div></div></div>`).join('')}</div>`:''}</div></div>`;
  return h}

/* ---------- Заявки ---------- */
function vLeads(){
  const f=V.lf,q=f.q.trim().toLowerCase();
  let list=D.leads.filter(l=>(!f.owner||String(l.ownerId)===f.owner)&&(!f.kind||l.kind===f.kind)&&(!q||(l.title+' '+clName(l.clientId)+' '+(cl(l.clientId)||{}).phone+' '+l.source+' '+l.note).toLowerCase().includes(q)));
  const st=Object.entries(D.dict.stages).filter(([k])=>k!=='lost'||f.lost);
  let h=`<div class="toolbar"><label class="f grow"><span>Поиск</span><input id="lf-q" value="${esc(f.q)}" placeholder="Клиент, телефон, источник"></label>
    <label class="f"><span>Ответственный</span><select id="lf-owner">${opt([['','Все'],...D.users.filter(u=>u.active).map(u=>[u.id,u.name])],f.owner)}</select></label>
    <label class="f"><span>Тип</span><select id="lf-kind">${opt([['','Все'],...Object.entries(D.dict.leadKinds)],f.kind)}</select></label>
    <label class="checks" style="align-self:center"><label><input type="checkbox" id="lf-lost" ${f.lost?'checked':''}> Показать отказы</label></label></div>`;
  h+=`<div class="board">${st.map(([k,lbl])=>{const items=list.filter(l=>l.stage===k);const sum=items.reduce((s,l)=>s+(+l.budget||0),0);
    return `<div class="col" data-stage="${k}"><div class="col-h"><span>${esc(lbl)}</span><small>${items.length}${sum?' · '+NF.format(Math.round(sum/1e6*10)/10)+' млн':''}</small></div>
      ${items.map(leadCard).join('')||'<div class="muted" style="font-size:12px;padding:4px">Пусто</div>'}</div>`}).join('')}</div>
    <p class="note">Перетаскивайте карточки между колонками, чтобы сменить этап. На телефоне этап меняется в карточке заявки.</p>`;
  return h}
function leadCard(l){
  const t=nextTask(x=>x.leadId===l.id),late=t&&t.due&&t.due<today();
  return `<div class="lc" data-open-lead="${esc(l.id)}" ${can()?'draggable="true"':''} data-lead="${esc(l.id)}">
    <b>${esc(l.title)}</b>
    <div class="m">${esc([D.dict.leadKinds[l.kind],l.budget?money(l.budget):'',l.source].filter(Boolean).join(' · '))}</div>
    <div class="m">${esc(uName(l.ownerId)||'без ответственного')}</div>
    ${l.stage==='lost'?`<div class="m neg">${esc(l.lostReason)}</div>`:l.stage==='won'?(l.dealId?'<div class="m pos">Сделка создана</div>':''):t?`<div class="nx ${late?'late':''}">→ ${esc(t.title)}${t.due?' · '+esc(dueLbl(t)):''}</div>`:'<div class="nx warn">Нет следующего шага</div>'}
  </div>`}

/* ---------- Задачи ---------- */
function vTasks(){
  const f=V.tf,td=today(),who=t=>f.who==='all'||isMine(t);
  f.view=f.view||'list';f.q=f.q||'';f.link=f.link||'';f.due=f.due||'';
  const q=f.q.trim().toLowerCase();
  const match=t=>who(t)&&(!f.link||(f.link==='lead'?t.leadId:f.link==='deal'?t.dealId:f.link==='object'?t.objectId:f.link==='client'?t.clientId:!t.leadId&&!t.dealId&&!t.objectId&&!t.clientId))&&(!q||[t.title,t.note,taskWho(t),taskLink(t)].join(' ').toLowerCase().includes(q));
  const open=D.tasks.filter(t=>!t.done&&match(t)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'').localeCompare(b.time||''));
  const done=D.tasks.filter(t=>t.done&&match(t)).sort((a,b)=>(b.doneAt||b.updatedAt||0)-(a.doneAt||a.updatedAt||0));
  const late=open.filter(t=>t.due&&t.due<td).length,todayN=open.filter(t=>t.due===td).length,week=open.filter(t=>t.due&&t.due<=addDays(td,7)).length;
  let h=`<div class="task-stats"><div><b>${open.length}</b><span>в работе</span></div><div class="${late?'danger':''}"><b>${late}</b><span>просрочено</span></div><div><b>${todayN}</b><span>на сегодня</span></div><div><b>${week}</b><span>на 7 дней</span></div></div>`;

function readiness(o){const res=['flat','house'].includes(o.kind);
  const chk=[['адрес',!!o.address],['цена',o.price!==''&&o.price!=null],['площадь',!!o.area],['ответственный',!!o.responsibleId],['собственник',(o.owners||[]).length>0],

  const multi={};form.querySelectorAll('input[type=checkbox][data-multi]').forEach(el=>{(multi[el.name]=multi[el.name]||[]);if(el.checked)multi[el.name].push(el.value)});Object.assign(o,multi)}
const acts=(del)=>`<div class="acts" style="margin-top:4px"><div>${del&&can()?`<button type="button" class="danger" data-del>${dlgCtx&&dlgCtx.confirmDel?'Точно удалить?':'Удалить'}</button>`:''}</div><div><button type="button" data-close>${can()?'Отмена':'Закрыть'}</button>${can()?'<button type="submit" class="primary">Сохранить</button>':''}</div></div>`;

// боковая панель: задачи и история
function sidePanel(link){
  const ts=openTasks(t=>Object.entries(link).some(([k,v])=>v&&t[k]===v));
  return `<div class="side"><div class="card"><h3>Задачи</h3>${ts.length?`<div class="box tlist" style="margin-bottom:8px">${ts.map(taskRow).join('')}</div>`:'<p class="muted" style="margin:0 0 8px;font-size:13px">Открытых задач нет.</p>'}
      ${can()?`<div class="addnote"><input id="st-title" placeholder="Следующий шаг: позвонить, показ…"><div class="r"><input id="st-due" type="date" value="${today()}"><select id="st-who">${usersOpt(ME.id)}</select><button type="button" data-side-task>+</button></div></div>`:''}</div>
    <div class="card"><h3>История</h3>${can()?`<div class="addnote"><div class="r"><select id="nt-type">${opt(Object.entries(D.dict.actTypes).filter(([k])=>k!=='event'),'call')}</select><input type="datetime-local" id="nt-at" value="${nowLocal()}" max="${nowLocal()}" title="Когда это было" aria-label="Когда это было"></div><textarea id="nt-text" rows="2" placeholder="Что обсудили, договорённости…"></textarea><div class="r" style="justify-content:flex-end"><button type="button" data-add-note>Добавить запись</button></div></div>`:''}
      <div class="feed" id="feed"><p class="muted" style="font-size:13px">Загружаю…</p></div></div></div>`}
async function loadFeed(){if(!dlgCtx||!dlgCtx.feed)return;const ctx=dlgCtx;
  try{const items=await api('listActivities',ctx.feed);if(dlgCtx!==ctx)return;
    $('#feed').innerHTML=items.length?items.map(a=>`<div class="fi ${a.type==='event'?'ev':''}"><div class="h"><span>${esc(D.dict.actTypes[a.type]||'')}${a.userName?' · '+esc(a.userName):''}</span><span>${dtFmt(a.at)}${(a.userId===ME.id||owner())&&a.type!=='event'&&can()?` <a href="#" data-del-act="${esc(a.id)}" title="Удалить" style="color:var(--muted)">✕</a>`:''}</span></div><div class="tx">${esc(a.text)}${a.url?` <a class="lnk" href="${esc(a.url)}" target="_blank" rel="noopener">▶ запись</a>`:''}</div></div>`).join(''):'<p class="muted" style="font-size:13px;margin:0">Записей пока нет.</p>'}
  catch(e){$('#feed').innerHTML='<p class="neg">'+esc(e.message)+'</p>'}}

  const ls=c?D.leads.filter(l=>l.clientId===c.id):[],ds=c?D.deals.filter(d=>d.clientId===c.id):[],os=c?D.objects.filter(o=>o.ownerId===c.id):[];

/* объект */
const OBJ_PANES=[['main','Основное'],['access','Доступ к объекту'],['files','Фото и документы'],['own','Собственники и документы'],['par','Параметры'],['promo','Продвижение и расходы'],['ads','Площадки'],['inq','Обращения'],['hist','Задачи и история']];
function openObject(o,pane){
  const OD=D.dict.obj;
  const x=o?JSON.parse(JSON.stringify(o)):{id:'',title:'',address:'',metro:'',kind:'flat',offer:'sale',status:'draft',responsibleId:ME.id,source:'',price:'',area:'',owners:[],tips:[],expenses:[],windows:[],yard:[],parking:[]};
  if(!x.tips||!x.tips.length)x.tips=OD.tips.map(([key,title])=>({key,title,done:false,taskId:''}));
  Object.keys(OD.recurring||{}).forEach(k=>{if(!x.tips.some(t=>t.key===k)){const d=OD.tips.find(t=>t[0]===k);if(d)x.tips.push({key:k,title:d[1],done:false,taskId:''})}});
  if(!Array.isArray(x.priceHistory))x.priceHistory=[];
  ['owners','expenses','windows','yard','parking'].forEach(k=>{if(!Array.isArray(x[k]))x[k]=[]});
  openDlg({kind:'object',orig:o||null,o:x,wide:true,xwide:true,pane:pane||'main',newOwners:[],inq:null,files:null,cian:null,feed:o?{objectId:o.id}:null,draw:drawObject,
    refresh:()=>{if(dlgCtx.orig){const n=obj(dlgCtx.orig.id);if(n)dlgCtx.orig=n}}});
  if(o){loadInq();loadFiles()}
}
async function loadInq(){const c=dlgCtx;if(!c||c.kind!=='object'||!c.orig)return;
  try{c.inq=await api('listInquiries',c.orig.id);if(dlgCtx===c){const el=$('#inq-list');if(el)el.innerHTML=inqList()}}catch(e){toast(e.message)}}
function chk(name,dict,vals){return `<div class="checks">${Object.entries(dict).map(([k,l])=>`<label><input type="checkbox" name="${name}" data-multi value="${k}" ${(vals||[]).includes(k)?'checked':''}> ${esc(l)}</label>`).join('')}</div>`}

const ACC_WHO=[['keys','Ключи у нас'],['tenant','Арендатор'],['owner','Собственник приезжает сам'],['proxy','Доверенное лицо собственника']];
function accessPane(x,o){
  const a=x.access||{};const who=a.who||'';const moves=(a.keysMoves||[]).slice().reverse();

    <label class="f full"><span>Комментарий по доступу</span><input name="acc_note" value="${esc(a.accessNote||'')}" placeholder="Например: звонить за час, код домофона — у арендатора" ${can()?'':'disabled'}></label></div></div>

      ${moves.length?`<div class="tbl-wrap" style="margin-top:6px"><table><tbody>${moves.map(m=>`<tr><td class="num">${dtFmt(m.at)}</td><td>${m.from?esc(m.from)+' → ':''}<b>${esc(m.to)}</b>${m.note?'<div class="muted" style="font-size:11px">'+esc(m.note)+'</div>':''}</td><td class="muted" style="font-size:12px">${esc(m.by||'')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted" style="font-size:12px;margin:6px 0 0">Переходов ещё не было.</p>'}
      ${can()?`<div class="r2" style="margin-top:8px;flex-wrap:wrap"><input id="km-to" placeholder="Кому передали, например: Иван" style="flex:1;min-width:160px"><input id="km-note" placeholder="Комментарий" style="flex:1;min-width:160px"><button type="button" data-key-move>Записать передачу</button></div>`:''}
    </div>

  </div>`:''}`;

function priceHistHtml(x){const h=(x.priceHistory||[]).slice().sort((a,b)=>a.at-b.at);
  const start=h[0],cur=h.length?h[h.length-1]:null,tot=start&&cur&&start.price?Math.round((cur.price-start.price)/start.price*1000)/10:0;
  const rows=h.map((e,i)=>{const prev=h[i-1],ch=prev&&prev.price?Math.round((e.price-prev.price)/prev.price*1000)/10:null;
    return `<tr><td class="num">${dFmt(new Date(e.at).toISOString().slice(0,10))}</td><td class="r num">${money(e.price)}</td><td class="r num ${ch<0?'neg':ch>0?'pos':''}">${ch==null?'<span class="muted">старт</span>':(ch>0?'+':'')+ch+'%'}</td><td class="muted">${esc(e.note||'')}</td><td>${can()?`<button type="button" class="ghost" data-ph-del="${i}" title="Удалить запись">✕</button>`:''}</td></tr>`}).join('');
  return `<h3 style="margin-top:14px">История цены</h3>
    ${h.length?`<div class="tbl-wrap"><table><thead><tr><th>Дата</th><th class="r">Цена</th><th class="r">Изменение</th><th>Комментарий</th><th></th></tr></thead><tbody>${rows}</tbody>
      ${h.length>1?`<tfoot><tr class="tot"><td>Итого</td><td class="r num">${money(cur.price-start.price)}</td><td class="r num ${tot<0?'neg':tot>0?'pos':''}">${tot>0?'+':''}${tot}%</td><td colspan="2" class="muted">от стартовой ${money(start.price)} за ${Math.round((cur.at-start.at)/864e5)} дн.</td></tr></tfoot>`:''}</table></div>`
      :'<p class="muted" style="margin:0;font-size:13px">Появится после сохранения цены. Каждое изменение цены записывается автоматически.</p>'}
    ${can()?`<details style="margin-top:6px"><summary class="muted" style="font-size:12px;cursor:pointer">Добавить прошлую цену (если объект был в работе до CRM)</summary><div class="r2" style="margin-top:6px"><input type="date" id="ph-date"><input type="number" id="ph-price" placeholder="Цена, ₽"><input id="ph-note" placeholder="Комментарий"><button type="button" data-ph-add>Добавить</button></div></details>`:''}`}
async function saveObjectDlg(close){const c=dlgCtx;readObjForm();const x=c.o;
  if(!String(x.title||'').trim()&&!String(x.address||'').trim()){c.pane='main';c.draw();return toast('Укажите название или адрес.')}
  if(x.status!=='draft'&&(x.description||'').length&&(x.description||'').length<300)toast('Описание короче 300 символов — для объявления лучше дописать.');
  const body=Object.assign({},x,{id:c.orig?c.orig.id:undefined,responsibleId:x.responsibleId?Number(x.responsibleId):null,lifts:x.lifts});
  saving++;try{const r=await api('saveObject',body,c.newOwners.filter(n=>String(n.name||'').trim()));c.newOwners=[];apply(r.data);
    if(dlgCtx===c){c.orig=r.object;c.o=JSON.parse(JSON.stringify(r.object));if(!c.feed){c.feed={objectId:r.object.id};}if(close)dlg.close();else{c.draw();loadFeed();if(c.inq==null)loadInq();if(c.files==null)loadFiles();if(c.pane==='ads')loadCian()}}
    c.dirty=false;toast('Объект сохранён')}catch(e){toast(e.message)}finally{saving--}}

function readObjForm(){readForm();const c=dlgCtx;
  if(c.o){const a=Object.assign({},c.o.access||{});let touched=false;
    ['acc_who','acc_proxyName','acc_proxyPhone','acc_note','acc_keysAt'].forEach(k=>{if(k in c.o){touched=true;const key={acc_who:'who',acc_proxyName:'proxyName',acc_proxyPhone:'proxyPhone',acc_note:'accessNote',acc_keysAt:'keysAt'}[k];a[key]=c.o[k];delete c.o[k]}});
    if(touched||c.o.access)c.o.access=a}if(c.o.liftsNone===true)c.o.lifts='none';else if(c.o.liftsNone===false&&c.o.lifts==='none')c.o.lifts='';delete c.o.liftsNone;
  form.querySelectorAll('[data-nown]').forEach(el=>{const n=c.newOwners[+el.dataset.nown];if(n)n[el.dataset.k]=el.value});
  form.querySelectorAll('[data-exp]').forEach(el=>{const e=c.o.expenses[+el.dataset.exp];if(e)e[el.dataset.k]=el.dataset.k==='amount'?(el.value===''?'':+el.value):el.value})}
form.addEventListener('click',async e=>{const c=dlgCtx;if(!c||c.kind!=='object')return;const b=e.target.closest('button,a');if(!b)return;const x=c.o;

    a.keysAt=to.trim();a.keysMoves=[...(a.keysMoves||[]),{id:'km_'+Date.now().toString(36),from,to:to.trim(),note:note.trim(),by:ME.name}];
    c.o.access=a;c.draw();toast('Передача записана — не забудьте сохранить объект');return}

/* сохранение */
async function submit(){
  readForm();const c=dlgCtx,x=c.o;
  try{
    if(c.kind==='lead'){if(!x.clientId&&!String(x.newClientName||'').trim())return toast('Выберите клиента или впишите имя нового.');
      if(x.stage==='lost'&&!String(x.lostReason||'').trim()){c.draw();return toast('Укажите причину отказа.')}
      dlg.close();await run('saveLead',Object.assign({},x,{id:c.orig?c.orig.id:undefined,ownerId:x.ownerId?Number(x.ownerId):null}));toast('Заявка сохранена')}
    else if(c.kind==='client'){if(!x.name.trim())return toast('Укажите имя.');dlg.close();await run('crmSaveClient',Object.assign({},c.orig||{},x,{id:c.orig?c.orig.id:'cl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:c.orig?c.orig.createdAt:Date.now()}));toast('Клиент сохранён')}
    else if(c.kind==='object'){await saveObjectDlg(false)}
    else if(c.kind==='task'){if(!x.title.trim())return toast('Напишите, что сделать.');dlg.close();await run('saveTask',Object.assign({},x,{id:c.orig?c.orig.id:undefined,assigneeId:Number(x.assigneeId),coIds:(x.coIds||[]).map(Number).filter(id=>id!==Number(x.assigneeId)),done:!!x.done}));toast('Задача сохранена')}
    else if(c.kind==='deal'){const o=c.orig;const extra=[x.agent2Id,x.agent3Id].filter(Boolean).map(a=>Object.assign({agentId:a},((o&&o.extra)||[]).find(e=>e.agentId===a)||{}));
      const ids=[x.agentId,...extra.map(e=>e.agentId)].filter(Boolean);if(new Set(ids).size!==ids.length)return toast('Один и тот же агент выбран дважды.');
      if(!x.clientId)return toast('Выберите клиента.');
      if(!o){dlg.close();await run('crmCreateDeal',{clientId:x.clientId,objectId:x.objectId,object:x.object,kind:x.kind,status:x.status,date:x.date,expected:x.expected,note:x.note,agentId:x.agentId,extra,commission:finW()?x.commission:''});toast('Сделка создана');return}
      dlg.close();await run('crmSaveDeal',Object.assign({},o,{clientId:x.clientId,objectId:x.objectId,object:x.object,kind:x.kind,status:x.status,date:x.date,expected:x.expected,note:x.note,agentId:x.agentId,extra},finW()?{commission:x.commission}:{}));toast('Сделка сохранена')}
    else if(c.kind==='call'){if(c.mode==='link'&&!x.clientId)return toast('Выберите клиента.');dlg.close();await run('resolveCall',c.call.id,c.mode,Object.assign({},x,{ownerId:x.ownerId?Number(x.ownerId):null}));CALLS.list=null;render();toast(c.mode==='lead'?'Заявка создана':'Номер привязан к клиенту')}
    else if(c.kind==='inq'){await submitInq()}
    else if(c.kind==='kbitem'){await submitKb()}
    else if(c.kind==='links'){await submitLinks()}
    else if(c.kind==='company'){await submitCompany()}
    else if(c.kind==='coimport'){await submitCoImport()}
    else if(c.kind==='todeal'){dlg.close();await run('leadToDeal',c.lead.id,x);toast('Сделка создана');V.tab='deals';location.hash='deals';render()}
  }catch(_){}
}
async function del(){const c=dlgCtx;if(!c.confirmDel){c.confirmDel=true;readForm();c.draw();return}
  const fn={lead:'deleteLead',client:'crmDeleteClient',object:'deleteObject',task:'deleteTask'}[c.kind];if(!fn)return;
  dlg.close();try{await run(fn,c.orig.id);toast('Удалено')}catch(_){}}

// фото уменьшаем в браузере: до 2560 px по длинной стороне (JPEG) + превью 480 px
async function shrink(file,max,q){
  let bmp;try{bmp=await createImageBitmap(file)}catch(_){
    const url=URL.createObjectURL(file);try{bmp=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})}catch(e){throw new Error('Не удалось открыть «'+file.name+'». Сохраните фото как JPG и загрузите снова.')}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
  const w=bmp.width,h=bmp.height,k=Math.min(1,max/Math.max(w,h));const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(r,'image/jpeg',q))}
async function uploadFiles(kind,list){const c=dlgCtx;if(!c||!c.orig)return;const st=()=>$('#up-status');let n=0;

    try{let body=file,mime=file.type||'application/octet-stream',name=file.name,thumb=null;
      if(kind!=='doc'){body=await shrink(file,2560,.86);thumb=await shrink(file,480,.8);mime='image/jpeg';name=name.replace(/\.(heic|heif|png|webp|jpe?g)$/i,'')+'.jpg'}
      const q=new URLSearchParams({objectId:c.orig.id,kind,mime,name});if(kind==='doc')q.set('docType',$('#doc-type').value);
      const r=await fetch('/upload?'+q,{method:'POST',credentials:'same-origin',body});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка загрузки');
      if(thumb){await fetch('/upload?'+new URLSearchParams({objectId:c.orig.id,thumbFor:d.result.id}),{method:'POST',credentials:'same-origin',body:thumb})}
    }catch(e){toast(e.message)}}
  if(st())st().textContent='';await loadFiles();toast('Загружено')}

  const F=V.clf||(V.clf={view:'todo',mine:false,type:'all',q:''}),mine=c=>!F.mine||c.userId===ME.id;
  const base=CALLS.list.filter(mine),todoAll=base.filter(c=>c.status==='new'),spamAll=base.filter(c=>c.status==='spam');
  const byPhone={};todoAll.forEach(c=>{const g=byPhone[c.phone]||(byPhone[c.phone]={n:0,lost:0,last:c});g.n++;if(c.lost)g.lost++;if(c.at>g.last.at)g.last=c});
  let rows=F.view==='todo'?Object.values(byPhone).map(g=>Object.assign({},g.last,{_n:g.n,_lost:g.lost})):F.view==='spam'?spamAll:base.filter(c=>c.status!=='spam');
  rows.sort((a,b)=>b.at-a.at);

  if(F.type==='objects')rows=rows.filter(c=>callCategory(c).kind==='object');
  if(F.type==='services')rows=rows.filter(c=>callCategory(c).kind==='lead');
  if(F.type==='new')rows=rows.filter(c=>c.status==='new');
  if(q)rows=rows.filter(c=>[c.phone,c.vnumber,clName(c.clientId),callCategory(c).text,c.emp].join(' ').toLowerCase().includes(q));
  const nTodo=Object.keys(byPhone).length,withObj=base.filter(c=>callCategory(c).kind==='object').length;
  const dirChip=c=>c.dir==='in'?(c.lost?'<span class="chip out">пропущен</span>':'<span class="chip in">входящий</span>'):'<span class="chip">исходящий</span>';
  const ST={new:'<span class="chip work">не разобран</span>',ignored:'<span class="chip">не клиент</span>',spam:'<span class="chip out">спам</span>',lead:'<span class="chip deal">заявка</span>',linked:''};
  const vOwner=c=>{let d=String(c.vnumber||'').replace(/\D/g,'');if(d.length===11&&d[0]==='8')d='7'+d.slice(1);const id=(D.vnums||{})[d];return id?uName(id):''};
  const acts=c=>!can()?'':c.status==='new'?`<div class="call-acts"><button type="button" class="primary" data-call-obj="${esc(c.id)}">По объекту</button><button type="button" data-call-lead="${esc(c.id)}">Заявка</button><button type="button" data-call-link="${esc(c.id)}">Это клиент…</button><button type="button" class="ghost" data-call-ignore="${esc(c.id)}">Не клиент</button><button type="button" class="ghost neg" data-call-spam="${esc(c.id)}">Спам</button></div>`:c.status==='spam'?`<div class="call-acts"><button type="button" class="ghost" data-call-unspam="${esc(c.id)}">Не спам</button></div>`:c.dir==='in'?`<div class="call-acts"><button type="button" class="ghost" data-call-obj="${esc(c.id)}">→ объект</button>${c.status==='ignored'?`<button type="button" class="ghost neg" data-call-spam="${esc(c.id)}">Спам</button>`:''}</div>`:'';
  const inquiries=(IQ.list||[]).filter(i=>{if(F.mine&&i.userId!==ME.id)return false;if(F.type==='objects')return true;if(F.type==='services'||F.type==='new')return false;if(!q)return true;return [i.name,i.phone,i.channel,i.result,objName(obj(i.objectId))].join(' ').toLowerCase().includes(q)}).sort((a,b)=>b.at-a.at).slice(0,60);
  let h=`<div class="comm-summary"><div><span>Звонков за 60 дней</span><b>${base.length}</b></div><div><span>По объектам</span><b>${withObj}</b></div><div class="${nTodo?'needs-action':''}"><span>Ждут разбора</span><b>${nTodo}</b></div><div><span>Обращений</span><b>${(IQ.list||[]).length}</b></div></div>
  <div class="toolbar comm-toolbar"><div class="seg"><button data-clv="todo" aria-pressed="${F.view==='todo'}">Неразобранные <b>${nTodo}</b></button><button data-clv="all" aria-pressed="${F.view==='all'}">Все</button><button data-clv="spam" aria-pressed="${F.view==='spam'}">Спам</button></div>
    <div class="seg"><button data-clm="0" aria-pressed="${!F.mine}">Все сотрудники</button><button data-clm="1" aria-pressed="${F.mine}">Мои</button></div>
    <label class="f"><span>Показать</span><select id="cl-type">${opt([['all','Все звонки'],['objects','По объектам'],['services','По услугам'],['new','Только неразобранные']],F.type)}</select></label>
    <label class="f grow"><span>Поиск</span><input id="cl-q" value="${esc(F.q)}" placeholder="Телефон, клиент, объект"></label></div>`;
  if(!rows.length)h+='<div class="card empty">Под выбранные условия звонков нет.</div>';
  else h+=`<div class="tbl-wrap comm-table"><table><thead><tr><th>Когда</th><th>Звонок</th><th>Номер</th><th>Объект / категория</th><th>Клиент</th><th class="r">Разговор</th><th>Сотрудник</th><th>Запись</th>${can()?'<th>Действия</th>':''}</tr></thead><tbody>${rows.map(c=>{const cat=callCategory(c),inq=callInquiry(c);return `<tr class="${c.status==='new'?'is-new':''}"><td class="num">${dtFmt(c.at)}</td><td>${dirChip(c)}${c._n>1?`<div class="muted small">звонков: ${c._n}${c._lost?', пропущено: '+c._lost:''}</div>`:''}</td><td><span class="num">${esc(ph(c.phone))}</span>${c.vnumber?`<div class="muted small">на ${esc(ph(c.vnumber))}${vOwner(c)?' · '+esc(vOwner(c)):''}</div>`:''}</td><td>${inq?`<a class="object-chip" data-inq-open="${esc(inq.id)}" title="Открыть обращение">${esc(cat.text)}</a>`:`<span class="category-chip ${cat.kind}">${esc(cat.text)}</span>`}</td><td>${c.clientId&&cl(c.clientId)?`<a class="lnk" data-open-client="${esc(c.clientId)}">${esc(clName(c.clientId))}</a>`:'<span class="muted">—</span>'}<div>${ST[c.status]||''}</div></td><td class="r num">${c.lost?'':mmss(c.talk)}</td><td>${esc(c.userId?uName(c.userId):(c.emp||'—'))}</td><td>${c.rec?`<a class="lnk" href="${esc(c.rec)}" target="_blank" rel="noopener">▶ слушать</a>`:'<span class="muted">—</span>'}</td>${can()?`<td>${acts(c)}</td>`:''}</tr>`}).join('')}</tbody></table></div>`;
  h+=`<section class="inq-section"><div class="section-head"><div><h2>Обращения по объектам</h2><p>Результат разбора звонков: кто звонил, по какому объекту и что решили.</p></div>${can()?'<button class="primary" data-inq-new>+ Обращение</button>':''}</div>`;
  h+=inquiries.length?`<div class="inq-grid">${inquiries.map(i=>{const o=obj(i.objectId),st=(D.dict.obj.inqStages||{})[i.stage]||i.stage;return `<article class="inq-card" data-inq-open="${esc(i.id)}"><div class="inq-card-top"><span class="chip deal">${esc(i.channel||'Звонок')}</span><time>${dtFmt(i.at)}</time></div><b>${esc(i.name||i.phone||'Без имени')}</b><div class="num muted">${esc(ph(i.phone))}</div><div class="inq-object">${esc(o?objName(o):'Объект не найден')}</div><div class="inq-result">${esc(i.result||i.note||'Результат пока не заполнен')}</div><footer><span class="chip work">${esc(st)}</span><span>${esc(i.userName||'')}</span></footer></article>`}).join('')}</div>`:'<div class="card empty">Обращений по объектам пока нет. Разберите звонок кнопкой «По объекту».</div>';
  return h+'</section>'}

function people(){const P={};
  IQ.list.forEach(q=>{const k=q.clientId||key10(q.phone)||q.id;const p=P[k]||(P[k]={k,items:[],clientId:q.clientId,phone:q.phone,name:'',who:'buyer',agency:''});
    p.items.push(q);if(q.who==='agent')p.who='agent';if(q.agency)p.agency=q.agency;if(!p.name&&q.name)p.name=q.name;if(!p.phone&&q.phone)p.phone=q.phone});
  return Object.values(P).map(p=>{p.items.sort((a,b)=>b.at-a.at);p.last=p.items[0].at;p.lead=p.items.find(i=>i.leadId);
    p.refused=p.items.some(i=>i.svc==='refused');p.offered=p.items.some(i=>i.svc==='offered');p.cand=p.who!=='agent'&&!p.lead&&!p.refused;
    p.notFit=p.items.some(i=>D.dict.obj.inqClosed.includes(i.stage)&&i.stage!=='deal');

function md(src){const inl=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(https:\/\/[^\s<]+)/g,'<a class="lnk" href="$1" target="_blank" rel="noopener">$1</a>');
  const out=[];let list=null,para=[];
  const fl=()=>{if(list){out.push(`<${list.t}>${list.items.map(i=>`<li>${inl(i)}</li>`).join('')}</${list.t}>`);list=null}};
  const fp=()=>{if(para.length){out.push(`<p>${para.map(inl).join('<br>')}</p>`);para=[]}};
  String(src||'').split(/\r?\n/).forEach(line=>{const l=line.trim();let m;
    if(!l){fp();fl();return}
    if((m=l.match(/^#{1,3}\s+(.*)/))){fp();fl();out.push(`<h4>${inl(m[1])}</h4>`);return}
    if((m=l.match(/^[-•*]\s+(.*)/))){fp();if(!list||list.t!=='ul'){fl();list={t:'ul',items:[]}}list.items.push(m[1]);return}
    if((m=l.match(/^\d+[.)]\s+(.*)/))){fp();if(!list||list.t!=='ol'){fl();list={t:'ol',items:[]}}list.items.push(m[1]);return}
    fl();para.push(l)});
  fp();fl();return out.join('')}
