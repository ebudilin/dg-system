const DISC = { ent: null, id: null, data: null, staged: [], ment: [], mentIdx: 0, mentQ: '' };

function discAttachHost(host, entity, entityId) {
  host.innerHTML = '<div class="disc-list" id="disc-list"><p class="muted" style="font-size:12px">Загружаю обсуждение…</p></div>'
    + '<div class="disc-editor"><textarea id="disc-text" placeholder="Комментарий… @ — упомянуть сотрудника"></textarea>'
    + '<div class="ment" id="disc-ment"></div>'
    + '<div class="disc-staged" id="disc-staged"></div>'
    + '<div class="disc-bar"><label class="disc-att">📎 Файл<input type="file" id="disc-file" multiple hidden></label>'
    + '<span class="grow"></span><button type="button" class="primary" id="disc-send">Отправить</button></div></div>';
  DISC.ent = entity; DISC.id = entityId; DISC.data = null; DISC.staged = []; DISC.ment = [];
  const send = () => discSend();
  host.querySelector('#disc-send').addEventListener('click', send);
  host.querySelector('#disc-text').addEventListener('input', discInput);
  host.querySelector('#disc-text').addEventListener('keydown', discKeys);
  host.querySelector('#disc-text').addEventListener('blur', () => setTimeout(() => { const m = host.querySelector('#disc-ment'); if (m) m.classList.remove('on'); }, 180));
  host.querySelector('#disc-file').addEventListener('change', discUpload);
  loadDisc();
}
async function loadDisc() {
  const host = document.getElementById('disc-list');
  if (!host || !DISC.ent) return;
  try {
    DISC.data = await api('listComments', DISC.ent, DISC.id);
    renderDisc();
  } catch (e) { host.innerHTML = '<p class="neg" style="font-size:12px">' + esc(e.message) + '</p>'; }
}
function discText(t, people) {
  // Подсветка упоминаний: имена из списка сотрудников.
  let out = esc(t);
  const names = (people || []).map(p => p.name).filter(Boolean).sort((a, b) => b.length - a.length);
  for (const n of names) {
    const safe = esc(n).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp('@' + safe, 'g'), '<span class="mn">@' + safe + '</span>');
  }
  return out;
}
function renderDisc() {
  const host = document.getElementById('disc-list');
  if (!host || !DISC.data) return;
  const d = DISC.data;
  host.innerHTML = d.items.length ? d.items.map(c => {
    const mine = ME && (c.userId === ME.id || owner());
    const f = (c.files || []).map(x => `<a class="disc-file" href="/cfiles/${esc(x.id)}" target="_blank" rel="noopener">📎<span>${esc(x.name)}</span></a>`).join('');
    return `<div class="disc-item"><div class="disc-av">${esc((c.userName || '?').slice(0, 2).toUpperCase())}</div>`
      + `<div class="disc-b"><div class="disc-h"><b>${esc(c.userName || 'Сотрудник')}</b><time>${dtFmt(c.at)}</time>`
      + (mine ? `<a href="#" class="del" data-disc-del="${esc(c.id)}" title="Удалить">✕</a>` : '') + `</div>`
      + `<div class="disc-tx">${discText(c.text, d.people)}</div>${f ? '<div class="disc-files">' + f + '</div>' : ''}</div></div>`;
  }).join('') : '<div class="disc-empty">Обсуждения пока нет. Напишите первый комментарий.</div>';
  const ed = document.getElementById('disc-text');
  if (ed) {
    ed.disabled = !d.canWrite;
    ed.placeholder = d.canWrite ? 'Комментарий… @ — упомянуть сотрудника' : 'Только просмотр';
    const sb = document.getElementById('disc-send'); if (sb) sb.hidden = !d.canWrite;
    const fl = document.querySelector('.disc-att'); if (fl) fl.hidden = !d.canWrite;
  }
  renderStaged();
}
function renderStaged() {
  const box = document.getElementById('disc-staged');
  if (!box) return;
  box.innerHTML = DISC.staged.map(f => `<span class="f">📎 ${esc(f.name)} <b data-unstage="${esc(f.id)}">✕</b></span>`).join('');
}
async function discUpload(e) {
  const files = [...(e.target.files || [])];
  e.target.value = '';
  if (!files.length) return;
  for (const f of files) {
    if (f.size > 25e6) { toast(f.name + ': файл больше 25 МБ'); continue; }
    try {
      const url = '/cupload?name=' + encodeURIComponent(f.name) + '&mime=' + encodeURIComponent(f.type || 'application/octet-stream');
      const r = await fetch(url, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': f.type || 'application/octet-stream' }, body: f });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Не удалось загрузить файл');
      DISC.staged.push(d.result);
    } catch (err) { toast(err.message); }
  }
  renderStaged();
}
function discInput(e) {
  const ta = e.target, val = ta.value, pos = ta.selectionStart;
  const before = val.slice(0, pos);
  const m = before.match(/@([\wА-Яа-яЁё\s-]{0,30})$/);
  const box = document.getElementById('disc-ment');
  if (!m || !DISC.data || !DISC.data.canWrite) { if (box) box.classList.remove('on'); return; }
  DISC.mentQ = m[1].trim().toLowerCase();
  const people = DISC.data.people.filter(p => !DISC.mentQ || p.name.toLowerCase().includes(DISC.mentQ)).slice(0, 6);
  if (!people.length) { box.classList.remove('on'); return; }
  DISC.mentList = people; DISC.mentIdx = 0;
  box.innerHTML = people.map((p, i) => `<button type="button" data-ment="${p.id}" class="${i === 0 ? 'on' : ''}">${esc(p.name)}</button>`).join('');
  box.classList.add('on');
}
function discKeys(e) {
  const box = document.getElementById('disc-ment');
  const open = box && box.classList.contains('on');
  if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
    e.preventDefault();
    const n = DISC.mentList.length;
    DISC.mentIdx = (DISC.mentIdx + (e.key === 'ArrowDown' ? 1 : n - 1)) % n;
    [...box.querySelectorAll('button')].forEach((b, i) => b.classList.toggle('on', i === DISC.mentIdx));
    return;
  }
  if (open && e.key === 'Enter') { e.preventDefault(); const p = DISC.mentList[DISC.mentIdx]; if (p) insertMention(p); return; }
  if (open && e.key === 'Escape') { box.classList.remove('on'); return; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); discSend(); }
}
function insertMention(p) {
  const ta = document.getElementById('disc-text');
  const pos = ta.selectionStart, val = ta.value, before = val.slice(0, pos);
  const m = before.match(/@([\wА-Яа-яЁё\s-]{0,30})$/);
  const start = m ? pos - m[0].length : pos;
  ta.value = val.slice(0, start) + '@' + p.name + ' ' + val.slice(pos);
  ta.focus();
  const np = start + p.name.length + 2;
  ta.setSelectionRange(np, np);
  if (!DISC.ment.some(x => x.id === p.id)) DISC.ment.push({ id: p.id, name: p.name });
  const box = document.getElementById('disc-ment'); if (box) box.classList.remove('on');
}
async function discSend() {
  const ta = document.getElementById('disc-text');
  if (!ta || !DISC.data || !DISC.data.canWrite) return;
  const text = ta.value.trim();
  if (!text && !DISC.staged.length) { toast('Напишите комментарий или приложите файл.'); return; }
  // Упоминания берём и из текста: имена, совпавшие с сотрудниками.
  const byName = {};
  (DISC.data.people || []).forEach(p => byName[p.name.toLowerCase()] = p);
  const found = {};
  DISC.ment.forEach(m => found[m.id] = m);
  for (const p of (DISC.data.people || [])) if (text.toLowerCase().includes('@' + p.name.toLowerCase())) found[p.id] = p;
  const btn = document.getElementById('disc-send');
  if (btn) btn.disabled = true;
  try {
    DISC.data = await api('addComment', { entity: DISC.ent, entityId: DISC.id, text, mentions: Object.values(found).map(p => ({ id: p.id })), files: DISC.staged.map(f => ({ id: f.id })) });
    DISC.staged = []; DISC.ment = []; ta.value = '';
    renderDisc();
    toast('Комментарий добавлен');
  } catch (e) { toast(e.message); }
  if (btn) btn.disabled = false;
}

/* ================= Общий поиск ================= */
const SRCH = { t: 0, items: [], idx: -1, data: null };
function srchOpen(prefill) {
  const el = document.getElementById('srch');
  if (!el) return;
  el.classList.add('on');
  const q = document.getElementById('srch-q');
  if (prefill != null) q.value = prefill;
  q.focus(); q.select();
  if (q.value.trim().length >= 2) srchRun();
}
function srchClose() {
  const el = document.getElementById('srch');
  if (el) el.classList.remove('on');
}
function srchRun() {
  clearTimeout(SRCH.t);
  SRCH.t = setTimeout(srchFetch, 220);
}
const SRCH_IC = { client: 'К', lead: 'З', deal: 'С', object: 'О', task: 'З', call: '☎', inquiry: 'О', kb: 'W', comment: '💬' };
async function srchFetch() {
  const q = (document.getElementById('srch-q').value || '').trim();
  const body = document.getElementById('srch-body'), cnt = document.getElementById('srch-count');
  if (q.length < 2) { body.innerHTML = '<div class="srch-empty">Введите хотя бы два символа.</div>'; if (cnt) cnt.textContent = ''; SRCH.items = []; return; }
  try {
    const r = await api('search', q);
    SRCH.data = r;
    SRCH.items = [];
    SRCH.idx = -1;
    if (!r.total) { body.innerHTML = '<div class="srch-empty">Ничего не найдено по запросу «' + esc(q) + '».</div>'; if (cnt) cnt.textContent = ''; return; }
    body.innerHTML = r.groups.map(g => '<div class="srch-group">' + esc(g.title) + ' · ' + g.items.length + '</div>'
      + g.items.map(it => {
        const i = SRCH.items.push(it) - 1;
        return `<div class="srch-item" data-si="${i}"><div class="srch-ic">${SRCH_IC[it.type] || '·'}</div><div class="srch-tx"><b>${esc(it.title)}</b>`
          + (it.sub ? '<div class="m">' + esc(it.sub) + '</div>' : '')
          + (it.hit ? '<div class="hit">' + esc(it.hit) + '</div>' : '') + '</div></div>';
      }).join('')).join('');
    if (cnt) cnt.textContent = 'Найдено: ' + r.total;
  } catch (e) {
    body.innerHTML = '<div class="srch-empty">' + esc(e.message) + '</div>';
  }
}
function srchMove(d) {
  const n = SRCH.items.length;
  if (!n) return;
  SRCH.idx = (SRCH.idx + d + n) % n;
  [...document.querySelectorAll('.srch-item')].forEach((el, i) => el.classList.toggle('on', i === SRCH.idx));
  const cur = document.querySelector('.srch-item.on');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: 'nearest' });
}
function srchGo(it) {
  if (!it) return;
  srchClose();
  const go = (tab) => { V.tab = tab; try { history.replaceState(null, '', '#' + tab); } catch (_) { } render(); };
  if (it.type === 'client') { const c = D.clients.find(x => x.id === it.id); if (c) { go('clients'); openClient(c); return; } }
  if (it.type === 'lead') { const l = D.leads.find(x => x.id === it.id); if (l) { go('leads'); openLead(l); return; } }
  if (it.type === 'deal') { const d = D.deals.find(x => x.id === it.id); if (d) { go('deals'); openDeal(d); return; } }
  if (it.type === 'object') { const o = D.objects.find(x => x.id === it.id); if (o) { go('objects'); openObject(o); return; } }
  if (it.type === 'task') { const t = D.tasks.find(x => x.id === it.id); if (t) { go('tasks'); openTask(t); return; } }
  if (it.type === 'call') { go('calls'); return; }
  if (it.type === 'inquiry') { go('calls'); return; }
  if (it.type === 'kb') { V.kb = V.kb || {}; V.kb.sec = 'article'; V.kb.art = it.id; go('kb'); return; }
  if (it.type === 'comment') {
    const map = { task: 'tasks', deal: 'deals', kb: 'kb', object: 'objects', client: 'clients', lead: 'leads' };
    go(map[it.entity] || 'calls');
    if (it.entity === 'kb') { V.kb.art = it.entityId; render(); }
    return;
  }
}

/* ================= Уведомления ================= */
async function bellLoad() {
  try {
    const r = await api('notifications');
    const n = document.getElementById('bell-n');
    if (n) { n.textContent = r.unread; n.hidden = !r.unread; }
    const btn = document.getElementById('bell');
    if (btn) btn.title = r.unread ? r.unread + ' новых уведомлений' : 'Уведомления';
    return r;
  } catch (_) { return null; }
}
async function bellOpen() {
  const r = await bellLoad();
  if (!r) return;
  openDlg({
    kind: 'notif', o: {}, wide: true,
    draw: () => {
      const items = r.items || [];
      form.innerHTML = `<h2>Уведомления</h2>${items.length ? '<div class="disc-list">' + items.map(x => {
        const who = x.by || 'Сотрудник';
        return `<div class="disc-item"><div class="disc-av">${esc(who.slice(0, 2).toUpperCase())}</div><div class="disc-b"><div class="disc-h"><b>${esc(who)}</b><time>${dtFmt(x.at)}</time></div><div class="disc-tx">упомянул вас${x.title ? ' в «' + esc(x.title) + '»' : ''}: ${esc(x.text || '')}</div></div></div>`;
      }).join('') + '</div>' : '<p class="muted">Уведомлений пока нет.</p>'}<div class="acts"><div></div><div><button type="button" data-close>Закрыть</button></div></div>`;
    }
  });
  try { await api('readNotifications'); } catch (_) { }
  bellLoad();
}


/* ---------- логотип: на главный экран ---------- */
(function(){
  const b=document.getElementById('brandhome');
  if(!b)return;
  b.addEventListener('click',e=>{
    // Пока главный экран — «Звонки и обращения». Позже здесь будет личный дашборд сотрудника.
    if(location.pathname!=='/'||!ME)return; // пусть перейдёт по ссылке
    e.preventDefault();
    V.tab='calls';try{history.replaceState(null,'','#calls')}catch(_){}
    render();window.scrollTo({top:0,behavior:'smooth'});
  });
})();

/* ---------- поиск, уведомления, обсуждения: обработчики ---------- */
(function(){
  const g=document.getElementById('gsearch');
  if(g){g.addEventListener('focus',()=>srchOpen(g.value));g.addEventListener('input',()=>{if(!document.getElementById('srch').classList.contains('on'))srchOpen(g.value);const q=document.getElementById('srch-q');q.value=g.value;srchRun()});}
  const sq=document.getElementById('srch-q');
  if(sq){sq.addEventListener('input',srchRun);sq.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();srchMove(1)}
    else if(e.key==='ArrowUp'){e.preventDefault();srchMove(-1)}
    else if(e.key==='Enter'){e.preventDefault();srchGo(SRCH.items[SRCH.idx>=0?SRCH.idx:0])}
    else if(e.key==='Escape'){srchClose()}
  });}
  const sc=document.getElementById('srch-close');if(sc)sc.addEventListener('click',srchClose);
  const box=document.getElementById('srch');
  if(box)box.addEventListener('click',e=>{
    if(e.target===box){srchClose();return}
    const it=e.target.closest('[data-si]');
    if(it){srchGo(SRCH.items[+it.dataset.si])}
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();srchOpen('');return}
    if(e.key==='Escape'){const b=document.getElementById('srch');if(b&&b.classList.contains('on'))srchClose()}
  });
  const bell=document.getElementById('bell');if(bell)bell.addEventListener('click',bellOpen);
  // удаление комментария и снятие вложения
  document.addEventListener('click',async e=>{
    const d=e.target.closest('[data-disc-del]');
    if(d){e.preventDefault();if(!confirm('Удалить комментарий?'))return;try{await api('deleteComment',d.dataset.discDel);loadDisc()}catch(err){toast(err.message)}return}
    const u=e.target.closest('[data-unstage]');
    if(u){e.preventDefault();DISC.staged=DISC.staged.filter(f=>f.id!==u.dataset.unstage);renderStaged();return}
    const m=e.target.closest('[data-ment]');
    if(m){e.preventDefault();const p=(DISC.mentList||[]).find(x=>String(x.id)===m.dataset.ment);if(p)insertMention(p);return}
  });
  const bl=()=>{bellLoad();setInterval(bellLoad,60000)};
  if(document.getElementById('bell'))bl();
})();

/* ---------- запуск ---------- */
async function init(){$('#sources').innerHTML=SOURCES.map(x=>`<option value="${esc(x)}">`).join('');render();
  try{apply(await api('crmLoad'))}catch(e){$('#app').innerHTML=`<div class="banner">Не удалось загрузить данные: ${esc(e.message)}. Обновите страницу.</div>`;return}
  if(location.hash==='#profile'){V.tab='leads';history.replaceState(null,'','#leads');render();openProfile()}
  setInterval(async()=>{if(document.hidden||saving>0||dlgCtx||dragId)return;
    try{const v=await api('getVersion');if(v!==version)apply(await api('crmLoad'))}catch(_){}},20000)}
let draggedTask=null;
app.addEventListener('dragstart',e=>{const c=e.target.closest('[data-task-id]');if(!c||!can())return;draggedTask=c.dataset.taskId;c.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedTask)}});
app.addEventListener('dragend',e=>{const c=e.target.closest('[data-task-id]');if(c)c.classList.remove('dragging');document.querySelectorAll('.task-col.dragover').forEach(x=>x.classList.remove('dragover'));draggedTask=null});
app.addEventListener('dragover',e=>{const col=e.target.closest('[data-task-drop]');if(!col||!draggedTask)return;e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';col.classList.add('dragover')});
app.addEventListener('dragleave',e=>{const col=e.target.closest('[data-task-drop]');if(col&&!col.contains(e.relatedTarget))col.classList.remove('dragover')});
app.addEventListener('drop',e=>{const col=e.target.closest('[data-task-drop]');if(!col||!draggedTask)return;e.preventDefault();const id=draggedTask,bucket=col.dataset.taskDrop;col.classList.remove('dragover');draggedTask=null;moveTask(id,bucket)});

init();
})();
