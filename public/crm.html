<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · Дорогой Город</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>

/* Layout: sticky ledger header with period + tabs; summary tiles over detail tables; wide tables scroll inside their own box */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#15201C; --muted:#5B6863; --line:#D8DFDC;
  --accent:#1F5A48; --accent-ink:#FFFFFF; --accent-soft:#DDEBE5;
  --pos:#1D7A45; --neg:#B0302A; --warn:#9A6400; --pos-soft:#E0F1E6; --neg-soft:#F7E3E1; --warn-soft:#F5ECD8;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#121916; --ink:#E4EBE8; --muted:#95A39D; --line:#28332F;
  --accent:#7CC7AC; --accent-ink:#0C1A15; --accent-soft:#1D3029;
  --pos:#62CC8F; --neg:#F08A80; --warn:#E2B458; --pos-soft:#18301F; --neg-soft:#3A1D1B; --warn-soft:#352A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#121916; --ink:#E4EBE8; --muted:#95A39D; --line:#28332F;
  --accent:#7CC7AC; --accent-ink:#0C1A15; --accent-soft:#1D3029;
  --pos:#62CC8F; --neg:#F08A80; --warn:#E2B458; --pos-soft:#18301F; --neg-soft:#3A1D1B; --warn-soft:#352A14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:6px;margin-left:10px;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who span{line-height:1.25;text-align:right}
.acc-tbl td,.acc-tbl th{white-space:nowrap}
@media (max-width:700px){.who span{display:none}}
.like-btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.period{display:flex;align-items:center;gap:6px}
.period button:not(.primary){width:32px;height:32px;padding:0}
.period{flex-wrap:wrap}
.period .lbl{min-width:132px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--neg);border-color:var(--neg)}
button.ghost{border-color:transparent;background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--font-num)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{letter-spacing:.02em}
h2{font-size:17px;margin:24px 0 10px;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .k,.tile.hero .s{color:var(--accent-ink);opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.total{font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr.sec td{background:var(--sunk);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.in{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.out{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.tr{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.work{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.deal{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.closed{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:18px 0 12px}
.toolbar>*{flex:0 1 auto}
.toolbar .grow{flex:1 1 200px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:80px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(10,16,14,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
@media (max-width:480px){.fg{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts>div{display:flex;gap:8px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-row{display:grid;gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100vw - 32px)}
.note{font-size:12px;color:var(--muted);margin-top:8px;max-width:70ch}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}

/* CRM */
.top .right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sect{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.sect a{padding:6px 14px;text-decoration:none;color:var(--muted);font-weight:500}
.sect a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.who{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.who span{line-height:1.25;text-align:right}
.who button{padding:5px 10px;font-size:12px}
@media (max-width:700px){.who span{display:none}}
body.ro [data-need-w]{display:none!important}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile.click{cursor:pointer}.tile.click:hover{border-color:var(--muted)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:8px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 4px;font-weight:600}
.col-h small{color:var(--muted);font-weight:500;font-family:var(--font-num)}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.lc:hover{border-color:var(--muted)}
.lc[draggable="true"]{cursor:grab}
.lc b{font-weight:600;font-size:13px}
.lc .m{font-size:12px;color:var(--muted)}
.lc .nx{font-size:12px}
.lc .nx.late{color:var(--neg)}
.chip.st-new{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.st-won{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.st-lost{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.lost{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.trow:last-child{border-bottom:0}
.trow input[type=checkbox]{width:18px;height:18px;margin-top:1px;flex:none;accent-color:var(--accent)}
.trow .tt{flex:1;min-width:0;cursor:pointer}
.trow .tt .m{font-size:12px;color:var(--muted)}
.trow.done .tt b{text-decoration:line-through;color:var(--muted)}
.trow .due{font-family:var(--font-num);font-size:12px;white-space:nowrap}
.trow .due.late{color:var(--neg);font-weight:600}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:16px 0 6px}
.box{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
dialog.wide{width:min(860px,calc(100vw - 24px))}
.dlg2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.dlg2{grid-template-columns:minmax(0,1fr)}}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.side .card{padding:12px}
.feed{display:flex;flex-direction:column;gap:0;max-height:340px;overflow:auto}
.fi{padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.fi:last-child{border-bottom:0}
.fi .h{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}
.fi .tx{white-space:pre-wrap;margin-top:2px}
.fi.ev .tx{color:var(--muted)}
.addnote{display:flex;flex-direction:column;gap:6px}
.addnote .r{display:flex;gap:6px}
.addnote .r select{width:auto}
.links{display:flex;flex-direction:column;gap:4px;font-size:13px}
.links a{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--line);cursor:pointer;align-self:flex-start}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink)}
.checks label{display:flex;gap:6px;align-items:center}
.checks input{width:auto}
.toolbar input[type=checkbox]{min-width:0;width:auto}
.qadd{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px auto;gap:8px;margin:18px 0 6px}
@media (max-width:700px){.qadd{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qadd input:first-child{grid-column:1/-1}}
.like-btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;white-space:nowrap}
.acc-tbl td,.acc-tbl th{white-space:nowrap}
.acc-tbl select{width:auto}
dialog.xwide{width:min(1040px,calc(100vw - 24px))}
@media (max-width:700px){dialog.xwide{width:100vw;max-height:100vh;border-radius:0}}
.ohead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.ohead h2{margin:0 0 2px}
.ohead-r{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:200px}
.ready{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}.ready .meter{width:120px;margin:0}
.otabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.otabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:8px 10px;color:var(--muted);font-weight:500}
.otabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.otabs button:disabled{opacity:.45;cursor:default}
.fg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fg3 .full{grid-column:1/-1}.fg3 .span2{grid-column:span 2}
@media (max-width:700px){.fg3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.fg3 .span2{grid-column:1/-1}}
.pane h3{margin:4px 0 8px}
.r2{display:flex;gap:8px;align-items:center}
.r2 select,.r2 input{flex:1}
.owners{display:flex;flex-direction:column;gap:8px}
.owner{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:var(--sunk)}
.owner.new{background:var(--surface)}
.tips{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tip{display:flex;gap:10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.tip:last-child{border-bottom:0}
.tip input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.tip span{flex:1}.tip.done span{text-decoration:line-through;color:var(--muted)}
.tip button{padding:4px 10px;font-size:12px}
.tip.rec{background:var(--sunk)}.tip .rec-i{flex:none;font-size:16px;color:var(--accent);width:18px;text-align:center}
details.remind{margin:0 0 14px}details.remind summary{cursor:pointer;list-style:none}details.remind summary::-webkit-details-marker{display:none}
.trow button{padding:4px 10px;font-size:12px}
.lnk{color:var(--ink);text-decoration:none;border-bottom:1px dashed var(--muted);cursor:pointer;font-size:12px}
.ochip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.os-draft{--oc:#6B7671;--ob:#E9EDEB}.os-active{--oc:#1D7A45;--ob:#DDF1E4}.os-paused{--oc:#9A6400;--ob:#F6ECD6}
.os-deposit{--oc:#2456A6;--ob:#E0EAF8}.os-failed{--oc:#B0302A;--ob:#F7E3E1}.os-sold{--oc:#5B3FA0;--ob:#ECE6F7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .os-draft{--oc:#A9B5B0;--ob:#25302C} :root:not([data-theme="light"]) .os-active{--oc:#62CC8F;--ob:#18301F} :root:not([data-theme="light"]) .os-paused{--oc:#E2B458;--ob:#352A14} :root:not([data-theme="light"]) .os-deposit{--oc:#8DB4F2;--ob:#1B2740} :root:not([data-theme="light"]) .os-failed{--oc:#F08A80;--ob:#3A1D1B} :root:not([data-theme="light"]) .os-sold{--oc:#B9A3EE;--ob:#2A2140}}
.ochip{color:var(--oc);background:var(--ob)}
select.ostsel{width:auto;font-weight:600;color:var(--oc);background:var(--ob);border-color:transparent}
.stbar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.ost{color:var(--oc);background:var(--ob);border-color:transparent;font-size:12px;padding:5px 10px;border-radius:999px}
.ost b{font-family:var(--font-num);margin-left:4px}
.ost[aria-pressed="true"]{outline:2px solid var(--oc);outline-offset:1px}


</style></head>
<body>
<header class="top">
  <div class="wrap" style="padding-bottom:0">
    <div class="bar">
      <div class="brand"><b>Дорогой Город</b><span>Клиенты, заявки, задачи, объекты</span></div>
      <div class="right">
        <nav class="sect" id="sect" aria-label="Разделы"></nav>
        <button class="primary" id="addbtn" data-need-w>+ Заявка</button>
        <div class="who" id="who"></div>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<dialog id="dlg"><form class="dlg" id="dlgform" method="dialog"></form></dialog>
<datalist id="sources"></datalist>
<div class="toast" id="toast" hidden></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU');
const money=n=>(n===''||n==null)?'':NF.format(Math.round(+n||0))+' ₽';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return ymd(d)};
const dFmt=d=>d?d.slice(8,10)+'.'+d.slice(5,7)+'.'+d.slice(2,4):'';
const dtFmt=ms=>{const d=new Date(ms);return pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const dueLbl=t=>{if(!t.due)return '';const td=today();if(t.due===td)return 'сегодня'+(t.time?' '+t.time:'');if(t.due===addDays(td,1))return 'завтра'+(t.time?' '+t.time:'');return dFmt(t.due)+(t.time?' '+t.time:'')};
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,3500)}

const DEAL_KINDS=['Вторичка','Новостройка','Коммерция','Аренда','Загородная','Юр. сопровождение'];
const DEAL_ST={work:'В работе',deal:'Договор подписан',closed:'Закрыта',lost:'Сорвалась'};
const CP_TYPES=[['owner','Собственник'],['buyer','Покупатель'],['tenant','Арендатор'],['agent','Агент'],['partner','Партнёр'],['founder','Учредитель'],['employee','Сотрудник'],['investor','Инвестор']];
const SOURCES=['Рекомендация','Повторный клиент','Авито','ЦИАН','Яндекс Недвижимость','Сайт dorogoigorod.ru','Сайт fedset.ru','Instagram / Reels','Telegram','Звонок','Партнёр / агент','Застройщик'];
const OPEN_STAGES=['new','work','show','talks'];

let D=null, ME=null, version=null, saving=0, dlgCtx=null;
const V={tab:(location.hash||'').slice(1)||'today', lf:{owner:'',q:'',kind:'',lost:false}, cf:{q:'',type:'',quiet:30,open:true}, of:{q:'',kind:'',offer:'',status:'work',resp:''}, tf:{who:'me',done:false}, df:{q:'',st:'open'}};
const can=()=>!!ME&&(ME.role==='owner'||ME.role==='staff');
const fin=()=>!!ME&&(ME.finance==='view'||ME.finance==='edit');
const finW=()=>!!ME&&ME.finance==='edit';
const owner=()=>!!ME&&ME.role==='owner';

/* ---------- сервер ---------- */
async function api(fn,...args){
  let r;try{r=await fetch('/api/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(args)})}
  catch(e){throw new Error('Нет связи с сервером. Проверьте интернет.')}
  if(r.status===401){location.href='/login';throw new Error('Сессия закончилась.')}
  let d=null;try{d=await r.json()}catch(_){}
  if(!r.ok)throw new Error((d&&d.error)||('Ошибка сервера ('+r.status+')'));
  return d.result}
async function run(fn,...args){saving++;try{const res=await api(fn,...args);if(res&&res.version!=null&&res.leads)apply(res);return res}catch(e){toast(e.message);throw e}finally{saving--}}
function apply(d){D=d;version=d.version;ME=d.me;document.body.classList.toggle('ro',!can());renderHead();render();if(dlgCtx&&dlgCtx.refresh)dlgCtx.refresh()}

/* ---------- справочники ---------- */
const byId=(arr,id)=>arr.find(x=>x.id===id);
const cl=id=>D&&byId(D.clients,id);
const clName=id=>{const c=cl(id);return c?c.name:''};
const usr=id=>D&&D.users.find(u=>u.id===id);
const uName=id=>{const u=usr(id);return u?u.name:''};
const obj=id=>D&&byId(D.objects,id);
const objName=o=>o?(o.title||o.address||'Объект'):'';
const lead=id=>D&&byId(D.leads,id);
const deal=id=>D&&byId(D.deals,id);
const dealName=d=>d?((d.client||clName(d.clientId)||'Сделка')+(d.object?' · '+d.object:'')):'';
const openTasks=f=>D.tasks.filter(t=>!t.done&&f(t)).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.time||'').localeCompare(b.time||''));
const nextTask=f=>openTasks(f)[0];
const agentsList=()=>D.clients.filter(c=>(c.types||[]).includes('agent')).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
const opt=(arr,sel)=>arr.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(sel??'')?'selected':''}>${esc(l)}</option>`).join('');
const usersOpt=sel=>opt(D.users.filter(u=>u.active||u.id===sel).map(u=>[u.id,u.name]),sel);
const clientsOpt=(sel,empty)=>opt([['',empty||'— не выбран —'],...D.clients.slice().sort((a,b)=>a.name.localeCompare(b.name,'ru')).map(c=>[c.id,c.name])],sel);
const objectsOpt=sel=>opt([['','— не выбран —'],...D.objects.map(o=>[o.id,objName(o)+(o.status!=='active'?' ('+(D.dict.objStatus[o.status]||'')+')':'')])],sel);

/* ---------- шапка и вкладки ---------- */
const TABS=()=>[['today','Сегодня'],['leads','Заявки'],['tasks','Задачи'],['clients','Клиенты'],['objects','Объекты'],['deals','Сделки'],...(owner()?[['admin','Доступ']]:[])];
function renderHead(){
  $('#sect').innerHTML=`<a href="/" aria-current="page">CRM</a>${fin()?'<a href="/finance">Финансы</a>':''}`;
  $('#who').innerHTML=ME?`<span><b>${esc(ME.name)}</b><br>${esc(ME.roleName)}</span><button type="button" id="mypw">Пароль</button><button type="button" id="logout">Выйти</button>`:'';
  if(ME&&ME.mustChange&&!openPw.shown){openPw.shown=true;setTimeout(()=>openPw(true),300)}
}
function render(){
  if(!TABS().some(t=>t[0]===V.tab))V.tab='today';
  $('#tabs').innerHTML=TABS().map(([k,l])=>`<a href="#${k}" data-tab="${k}" ${V.tab===k?'aria-current="page"':''}>${l}</a>`).join('');
  $('#addbtn').textContent={leads:'+ Заявка',tasks:'+ Задача',clients:'+ Клиент',objects:'+ Объект',deals:'+ Сделка'}[V.tab]||'+ Заявка';
  $('#addbtn').hidden=!can()||V.tab==='admin';
  if(!D){$('#app').innerHTML='<div class="card empty" style="margin-top:18px">Загружаю…</div>';return}
  const keep=document.activeElement&&document.activeElement.id,pos=keep&&document.activeElement.selectionStart;
  $('#app').innerHTML=({today:vToday,leads:vLeads,tasks:vTasks,clients:vClients,objects:vObjects,deals:vDeals,admin:vAdmin}[V.tab])();
  if(keep){const el=document.getElementById(keep);if(el&&el.tagName==='INPUT'){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}
}

/* ---------- Сегодня ---------- */
function taskRow(t){
  const late=t.due&&t.due<today();
  const link=t.leadId&&lead(t.leadId)?'Заявка: '+lead(t.leadId).title:t.clientId&&cl(t.clientId)?'Клиент: '+clName(t.clientId):t.dealId&&deal(t.dealId)?'Сделка: '+dealName(deal(t.dealId)):t.objectId&&obj(t.objectId)?'Объект: '+objName(obj(t.objectId)):'';
  return `<div class="trow ${t.done?'done':''}"><input type="checkbox" data-done="${esc(t.id)}" ${t.done?'checked':''} ${can()?'':'disabled'} aria-label="Выполнено">
    <div class="tt" data-open-task="${esc(t.id)}"><b>${esc(t.title)}</b><div class="m">${esc([link,V.tf.who==='all'||V.tab!=='tasks'?uName(t.assigneeId):''].filter(Boolean).join(' · '))}</div></div>
    <div class="due ${late&&!t.done?'late':''}">${esc(dueLbl(t))}</div></div>`}
function objLast(o,k){const oc=(D.objContact||{})[o.id]||{};if(k==='owner_report')return oc.report||0;return Math.max(oc.call||0,oc.report||0,...(o.owners||[]).map(id=>lastC(id)))}
function objReminders(){
  const out=[],now=Date.now(),R=D.dict.obj.recurring||{owner_call:7,owner_report:14};
  for(const o of D.objects){if(!['active','deposit','paused'].includes(o.status))continue;const since=o.activeSince||o.createdAt;
    for(const [k,days] of Object.entries(R)){const last=objLast(o,k),ref=last||since,d=Math.floor((now-ref)/864e5);
      if(d>=days){const tip=(o.tips||[]).find(t=>t.key===k),tk=tip&&tip.taskId&&D.tasks.find(t=>t.id===tip.taskId&&!t.done);
        out.push({o,k,d,last,tk})}}}
  return out.sort((a,b)=>b.d-a.d)}
function objRemindHtml(list){if(!list.length)return '';
  return `<div class="grp">Собственники ждут новостей</div><div class="box tlist">${list.map(x=>`<div class="trow"><div class="tt" data-open-object="${esc(x.o.id)}"><b>${x.k==='owner_report'?'Отчёт собственнику':'Связаться с собственником'}</b><div class="m">${esc(objName(x.o))} · ${esc(uName(x.o.responsibleId)||'без ответственного')}</div></div>
    <div class="due late">${x.last?x.d+' дн. назад':'ещё не было'}</div>${x.tk?'<span class="muted" style="font-size:12px">задача есть</span>':can()?`<button type="button" data-obj-remind="${esc(x.o.id)}" data-what="${x.k}">Задача</button>`:''}</div>`).join('')}</div>`}
function vToday(){
  const td=today(),mine=t=>t.assigneeId===ME.id;
  const late=openTasks(t=>mine(t)&&t.due&&t.due<td),now=openTasks(t=>mine(t)&&t.due===td),soon=openTasks(t=>mine(t)&&t.due>td&&t.due<=addDays(td,7));
  const open=D.leads.filter(l=>OPEN_STAGES.includes(l.stage)),fresh=open.filter(l=>l.stage==='new');
  const noStep=open.filter(l=>!nextTask(t=>t.leadId===l.id));
  let h=`<div class="tiles">
    <div class="tile click" data-go="tasks"><span class="k">Мои задачи на сегодня</span><span class="v">${now.length}</span><span class="s">${late.length?`<span class="neg">просрочено: ${late.length}</span>`:'просроченных нет'}</span></div>
    <div class="tile click" data-go="leads"><span class="k">Заявки в работе</span><span class="v">${open.length}</span><span class="s">новых: ${fresh.length}</span></div>
    <div class="tile click" data-go="leads"><span class="k">Заявки без следующего шага</span><span class="v ${noStep.length?'warn':''}">${noStep.length}</span><span class="s">нет открытой задачи</span></div>
    <div class="tile click" data-go="objects"><span class="k">Объекты в работе</span><span class="v">${D.objects.filter(o=>o.status==='active').length}</span><span class="s">всего в базе: ${D.objects.length}</span></div></div>`;
  h+=`<div class="cols">`;
  h+=`<div><div class="grp">Мои задачи</div>`;
  if(!late.length&&!now.length&&!soon.length)h+=`<div class="card empty">На ближайшую неделю задач нет.</div>`;
  if(late.length)h+=`<div class="grp neg" style="margin-top:6px">Просрочено</div><div class="box tlist">${late.map(taskRow).join('')}</div>`;
  if(now.length)h+=`<div class="grp">Сегодня</div><div class="box tlist">${now.map(taskRow).join('')}</div>`;
  if(soon.length)h+=`<div class="grp">Ближайшие 7 дней</div><div class="box tlist">${soon.map(taskRow).join('')}</div>`;
  const cr=clientReminders(6),orm=objReminders();
  if(cr.bd.length||cr.quiet.length||orm.length)h+=`<div class="grp" style="margin-top:18px">Напоминания</div>${objRemindHtml(orm.slice(0,8))}${remindHtml(cr,true)}`;
  h+=`</div><div><div class="grp">Новые заявки</div>${fresh.length?`<div class="box tlist">${fresh.map(l=>`<div class="trow"><div class="tt" data-open-lead="${esc(l.id)}"><b>${esc(l.title)}</b><div class="m">${esc([l.source,uName(l.ownerId),dFmt(new Date(l.createdAt).toISOString().slice(0,10))].filter(Boolean).join(' · '))}</div></div></div>`).join('')}</div>`:'<div class="card empty">Новых заявок нет.</div>'}
    ${noStep.length?`<div class="grp">Нет следующего шага</div><div class="box tlist">${noStep.slice(0,12).map(l=>`<div class="trow"><div class="tt" data-open-lead="${esc(l.id)}"><b>${esc(l.title)}</b><div class="m">${esc(D.dict.stages[l.stage])} · ${esc(uName(l.ownerId)||'без ответственного')}</div></div></div>`).join('')}</div>`:''}</div></div>`;
  return h}

/* ---------- Заявки ---------- */
function vLeads(){
  const f=V.lf,q=f.q.trim().toLowerCase();
  let list=D.leads.filter(l=>(!f.owner||String(l.ownerId)===f.owner)&&(!f.kind||l.kind===f.kind)&&(!q||(l.title+' '+clName(l.clientId)+' '+(cl(l.clientId)||{}).phone+' '+l.source+' '+l.note).toLowerCase().includes(q)));
  const st=Object.entries(D.dict.stages).filter(([k])=>k!=='lost'||f.lost);
  let h=`<div class="toolbar"><label class="f grow"><span>Поиск</span><input id="lf-q" value="${esc(f.q)}" placeholder="Клиент, телефон, источник"></label>
    <label class="f"><span>Ответственный</span><select id="lf-owner">${opt([['','Все'],...D.users.filter(u=>u.active).map(u=>[u.id,u.name])],f.owner)}</select></label>
    <label class="f"><span>Тип</span><select id="lf-kind">${opt([['','Все'],...Object.entries(D.dict.leadKinds)],f.kind)}</select></label>
    <label class="checks" style="align-self:center"><label><input type="checkbox" id="lf-lost" ${f.lost?'checked':''}> Показать отказы</label></label></div>`;
  h+=`<div class="board">${st.map(([k,lbl])=>{const items=list.filter(l=>l.stage===k);const sum=items.reduce((s,l)=>s+(+l.budget||0),0);
    return `<div class="col" data-stage="${k}"><div class="col-h"><span>${esc(lbl)}</span><small>${items.length}${sum?' · '+NF.format(Math.round(sum/1e6*10)/10)+' млн':''}</small></div>
      ${items.map(leadCard).join('')||'<div class="muted" style="font-size:12px;padding:4px">Пусто</div>'}</div>`}).join('')}</div>
    <p class="note">Перетаскивайте карточки между колонками, чтобы сменить этап. На телефоне этап меняется в карточке заявки.</p>`;
  return h}
function leadCard(l){
  const t=nextTask(x=>x.leadId===l.id),late=t&&t.due&&t.due<today();
  return `<div class="lc" data-open-lead="${esc(l.id)}" ${can()?'draggable="true"':''} data-lead="${esc(l.id)}">
    <b>${esc(l.title)}</b>
    <div class="m">${esc([D.dict.leadKinds[l.kind],l.budget?money(l.budget):'',l.source].filter(Boolean).join(' · '))}</div>
    <div class="m">${esc(uName(l.ownerId)||'без ответственного')}</div>
    ${l.stage==='lost'?`<div class="m neg">${esc(l.lostReason)}</div>`:l.stage==='won'?(l.dealId?'<div class="m pos">Сделка создана</div>':''):t?`<div class="nx ${late?'late':''}">→ ${esc(t.title)}${t.due?' · '+esc(dueLbl(t)):''}</div>`:'<div class="nx warn">Нет следующего шага</div>'}
  </div>`}

/* ---------- Задачи ---------- */
function vTasks(){
  const f=V.tf,td=today(),who=t=>f.who==='all'||t.assigneeId===ME.id;
  let h=can()?`<div class="qadd"><input id="qt-title" placeholder="Новая задача: позвонить, отправить подборку…" aria-label="Новая задача"><input id="qt-due" type="date" value="${td}" aria-label="Срок"><select id="qt-who" aria-label="Исполнитель">${usersOpt(ME.id)}</select><button class="primary" data-qadd data-need-w>Добавить</button></div>`:'';
  h+=`<div class="toolbar" style="margin-top:6px"><div class="seg" role="group"><button data-tw="me" aria-pressed="${f.who==='me'}">Мои</button><button data-tw="all" aria-pressed="${f.who==='all'}">Все</button></div>
    <label class="checks" style="align-self:center"><label><input type="checkbox" id="tf-done" ${f.done?'checked':''}> Показать выполненные</label></label></div>`;
  const open=openTasks(who);
  const groups=[['Просрочено',t=>t.due&&t.due<td],['Сегодня',t=>t.due===td],['Завтра',t=>t.due===addDays(td,1)],['На неделе',t=>t.due>addDays(td,1)&&t.due<=addDays(td,7)],['Позже',t=>t.due>addDays(td,7)],['Без срока',t=>!t.due]];
  let any=false;
  for(const [g,fn] of groups){const it=open.filter(fn);if(!it.length)continue;any=true;h+=`<div class="grp ${g==='Просрочено'?'neg':''}">${g} · ${it.length}</div><div class="box tlist">${it.map(taskRow).join('')}</div>`}
  if(!any)h+=`<div class="card empty">Открытых задач нет.</div>`;
  if(f.done){const dn=D.tasks.filter(t=>t.done&&who(t)).sort((a,b)=>(b.doneAt||0)-(a.doneAt||0));h+=`<div class="grp">Выполнено за 45 дней · ${dn.length}</div>${dn.length?`<div class="box tlist">${dn.map(taskRow).join('')}</div>`:''}`}
  return h}

/* ---------- Клиенты ---------- */
const TEAM=['agent','founder','employee'];
const isClient=c=>!(c.types||[]).length||(c.types||[]).some(t=>!TEAM.includes(t));
const lastC=id=>(D.lastContact||{})[id]||0;
const daysAgo=ms=>ms?Math.floor((Date.now()-ms)/864e5):null;
function bdayIn(c){if(!c.birth)return null;const t=new Date();t.setHours(0,0,0,0);const b=new Date(c.birth+'T00:00:00');let n=new Date(t.getFullYear(),b.getMonth(),b.getDate());if(n<t)n=new Date(t.getFullYear()+1,b.getMonth(),b.getDate());return Math.round((n-t)/864e5)}
const activeClient=c=>D.leads.some(l=>l.clientId===c.id&&OPEN_STAGES.includes(l.stage))||D.deals.some(d=>d.clientId===c.id&&(d.status==='work'||d.status==='deal'))||D.objects.some(o=>(o.owners||[]).includes(c.id)&&['draft','active','paused','deposit'].includes(o.status));
function clientReminders(limit){
  const bd=D.clients.filter(c=>{const n=bdayIn(c);return n!=null&&n<=14}).sort((a,b)=>bdayIn(a)-bdayIn(b));
  const quiet=D.clients.filter(c=>isClient(c)&&activeClient(c)).map(c=>({c,d:daysAgo(lastC(c.id))})).filter(x=>x.d==null||x.d>=V.cf.quiet).sort((a,b)=>(b.d??9999)-(a.d??9999));
  return {bd,quiet:limit?quiet.slice(0,limit):quiet}}
function remindHtml(r,compact){
  let h='';
  if(r.bd.length)h+=`<div class="grp">Дни рождения — ближайшие 2 недели</div><div class="box tlist">${r.bd.map(c=>{const n=bdayIn(c),nb=new Date();nb.setDate(nb.getDate()+n);const age=nb.getFullYear()-+c.birth.slice(0,4);
    return `<div class="trow"><div class="tt" data-open-client="${esc(c.id)}"><b>${esc(c.name)}</b><div class="m">${dFmt(c.birth).slice(0,5)}${c.birth.slice(0,4)>'1900'?' · исполнится '+age:''}${c.phone?' · '+esc(c.phone):''}</div></div><div class="due ${n===0?'late':''}">${n===0?'сегодня':n===1?'завтра':'через '+n+' дн.'}</div>${can()?`<button type="button" data-remind="${esc(c.id)}" data-what="bday">Задача</button>`:''}</div>`}).join('')}</div>`;
  if(r.quiet.length)h+=`<div class="grp">Давно не связывались${compact?'':` — нет контакта ${V.cf.quiet}+ дней`}</div><div class="box tlist">${r.quiet.map(({c,d})=>`<div class="trow"><div class="tt" data-open-client="${esc(c.id)}"><b>${esc(c.name)}</b><div class="m">${esc([c.phone,clientWhy(c)].filter(Boolean).join(' · '))}</div></div><div class="due ${d==null||d>=60?'late':''}">${d==null?'контактов не было':d+' дн. назад'}</div>${can()?`<button type="button" data-remind="${esc(c.id)}" data-what="call">Задача</button>`:''}</div>`).join('')}</div>`;
  return h}
function clientWhy(c){const l=D.leads.find(l=>l.clientId===c.id&&OPEN_STAGES.includes(l.stage));if(l)return 'заявка: '+D.dict.stages[l.stage];const d=D.deals.find(d=>d.clientId===c.id&&(d.status==='work'||d.status==='deal'));if(d)return 'сделка в работе';const o=D.objects.find(o=>(o.owners||[]).includes(c.id));return o?'собственник: '+objName(o):''}
function vClients(){
  const f=V.cf,q=f.q.trim().toLowerCase();
  const list=D.clients.filter(c=>(!f.type||(c.types||[]).includes(f.type))&&(!q||(c.name+' '+c.phone+' '+c.email+' '+c.other+' '+c.note).toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name,'ru'));
  let h=`<div class="toolbar"><label class="f grow"><span>Поиск</span><input id="cf-q" value="${esc(f.q)}" placeholder="Имя, телефон, почта"></label>
    <label class="f"><span>Тип</span><select id="cf-type">${opt([['','Все'],...CP_TYPES],f.type)}</select></label>
    <label class="f"><span>«Давно не связывались» — после</span><select id="cf-quiet">${opt([[14,'14 дней'],[21,'21 дня'],[30,'30 дней'],[45,'45 дней'],[60,'60 дней']],f.quiet)}</select></label></div>`;
  if(!q&&!f.type){const r=clientReminders(0);if(r.bd.length||r.quiet.length)h+=`<details class="card remind" ${f.open?'open':''} id="cf-rem"><summary><b>Напоминания</b> <span class="muted">дни рождения: ${r.bd.length} · давно без контакта: ${r.quiet.length}</span></summary>${remindHtml(r)}<p class="note">Контакт — это звонок, встреча, показ, сообщение или отчёт в истории клиента. Отмечайте их в карточке, чтобы напоминания были точными.</p></details>`}
  if(!list.length)return h+'<div class="card empty">Никого не нашлось.</div>';
  h+=`<div class="tbl-wrap"><table><thead><tr><th>Имя</th><th>Тип</th><th>Телефон</th><th>Заявки</th><th>Сделки</th><th>Последний контакт</th><th>Следующий шаг</th></tr></thead><tbody>
    ${list.map(c=>{const ls=D.leads.filter(l=>l.clientId===c.id),ds=D.deals.filter(d=>d.clientId===c.id),t=nextTask(x=>x.clientId===c.id||ls.some(l=>l.id===x.leadId));
      return `<tr class="click" data-open-client="${esc(c.id)}"><td><b>${esc(c.name)}</b></td><td class="muted">${esc((c.types||[]).map(k=>(CP_TYPES.find(x=>x[0]===k)||[,k])[1]).join(', '))}</td><td class="num">${esc(c.phone)}</td>
      <td>${ls.filter(l=>OPEN_STAGES.includes(l.stage)).length||''}${ls.length?` <span class="muted">/ ${ls.length}</span>`:''}</td><td>${ds.length||''}</td><td class="num ${daysAgo(lastC(c.id))>=f.quiet?'warn':''}">${lastC(c.id)?dFmt(new Date(lastC(c.id)).toISOString().slice(0,10)):''}</td><td>${t?esc(t.title)+' <span class="muted">'+esc(dueLbl(t))+'</span>':''}</td></tr>`}).join('')}
  </tbody></table></div><p class="note">Всего: ${list.length}</p>`;
  return h}

/* ---------- Объекты ---------- */
function vObjects(){
  const f=V.of,q=f.q.trim().toLowerCase(),OD=D.dict.obj;
  const inWork=s=>['draft','active','paused','deposit'].includes(s);
  const list=D.objects.filter(o=>(!f.kind||o.kind===f.kind)&&(!f.offer||o.offer===f.offer)&&(f.status==='all'||(f.status==='work'?inWork(o.status):o.status===f.status))

function contractWarn(o){if(!o.contractUntil||['sold','failed'].includes(o.status))return '';const d=Math.ceil((new Date(o.contractUntil+'T12:00:00')-Date.now())/864e5);
  return d<0?'Договор с собственником истёк '+dFmt(o.contractUntil):d<=14?'Договор с собственником истекает через '+d+' дн.':''}
function readiness(o){const res=['flat','house'].includes(o.kind);
  const chk=[['адрес',!!o.address],['цена',o.price!==''&&o.price!=null],['площадь',!!o.area],['ответственный',!!o.responsibleId],['собственник',(o.owners||[]).length>0],
    ['кадастровый номер',!!o.cadastral],['основание собственности',!!o.ownershipBasis],['договор с собственником',!!o.contractDate],['описание от 300 знаков',(o.description||'').length>=300],
    ...(res?[['комнаты',!!o.rooms],['ремонт',!!o.renovation]]:[]),['этажность',!!o.floors]];
  const tips=(o.tips||[]);const tdone=tips.filter(t=>t.done||(t.taskId&&taskDone(t.taskId))).length;
  const total=chk.length+tips.length,ok=chk.filter(c=>c[1]).length+tdone;
  return {p:total?Math.round(ok/total*100):0,miss:chk.filter(c=>!c[1]).map(c=>c[0]).concat(tips.length-tdone?[`советы (${tips.length-tdone})`]:[])}}

function priceHistHtml(x){const h=(x.priceHistory||[]).slice().sort((a,b)=>a.at-b.at);

      ${h.length>1?`<tfoot><tr class="tot"><td>Итого</td><td class="r num">${money(cur.price-start.price)}</td><td class="r num ${tot<0?'neg':tot>0?'pos':''}">${tot>0?'+':''}${tot}%</td><td colspan="2" class="muted">от стартовой ${money(start.price)} за ${Math.round((cur.at-start.at)/864e5)} дн.</td></tr></tfoot>`:''}</table></div>`
      :'<p class="muted" style="margin:0;font-size:13px">Появится после сохранения цены. Каждое изменение цены записывается автоматически.</p>'}

  form.querySelectorAll('[data-exp]').forEach(el=>{const e=c.o.expenses[+el.dataset.exp];if(e)e[el.dataset.k]=el.dataset.k==='amount'?(el.value===''?'':+el.value):el.value})}
form.addEventListener('click',async e=>{const c=dlgCtx;if(!c||c.kind!=='object')return;const b=e.target.closest('button,a');if(!b)return;const x=c.o;
  if(b.dataset.paneBtn){readObjForm();c.pane=b.dataset.paneBtn;c.draw();if(c.pane==='hist')loadFeed();if(c.pane==='inq'&&c.orig)loadInq();return}
  if(b.hasAttribute('data-nown-add')){readObjForm();c.newOwners.push({name:'',birth:'',phone:'',email:''});c.draw();return}
  if(b.dataset.nownDel!=null){readObjForm();c.newOwners.splice(+b.dataset.nownDel,1);c.draw();return}
  if(b.dataset.ownDel){readObjForm();x.owners=x.owners.filter(i=>i!==b.dataset.ownDel);c.draw();return}
  if(b.hasAttribute('data-ph-add')){const dt=$('#ph-date').value,pr=+$('#ph-price').value;if(!dt||!(pr>0))return toast('Укажите дату и цену.');readObjForm();
    x.priceHistory.push({at:new Date(dt+'T12:00:00').getTime(),price:pr,note:$('#ph-note').value||'добавлено вручную'});x.priceHistory.sort((a,b)=>a.at-b.at);c.draw();toast('Запись добавлена — сохраните объект');return}
  if(b.dataset.phDel!=null){readObjForm();const h=x.priceHistory.slice().sort((a,b)=>a.at-b.at);h.splice(+b.dataset.phDel,1);x.priceHistory=h;c.draw();return}
  if(b.dataset.expFin!=null){readObjForm();const i=+b.dataset.expFin,e=x.expenses[i];if(!e||!(+e.amount>0))return toast('Укажите сумму расхода.');openExpFin(c,i);return}
  if(b.hasAttribute('data-exp-add')){readObjForm();x.expenses.push({id:'',date:today(),kind:'',amount:'',note:''});c.draw();return}
  if(b.dataset.expDel!=null){readObjForm();x.expenses.splice(+b.dataset.expDel,1);c.draw();return}
  if(b.hasAttribute('data-tip-add')){const t=$('#tip-new').value.trim();if(!t)return;readObjForm();x.tips.push({key:'tip_'+Date.now().toString(36),title:t,done:false,taskId:''});c.draw();return}
  if(b.dataset.tipDel){readObjForm();x.tips=x.tips.filter(t=>t.key!==b.dataset.tipDel);c.draw();return}
  if(b.dataset.tipTask){readObjForm();await saveObjectDlg(false);if(dlgCtx!==c)return;try{await run('tipToTask',c.orig.id,b.dataset.tipTask,addDays(today(),2));c.orig=obj(c.orig.id);c.o=JSON.parse(JSON.stringify(c.orig));c.draw();toast('Задача поставлена ответственному')}catch(_){}return}
  if(b.hasAttribute('data-inq-add')){const q={objectId:c.orig.id,name:$('#iq-name').value,phone:$('#iq-phone').value,channel:$('#iq-channel').value,who:$('#iq-who').value,note:$('#iq-note').value};
    try{await api('saveInquiry',q);['#iq-name','#iq-phone','#iq-channel','#iq-note'].forEach(s=>$(s).value='');toast('Обращение добавлено');loadInq()}catch(err){toast(err.message)}return}
  if(b.dataset.inqDel){if(!confirm('Удалить обращение?'))return;try{await api('deleteInquiry',b.dataset.inqDel);loadInq()}catch(err){toast(err.message)}return}
  if(b.dataset.inqLead){try{await run('inquiryToLead',b.dataset.inqLead);toast('Заявка создана — она во вкладке «Заявки»');loadInq()}catch(_){}return}
},true);
form.addEventListener('change',e=>{const c=dlgCtx;if(!c||c.kind!=='object')return;const t=e.target;
  if(t.id==='own-add'&&t.value){readObjForm();c.o.owners.push(t.value);c.draw();return}
  if(t.dataset.tipDone){const tip=c.o.tips.find(x=>x.key===t.dataset.tipDone);if(tip)tip.done=t.checked;readObjForm();c.draw();return}
  if(['kind','offer','status','liftsNone'].includes(t.name)){readObjForm();c.draw()}
});
form.addEventListener('input',e=>{if(dlgCtx&&dlgCtx.kind==='object'&&(e.target.name==='price'||e.target.name==='area')){const pr=+form.querySelector('[name=price]').value,ar=+form.querySelector('[name=area]').value,el=$('#ppm');if(el)el.textContent=pr&&ar?NF.format(Math.round(pr/ar))+' ₽':'—'}

}

    <label class="f"><span>Ожидаем оплату</span><input name="expected" type="date" value="${esc(x.expected)}"></label>
    <label class="f"><span>Агент</span><select name="agentId">${agOpt(x.agentId)}</select></label>
    <label class="f"><span>Агент 2</span><select name="agent2Id">${agOpt(x.agent2Id)}</select></label>
    <label class="f"><span>Агент 3</span><select name="agent3Id">${agOpt(x.agent3Id)}</select></label>

    <label class="f full"><span>Заметка</span><textarea name="note" rows="2">${esc(x.note)}</textarea></label></div>
    <div class="links">${ld?`<a data-open-lead="${esc(ld.id)}">Заявка: ${esc(ld.title)}</a>`:''}${x.clientId&&d?`<a data-open-client="${esc(x.clientId)}">Карточка клиента</a>`:''}${x.objectId&&d&&obj(x.objectId)?`<a data-open-object="${esc(x.objectId)}">Карточка объекта</a>`:''}${fin()?'<a href="/finance#deals">Доли агентов и платежи — в разделе «Финансы»</a>':'<span class="muted" style="font-size:12px">Платежи по сделке вносит бухгалтерия в разделе «Финансы».</span>'}</div>`;
  form.innerHTML=d?`<h2>${esc(dealName(d))}</h2><div class="dlg2"><div style="display:flex;flex-direction:column;gap:12px">${fields}</div>${sidePanel({dealId:d.id})}</div>${acts(false)}`
    :`<h2>Новая сделка</h2>${fields}${acts(false)}`}

}

/* сохранение */
async function submit(){
  readForm();const c=dlgCtx,x=c.o;
  try{
    if(c.kind==='lead'){if(!x.clientId&&!String(x.newClientName||'').trim())return toast('Выберите клиента или впишите имя нового.');
      if(x.stage==='lost'&&!String(x.lostReason||'').trim()){c.draw();return toast('Укажите причину отказа.')}
      dlg.close();await run('saveLead',Object.assign({},x,{id:c.orig?c.orig.id:undefined,ownerId:x.ownerId?Number(x.ownerId):null}));toast('Заявка сохранена')}
    else if(c.kind==='client'){if(!x.name.trim())return toast('Укажите имя.');dlg.close();await run('crmSaveClient',Object.assign({},c.orig||{},x,{id:c.orig?c.orig.id:'cl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),createdAt:c.orig?c.orig.createdAt:Date.now()}));toast('Клиент сохранён')}
    else if(c.kind==='object'){await saveObjectDlg(false)}
    else if(c.kind==='task'){if(!x.title.trim())return toast('Напишите, что сделать.');dlg.close();await run('saveTask',Object.assign({},x,{id:c.orig?c.orig.id:undefined,assigneeId:Number(x.assigneeId),done:!!x.done}));toast('Задача сохранена')}
    else if(c.kind==='deal'){const o=c.orig;const extra=[x.agent2Id,x.agent3Id].filter(Boolean).map(a=>Object.assign({agentId:a},((o&&o.extra)||[]).find(e=>e.agentId===a)||{}));
      const ids=[x.agentId,...extra.map(e=>e.agentId)].filter(Boolean);if(new Set(ids).size!==ids.length)return toast('Один и тот же агент выбран дважды.');
      if(!x.clientId)return toast('Выберите клиента.');
      if(!o){dlg.close();await run('crmCreateDeal',{clientId:x.clientId,objectId:x.objectId,object:x.object,kind:x.kind,status:x.status,date:x.date,expected:x.expected,note:x.note,agentId:x.agentId,extra,commission:finW()?x.commission:''});toast('Сделка создана');return}
      dlg.close();await run('crmSaveDeal',Object.assign({},o,{clientId:x.clientId,objectId:x.objectId,object:x.object,kind:x.kind,status:x.status,date:x.date,expected:x.expected,note:x.note,agentId:x.agentId,extra},finW()?{commission:x.commission}:{}));toast('Сделка сохранена')}
    else if(c.kind==='todeal'){dlg.close();await run('leadToDeal',c.lead.id,x);toast('Сделка создана');V.tab='deals';location.hash='deals';render()}
  }catch(_){}
}
async function del(){const c=dlgCtx;if(!c.confirmDel){c.confirmDel=true;readForm();c.draw();return}
  const fn={lead:'deleteLead',client:'crmDeleteClient',object:'deleteObject',task:'deleteTask'}[c.kind];if(!fn)return;
  dlg.close();try{await run(fn,c.orig.id);toast('Удалено')}catch(_){}}

form.addEventListener('submit',e=>{e.preventDefault();submit()});
form.addEventListener('change',e=>{const n=e.target.name;if(!dlgCtx)return;
  if((dlgCtx.kind==='lead'&&(n==='clientId'||n==='stage'))){readForm();dlgCtx.draw();if(dlgCtx.feed)loadFeed()}
  if((dlgCtx.kind==='deal'||dlgCtx.kind==='todeal')&&n==='objectId'){readForm();const ob=obj(dlgCtx.o.objectId);if(ob)dlgCtx.o.object=objName(ob)+(ob.title&&ob.address?', '+ob.address:'');dlgCtx.draw();if(dlgCtx.feed)loadFeed()}});
form.addEventListener('click',async e=>{const b=e.target.closest('button,a');if(!b)return;
  if(b.hasAttribute('data-close')){dlg.close();return}
  if(b.hasAttribute('data-del')){del();return}
  if(b.hasAttribute('data-to-deal')){openToDeal(dlgCtx.orig);return}
  if(b.dataset.delAct){e.preventDefault();if(!confirm('Удалить запись из истории?'))return;try{await api('deleteActivity',b.dataset.delAct);loadFeed()}catch(err){toast(err.message)}return}
  if(b.hasAttribute('data-add-note')){const text=$('#nt-text').value.trim();if(!text)return toast('Напишите текст записи.');const f=dlgCtx.feed;
    try{await api('saveActivity',Object.assign({type:$('#nt-type').value,text},f));$('#nt-text').value='';loadFeed()}catch(err){toast(err.message)}return}
  if(b.hasAttribute('data-side-task')){const title=$('#st-title').value.trim();if(!title)return toast('Напишите задачу.');const f=dlgCtx.feed,o=dlgCtx.orig;
    const link={leadId:f.leadId||'',clientId:f.clientId||(o&&o.clientId)||'',dealId:f.dealId||'',objectId:f.objectId||''};
    try{readForm();await run('saveTask',Object.assign({title,due:$('#st-due').value,assigneeId:Number($('#st-who').value)},link));dlgCtx&&dlgCtx.draw();loadFeed();toast('Задача добавлена')}catch(_){}return}
  const jump=b.dataset.openLead||b.dataset.openClient||b.dataset.openDeal||b.dataset.openObject||b.dataset.newLeadFor;
  if(jump&&!b.href){e.preventDefault();
    if(b.dataset.openLead)openLead(lead(b.dataset.openLead));else if(b.dataset.openClient)openClient(cl(b.dataset.openClient));
    else if(b.dataset.openDeal)openDeal(deal(b.dataset.openDeal));else if(b.dataset.openObject)openObject(obj(b.dataset.openObject));
    else if(b.dataset.newLeadFor)openLead(null,{clientId:b.dataset.newLeadFor});}
});
form.addEventListener('change',async e=>{const cb=e.target.closest('[data-done]');if(cb){e.stopPropagation();await toggleDone(cb.dataset.done,cb.checked);dlgCtx&&dlgCtx.draw();if(dlgCtx&&dlgCtx.feed)loadFeed()}},true);
form.addEventListener('click',e=>{const t=e.target.closest('[data-open-task]');if(t)openTask(D.tasks.find(x=>x.id===t.dataset.openTask))});

let dragId=null;
app.addEventListener('dragstart',e=>{const c=e.target.closest('[data-lead]');if(!c)return;dragId=c.dataset.lead;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId)});
app.addEventListener('dragover',e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==col&&x.classList.remove('over'));col.classList.add('over')});
app.addEventListener('dragleave',e=>{const col=e.target.closest('.col');if(col&&!col.contains(e.relatedTarget))col.classList.remove('over')});
app.addEventListener('drop',async e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();col.classList.remove('over');
  const id=dragId;dragId=null;const l=lead(id),st=col.dataset.stage;if(!l||l.stage===st)return;
  if(st==='won'&&!l.dealId){openToDeal(l);return}
  let reason='';if(st==='lost'){reason=prompt('Причина отказа:')||'';if(!reason.trim())return toast('Без причины отказа этап не меняется.')}
  try{await run('setLeadStage',id,st,reason);toast('Этап: '+D.dict.stages[st])}catch(_){}});
app.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});

/* ---------- пароль, выход ---------- */
document.addEventListener('click',async e=>{
  if(e.target.closest('#logout')){try{await fetch('/auth/logout',{method:'POST',credentials:'same-origin'})}catch(_){}location.href='/login'}
  if(e.target.closest('#mypw'))openPw(false)});
function openPw(forced){let d=$('#pwdlg');if(!d){d=document.createElement('dialog');d.id='pwdlg';document.body.appendChild(d)}
  d.innerHTML=`<form class="dlg" method="dialog" id="pwform"><h2>${forced?'Задайте свой пароль':'Смена пароля'}</h2>
    ${forced?'<p class="note" style="margin:0">Вы вошли по временному паролю. Придумайте свой — не короче 10 символов, с буквами и цифрами.</p>':''}
    <div class="fg"><label class="f full"><span>Текущий пароль</span><input type="password" name="old" autocomplete="current-password" required></label>
    <label class="f full"><span>Новый пароль</span><input type="password" name="n1" autocomplete="new-password" required minlength="10"></label>
    <label class="f full"><span>Новый пароль ещё раз</span><input type="password" name="n2" autocomplete="new-password" required minlength="10"></label></div>
    <div class="acts"><div></div><div>${forced?'':'<button type="button" data-pw-close>Отмена</button>'}<button type="submit" class="primary">Сохранить</button></div></div></form>`;
  d.querySelector('[data-pw-close]')?.addEventListener('click',()=>d.close());
  if(forced)d.addEventListener('cancel',ev=>ev.preventDefault());
  d.querySelector('#pwform').addEventListener('submit',async ev=>{ev.preventDefault();const f=new FormData(ev.target);
    if(f.get('n1')!==f.get('n2'))return toast('Новые пароли не совпадают.');
    try{await api('changeOwnPassword',f.get('old'),f.get('n1'));ME.mustChange=false;d.close();toast('Пароль изменён')}catch(err){toast(err.message)}});
  d.showModal()}

/* ---------- Доступ (учредитель) ---------- */
const ACC={users:null,roles:{},finance:{},audit:null,loading:false,newPw:null,t:0};
function genPw(){const a='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=crypto.getRandomValues(new Uint32Array(12));
  let s='';for(let i=0;i<12;i++)s+=a[r[i]%a.length];return /\d/.test(s)&&/[a-z]/i.test(s)?s:genPw()}
async function accLoad(){if(ACC.loading)return;ACC.loading=true;
  try{const u=await api('listUsers');ACC.users=u.users;ACC.roles=u.roles;ACC.finance=u.finance;ACC.audit=await api('listAudit',150)}catch(e){toast(e.message)}
  ACC.loading=false;ACC.t=Date.now();if(V.tab==='admin')render()}
function vAdmin(){
  if(!owner())return '<div class="card empty">Раздел доступен только учредителям.</div>';
  if(!ACC.users){accLoad();return '<div class="card empty" style="margin-top:18px">Загружаю…</div>'}
  if(Date.now()-ACC.t>10000)setTimeout(accLoad,0);
  const ro=sel=>opt(Object.entries(ACC.roles),sel),fo=sel=>opt(Object.entries(ACC.finance),sel);
  let h=`<h2>Пользователи</h2>`;
  if(ACC.newPw)h+=`<div class="banner" style="margin:0 0 12px">Временный пароль для <b>${esc(ACC.newPw.login)}</b>: <code style="font-size:15px;user-select:all">${esc(ACC.newPw.pw)}</code><br>Передайте его лично. При первом входе система попросит сменить пароль. Больше этот пароль нигде показан не будет. <button type="button" data-acc="hidepw">Скрыть</button></div>`;
  h+=`<div class="tbl-wrap"><table class="acc-tbl"><thead><tr><th>Имя</th><th>Логин</th><th>Роль в CRM</th><th>Финансы</th><th>Статус</th><th></th></tr></thead><tbody>
    ${ACC.users.map(u=>{const me=u.id===ME.id;return `<tr><td><b>${esc(u.name)}</b>${me?' <span class="muted">(вы)</span>':''}</td><td class="num">${esc(u.login)}</td>
      <td><select data-acc-role="${u.id}" ${me?'disabled':''}>${ro(u.role)}</select></td>
      <td>${u.role==='owner'?'<span class="muted">полный доступ</span>':`<select data-acc-fin="${u.id}">${fo(u.finance)}</select>`}</td>
      <td>${u.active?(u.mustChange?'<span class="chip work">ждёт смены пароля</span>':'<span class="chip closed">активен</span>'):'<span class="chip lost">отключён</span>'}</td>
      <td class="r">${me?'':`<button type="button" data-acc="reset" data-id="${u.id}" data-login="${esc(u.login)}">Новый пароль</button> <button type="button" data-acc="toggle" data-id="${u.id}">${u.active?'Отключить':'Включить'}</button>`}</td></tr>`}).join('')}
  </tbody></table></div>
  <div class="card" style="margin-top:12px"><h3>Добавить пользователя</h3><div class="fg">
    <label class="f"><span>Имя</span><input id="acc-name" placeholder="Имя Фамилия"></label>
    <label class="f"><span>Логин (латиницей)</span><input id="acc-login" placeholder="ivan" autocapitalize="off" autocomplete="off"></label>
    <label class="f"><span>Роль в CRM</span><select id="acc-role">${ro('staff')}</select></label>
    <label class="f"><span>Доступ к финансам</span><select id="acc-fin">${fo('none')}</select></label>
    <div class="f full" style="align-items:flex-start"><button type="button" class="primary" data-acc="add">Создать и получить пароль</button></div></div>
    <p class="note" style="margin:8px 0 0"><b>Учредитель</b> — всё, включая финансы, пользователей и настройки. <b>Сотрудник</b> — работает в CRM: заявки, клиенты, задачи, объекты, сделки. <b>Только просмотр</b> — видит CRM, ничего не меняет. Доступ к разделу «Финансы» выдаётся отдельно: нет / просмотр / ввод и правка.</p></div>`;
  h+=`<h2>Данные</h2><div class="card"><div class="rows">
    <div class="row"><span>Выгрузить все данные в файл: финансы и CRM (резервная копия)</span><button type="button" data-acc="export">Скачать .json</button></div>
    <div class="row"><span>Восстановить из файла выгрузки. <b>Заменит</b> финансовые данные и клиентов${'; CRM — если он есть в файле'}. Пользователи сохраняются, перед заменой сервер делает копию базы.</span><label><input type="file" id="acc-import" accept=".json,application/json" hidden><span class="like-btn">Загрузить .json…</span></label></div></div>
    <p class="note" style="margin:8px 0 0">Сервер сам делает резервную копию базы каждую ночь.</p></div>`;
  h+=`<h2>Журнал изменений</h2><div class="tbl-wrap"><table class="acc-tbl"><thead><tr><th>Когда</th><th>Кто</th><th>Действие</th><th>Что</th></tr></thead><tbody>
    ${(ACC.audit||[]).map(a=>`<tr><td class="num">${dtFmt(a.at)}</td><td>${esc(a.user_name||'')}</td><td>${esc(a.action)}</td><td class="muted">${esc([a.entity,a.entity_id].filter(Boolean).join(' · '))}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">Пока пусто</td></tr>'}
  </tbody></table></div><p class="note">Последние 150 записей.</p>`;
  return h}
app.addEventListener('change',async e=>{
  const r=e.target.closest('[data-acc-role],[data-acc-fin]');
  if(r){const id=Number(r.dataset.accRole||r.dataset.accFin),u=ACC.users.find(x=>x.id===id);
    const upd=Object.assign({id:u.id,name:u.name,role:u.role,finance:u.finance,active:u.active},r.dataset.accRole?{role:r.value}:{finance:r.value});
    try{const out=await api('saveUser',upd);ACC.users=out.users;toast('Права изменены');render()}catch(err){toast(err.message);render()}return}
  if(e.target.id==='acc-import'){const f=e.target.files[0];if(!f)return;
    const ok=prompt('Восстановление заменит текущие данные (кроме пользователей). Чтобы продолжить, напишите слово ЗАМЕНИТЬ');
    if(ok!=='ЗАМЕНИТЬ'){e.target.value='';return toast('Отменено')}
    try{const data=JSON.parse(await f.text());const c=await api('importData',data,'ЗАМЕНИТЬ');
      toast(`Загружено: операций ${c.ops}, сделок ${c.deals}, клиентов ${c.clients}`+(c.leads!=null?`, заявок ${c.leads}`:''));apply(await api('crmLoad'));ACC.users=null}
    catch(err){toast('Не выполнено: '+err.message)}e.target.value=''}});
app.addEventListener('click',async e=>{const b=e.target.closest('[data-acc]');if(!b)return;const a=b.dataset.acc;
  try{
    if(a==='hidepw'){ACC.newPw=null;render();return}
    if(a==='add'){const name=$('#acc-name').value.trim(),login=$('#acc-login').value.trim().toLowerCase(),role=$('#acc-role').value,finance=$('#acc-fin').value,pw=genPw();
      const out=await api('saveUser',{name,login,role,finance,password:pw});ACC.users=out.users;ACC.newPw={login,pw};ACC.t=0;D&&apply(await api('crmLoad'));return}
    if(a==='reset'){if(!confirm('Выдать новый временный пароль? Текущие входы этого пользователя завершатся.'))return;const pw=genPw();
      const out=await api('resetUserPassword',Number(b.dataset.id),pw);ACC.users=out.users;ACC.newPw={login:b.dataset.login,pw};render();return}
    if(a==='toggle'){const u=ACC.users.find(x=>x.id==b.dataset.id);const out=await api('saveUser',{id:u.id,name:u.name,role:u.role,finance:u.finance,active:!u.active});ACC.users=out.users;render();return}
    if(a==='export'){const d=await api('exportData');const blob=new Blob([JSON.stringify(d,null,1)],{type:'application/json'});
      const url=URL.createObjectURL(blob);const l=document.createElement('a');l.href=url;l.download='dg-export-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);return}
  }catch(err){toast(err.message)}});

/* ---------- запуск ---------- */
async function init(){$('#sources').innerHTML=SOURCES.map(x=>`<option value="${esc(x)}">`).join('');render();
  try{apply(await api('crmLoad'))}catch(e){$('#app').innerHTML=`<div class="banner">Не удалось загрузить данные: ${esc(e.message)}. Обновите страницу.</div>`;return}
  setInterval(async()=>{if(document.hidden||saving>0||dlgCtx||dragId)return;
    try{const v=await api('getVersion');if(v!==version)apply(await api('crmLoad'))}catch(_){}},20000)}
init();
})();

</script>
