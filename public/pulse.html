<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Дорогой Город · Пульс компании</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: sticky ledger header with period + tabs; summary tiles over detail tables; wide tables scroll inside their own box */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --sunk:#F6F8F7; --ink:#15201C; --muted:#5B6863; --line:#D8DFDC;
  --accent:#1F5A48; --accent-ink:#FFFFFF; --accent-soft:#DDEBE5;
  --pos:#1D7A45; --neg:#B0302A; --warn:#9A6400; --pos-soft:#E0F1E6; --neg-soft:#F7E3E1; --warn-soft:#F5ECD8;
  --font-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161E1B; --sunk:#121916; --ink:#E4EBE8; --muted:#95A39D; --line:#28332F;
  --accent:#7CC7AC; --accent-ink:#0C1A15; --accent-soft:#1D3029;
  --pos:#62CC8F; --neg:#F08A80; --warn:#E2B458; --pos-soft:#18301F; --neg-soft:#3A1D1B; --warn-soft:#352A14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161E1B; --sunk:#121916; --ink:#E4EBE8; --muted:#95A39D; --line:#28332F;
  --accent:#7CC7AC; --accent-ink:#0C1A15; --accent-soft:#1D3029;
  --pos:#62CC8F; --neg:#F08A80; --warn:#E2B458; --pos-soft:#18301F; --neg-soft:#3A1D1B; --warn-soft:#352A14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font-ui);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand b{font-size:18px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:6px;margin-left:10px;font-size:12px;color:var(--muted)}
.who b{color:var(--ink);font-weight:600}
.period .who button:not(.primary){width:auto;height:30px;padding:0 10px;font-size:12px;flex:none}
.who span{line-height:1.25;text-align:right}
body.ro #addop,body.ro [data-new-deal],body.ro [data-new-client],body.ro [data-pay-deal],body.ro [data-pay-in-deal],body.ro [data-inc-all],body.ro #dlgform button[type=submit],body.ro [data-del-deal],body.ro [data-del-client],body.ro [data-del-op]{display:none!important}
.acc-tbl td,.acc-tbl th{white-space:nowrap}
@media (max-width:700px){.who span{display:none}}
.like-btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;white-space:nowrap}
.period{display:flex;align-items:center;gap:6px}
.period button:not(.primary){width:32px;height:32px;padding:0}
.period{flex-wrap:wrap}
.period .lbl{min-width:132px;text-align:center;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;white-space:nowrap;font-weight:500}
nav.tabs a:hover{color:var(--ink);background:var(--surface)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
button,select,input,textarea{font:inherit;color:inherit}
button{white-space:nowrap;cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--neg);border-color:var(--neg)}
button.ghost{border-color:transparent;background:transparent}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input[type=number]{font-family:var(--font-num)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
label.f>span{letter-spacing:.02em}
h2{font-size:17px;margin:24px 0 10px;text-wrap:balance}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;font-weight:600}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.banner{margin-top:16px;padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;gap:12px}
.tiles{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:18px}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-num);font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.tile.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile.hero .k,.tile.hero .s{color:var(--accent-ink);opacity:.8}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.rows{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.total{font-weight:600}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
td.r,th.r{text-align:right}
tr.sec td{background:var(--sunk);font-weight:600}
tr.tot td{font-weight:700;border-top:2px solid var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
.report th:first-child,.report td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px}
.report tr.sec td:first-child,.report th:first-child{background:var(--sunk)}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.chip.in{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.chip.out{background:var(--neg-soft);color:var(--neg);border-color:transparent}
.chip.tr{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.work{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.deal{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.chip.closed{background:var(--pos-soft);color:var(--pos);border-color:transparent}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin:18px 0 12px}
.toolbar>*{flex:0 1 auto}
.toolbar .grow{flex:1 1 200px}
.toolbar select,.toolbar input{width:auto;min-width:150px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;min-width:80px;margin-top:5px}
.meter i{display:block;height:100%;background:var(--accent)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto}
dialog::backdrop{background:rgba(10,16,14,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h2{margin:0}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fg .full{grid-column:1/-1}
@media (max-width:480px){.fg{grid-template-columns:minmax(0,1fr)}}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:transparent}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.acts>div{display:flex;gap:8px}
.chart svg{display:block;width:100%;height:auto}
.chart .ax{fill:var(--muted);font:11px var(--font-ui)}
.chart .grid-l{stroke:var(--line)}
.chart .b-in{fill:var(--pos)} .chart .b-out{fill:var(--neg);opacity:.75}
.chart .ln{stroke:var(--ink);fill:none;stroke-width:1.5}
.chart .dot{fill:var(--ink)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.set-list{display:flex;flex-direction:column;gap:8px}
.set-row{display:grid;gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:20;max-width:calc(100vw - 32px)}
.note{font-size:12px;color:var(--muted);margin-top:8px;max-width:70ch}
.pf input{width:130px;text-align:right}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}

/* Пульс компании: дашборд учредителя */
.pulse-hero{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin:18px 0 4px}
.pulse-hero h1{font-size:22px;margin:0;letter-spacing:-.01em}
.pulse-hero .sub{color:var(--muted);font-size:13px;margin-top:4px}
.ptiles{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:980px){.ptiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.ptiles{grid-template-columns:1fr}}
.ptiles .v{font-size:26px}
.tile.good .v{color:var(--pos)} .tile.bad .v{color:var(--neg)} .tile.warnv .v{color:var(--warn)}
.pulse-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
@media (max-width:900px){.pulse-grid{grid-template-columns:1fr}}
.pulse-grid .card h3{margin-bottom:12px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar-row .lbl{width:96px;flex:none;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .track{flex:1;height:20px;background:var(--sunk);border-radius:6px;overflow:hidden;position:relative}
.bar-row .fill{height:100%;border-radius:6px;background:var(--accent);transition:width .5s ease}
.bar-row .val{width:110px;flex:none;text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.funnel-step{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.funnel-step .f-lbl{width:110px;flex:none;font-size:13px;color:var(--muted)}
.funnel-step .f-track{flex:1;height:26px;background:var(--sunk);border-radius:6px;overflow:hidden}
.funnel-step .f-fill{height:100%;background:var(--accent-soft);color:var(--ink);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:12px;font-family:var(--font-num);border-radius:6px}
.funnel-step .f-n{width:44px;flex:none;text-align:right;font-family:var(--font-num);font-weight:600}
.pulse-table{width:100%;border-collapse:collapse;font-size:13px}
.pulse-table th{ text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.pulse-table td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.pulse-table tr:last-child td{border-bottom:none}
.pulse-table .r{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.pulse-table .pos{color:var(--pos)} .pulse-table .neg{color:var(--neg)}
.agent-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.agent-row:last-child{border-bottom:none}
.agent-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.agent-row .st{font-size:12px;color:var(--muted);flex:none}
.agent-row .vv{font-family:var(--font-num);flex:none;width:120px;text-align:right;font-variant-numeric:tabular-nums}
.agent-row .cnt{flex:none;width:40px;text-align:right;font-family:var(--font-num);color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted)} .kv .v{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-weight:600}
.pulse-note{font-size:11px;color:var(--muted);margin-top:10px}
.delta{font-size:12px;font-weight:600}
.delta.up{color:var(--pos)} .delta.down{color:var(--neg)} .delta.flat{color:var(--muted)}
.spark{display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:8px}
.spark .col{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.spark .col.neg{background:var(--neg-soft)}
.spark .col:hover{background:var(--accent)}
.spark-x{display:flex;gap:3px;margin-top:4px;font-size:10px;color:var(--muted)}
.spark-x span{flex:1;text-align:center;white-space:nowrap;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <div class="brand"><b>Дорогой Город <span class="sect-badge" style="background:var(--accent);color:var(--accent-ink);font-size:10px;padding:2px 7px;border-radius:999px;vertical-align:middle;font-weight:600">ПУЛЬС</span></b><span>управленческий дашборд для учредителя</span></div>
    <nav class="appsw" aria-label="Раздел системы">
      <a href="/" class="sw-crm"><i></i>CRM</a>
      <a href="/finance" class="sw-fin"><i></i>Финансы</a>
      <a href="/pulse" class="sw-pulse" aria-current="page" style="background:#15201C;color:#fff"><i style="background:#E2B458"></i>Пульс</a>
    </nav>
  </div>
</header>

<div id="app"><div class="card empty" style="margin-top:24px">Загружаю данные…</div></div>
</div>

<script>
/* ====== данные (как на странице финансов) ====== */
let cfg=null, opsByMonth={}, opsCut=null, archOps=[], deals={}, plans={}, clients={}, ME=null;
const byId=(arr,id)=>arr.find(x=>x.id===id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const curMonth=()=>todayStr().slice(0,7);
const addM=(m,k)=>{let y=+m.slice(0,4),mo=+m.slice(5,7)-1+k;y+=Math.floor(mo/12);mo=((mo%12)+12)%12;return y+'-'+pad(mo+1)};
const num=v=>{if(v==null||v==='')return 0;const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0};
const money=n=>{n=Math.round(+n||0);return (n<0?'−':'')+NF.format(Math.abs(n))+' ₽'};
const accById=id=>cfg.accounts.find(a=>a.id===id);
const catById=id=>cfg.categories.find(c=>c.id===id);
const agById=id=>{const c=clients[id];if(c)return {id:c.id,name:c.name,share:num(c.agentShare)};return cfg.agents.find(a=>a.id===id)};
const accRate=id=>{const a=accById(id);if(!a)return 0;return (a.tax===undefined||a.tax===null||a.tax==='')?(+cfg.taxRate||0)/100:num(a.tax)/100};
const ROLE_FALLBACK={divs:'divs',salary:'salary',loanin:'owner_in',loanout:'loan_out'};
const isRole=(o,r)=>{const c=catById(o.cat);if(!c)return false;return c.role===r||(!c.role&&ROLE_FALLBACK[r]===c.id)};
const holders=()=>[...new Set(cfg.accounts.map(a=>a.holderId).filter(Boolean).concat((cfg.openingDebts||[]).filter(x=>x.kind==='founder'&&x.cpId).map(x=>x.cpId)))];
const archM=m=>!!(cfg.archive&&cfg.archive.before&&m<cfg.archive.before.slice(0,7));
const isArchM=m=>!!(archM(m)&&!archOps.length&&cfg.archive.months&&cfg.archive.months[m]);
const histOps=()=>opsCut?[]:archOps.filter(o=>o.include);
const reportOps=()=>allOps().concat(histOps());
const pm=o=>o.pnlMonth||o.date.slice(0,7);
const dealAgents=d=>{if(!d)return [];const l=[];if(d.agentId)l.push({agentId:d.agentId,share:d.share,fixedPay:d.fixedPay});(d.extra||[]).forEach(x=>{if(x&&x.agentId)l.push({agentId:x.agentId,share:x.share,fixedPay:x.fixedPay})});return l};
const sumObj=o=>Object.values(o).reduce((s,v)=>s+v,0);
const openDebt=(cid,kind)=>(cfg.openingDebts||[]).filter(x=>x.cpId===cid&&x.kind===kind).reduce((s,x)=>s+num(x.amount),0);
function taxAccrual(o){if(o.type!=='in')return 0;const c=catById(o.cat);return c&&c.pnl==='revenue'?o.amount*accRate(o.acc):0}
function agentAccruals(o){ // начисления агентам по поступлению: [{agentId,amount}]
  if(o.type!=='in')return [];const c=catById(o.cat);if(!c)return [];
  const d=o.dealId?deals[o.dealId]:null,list=dealAgents(d);
  if(!list.length){if(c.role==='commission'&&o.agentId)list.push({agentId:o.agentId,share:'',fixedPay:''});else return []}
  else if(c.role!=='commission'&&c.pnl!=='revenue')return []; // любая выручка по сделке с агентами
  return list.map(x=>{let amt;
    if(d&&num(x.fixedPay)>0&&num(d.commission)>0) amt=num(x.fixedPay)*Math.min(1,o.amount/num(d.commission));
    else{const a=agById(x.agentId);const share=(x.share!==''&&x.share!=null)?num(x.share):(a?num(a.share):0);
      let base=o.amount;if(cfg.splitBase==='net')base*=1-accRate(o.acc);amt=base*share/100}
    return {agentId:x.agentId,amount:amt}});
}
function dealStats(d){let rec=0,tax=0,acc=0,paid=0,exp=0,dist=0;const ops=[];
  for(const o of reportOps()){if(o.dealId!==d.id)continue;ops.push(o);const c=catById(o.cat);
    if(o.type==='in'){rec+=o.amount;tax+=taxAccrual(o);agentAccruals(o).forEach(a=>acc+=a.amount)}
    else if(o.type==='out'){if(c&&c.role==='agentpay')paid+=o.amount;else if(c&&c.role==='tax'){}else if(c&&c.pnl==='none')dist+=o.amount;else exp+=o.amount}}
  const ar=!archOps.length&&ARCH().deals&&ARCH().deals[d.id];if(ar&&!opsCut){rec+=num(ar.rec);tax+=num(ar.tax);acc+=num(ar.acc);paid+=num(ar.paid);exp+=num(ar.exp);dist+=num(ar.dist)}
  const agent=Math.max(acc,paid);
  return {ar:ar&&!opsCut?ar:null,ops,rec,tax,acc,paid,agent,exp,dist,left:Math.max(0,num(d.commission)-rec),due:acc-paid,net:rec-tax-agent-exp}}
function investorStats(cid){
  const own=cfg.accounts.filter(a=>a.holderId===cid),ids=own.map(a=>a.id);
  const opening=own.reduce((s,a)=>s+num(a.opening),0);let put=0,got=0,loanIn=0,loanBack=0;
  for(const o of allOps()){
    if(ids.includes(o.acc)&&(o.type==='out'||(o.type==='tr'&&!ids.includes(o.toAcc))))put+=o.amount;
    if(o.type==='in'&&ids.includes(o.acc))got+=o.amount;
    if(o.type==='tr'&&ids.includes(o.toAcc)&&!ids.includes(o.acc))got+=o.amount;
    if(o.cpId===cid&&!ids.includes(o.acc)){if(o.type==='in'&&isRole(o,'loanin'))loanIn+=o.amount;if(o.type==='out'&&isRole(o,'loanout'))loanBack+=o.amount}}
  const openD=openDebt(cid,'founder');
  return {accounts:own,opening,put,got,loanIn,loanBack,openD,debt:openD+put-got-opening+loanIn-loanBack};
}
function liabilities(){
  const taxBy={},ag={};cfg.accounts.forEach(a=>taxBy[a.id]=num(a.openingTax));
  (cfg.openingDebts||[]).forEach(x=>{if(x.kind==='agent'&&x.cpId)ag[x.cpId]=(ag[x.cpId]||0)+num(x.amount)});
  for(const o of allOps()){const t=taxAccrual(o);if(t)taxBy[o.acc]=(taxBy[o.acc]||0)+t;agentAccruals(o).forEach(a=>ag[a.agentId]=(ag[a.agentId]||0)+a.amount);
    if(o.type==='out'){const c=catById(o.cat);if(c&&c.role==='tax')taxBy[o.acc]=(taxBy[o.acc]||0)-o.amount;const pid=o.cpId||o.agentId;if(c&&c.role==='agentpay'&&pid)ag[pid]=(ag[pid]||0)-o.amount}}
  const inv={};holders().forEach(h=>inv[h]=investorStats(h).debt);
  return {tax:sumObj(taxBy),taxBy,agents:ag,agentsTotal:sumObj(ag),inv,invTotal:Object.values(inv).reduce((s,v)=>s+Math.max(0,v),0)};
}
function balances(beforeDate){ // balances per account, ops with date < beforeDate (or all)
  const b={};cfg.accounts.forEach(a=>b[a.id]=num(a.opening));
  for(const o of allOps()){if(beforeDate&&o.date>=beforeDate)continue;
    if(o.type==='in')b[o.acc]=(b[o.acc]||0)+o.amount;
    else if(o.type==='out')b[o.acc]=(b[o.acc]||0)-o.amount;
    else if(o.type==='tr'){b[o.acc]=(b[o.acc]||0)-o.amount;b[o.toAcc]=(b[o.toAcc]||0)+o.amount}}
  return b;
}
function cashMonth(m){
  if(isArchM(m)){const a=cfg.archive.months[m],inC=Object.assign({},a.in),outC=Object.assign({},a.out),tin=sumObj(inC),tout=sumObj(outC);return {inC,outC,tin,tout,net:tin-tout,arch:true}}
  const inC={},outC={};let tin=0,tout=0;
  for(const o of (opsByMonth[m]||[]).concat(archM(m)?histOps().filter(x=>x.date.slice(0,7)===m):[])){if(o.type==='in'){inC[o.cat]=(inC[o.cat]||0)+o.amount;tin+=o.amount}
    else if(o.type==='out'){outC[o.cat]=(outC[o.cat]||0)+o.amount;tout+=o.amount}}
  return {inC,outC,tin,tout,net:tin-tout};
}
function pnlMonth(m,ops){
  if(isArchM(m)){const a=cfg.archive.months[m],rev={},fixed={},vr={};let revenue=0,agent=0;
    for(const k in a.in){const c=catById(k);if(c&&c.pnl==='revenue'){rev[k]=a.in[k];revenue+=a.in[k]}}
    for(const k in a.out){const c=catById(k);if(!c)continue;if(c.role==='agentpay'){agent+=a.out[k];continue}if(c.role==='tax'||c.pnl==='none')continue;
      if(c.pnl==='var')vr[k]=a.out[k];else if(c.pnl==='fixed')fixed[k]=a.out[k]}
    const tax=num(a.tax),varT=sumObj(vr),fixT=sumObj(fixed),margin=revenue-tax-agent-varT;return {rev,fixed,vr,revenue,tax,agent,varT,fixT,margin,profit:margin-fixT,arch:true}}
  const rev={},fixed={},vr={};let revenue=0,tax=0,agent=0;
  for(const o of ops){if(pm(o)!==m)continue;const c=catById(o.cat);
    if(o.type==='in'){if(c&&c.pnl==='revenue'){rev[c.id]=(rev[c.id]||0)+o.amount;revenue+=o.amount;tax+=taxAccrual(o)}
      agentAccruals(o).forEach(a=>agent+=a.amount)}
    else if(o.type==='out'&&c){if(c.role==='agentpay'||c.role==='tax'||c.pnl==='none')continue;
      if(c.pnl==='var')vr[c.id]=(vr[c.id]||0)+o.amount;else if(c.pnl==='fixed')fixed[c.id]=(fixed[c.id]||0)+o.amount}}
  const varT=sumObj(vr),fixT=sumObj(fixed),margin=revenue-tax-agent-varT,profit=margin-fixT;
  return {rev,fixed,vr,revenue,tax,agent,varT,fixT,margin,profit};
}
const allOps=()=>{const r=[];for(const k in opsByMonth)r.push(...opsByMonth[k]);return opsCut?r.filter(o=>o.date<opsCut):r};

/* ====== API ====== */
async function api(fn,...args){
  let r;try{r=await fetch('/api/'+fn,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(args)})}
  catch(e){throw new Error('Нет связи с сервером.')}
  if(r.status===401){location.href='/login';throw new Error('Сессия закончилась.')}
  let d=null;try{d=await r.json()}catch(_){}
  if(!r.ok)throw new Error((d&&d.error)||('Ошибка сервера ('+r.status+')'));
  return d.result}

function apply(d){
  if(!d)return;
  cfg=d.cfg||{accounts:[],categories:[],agents:[]};
  deals={};(d.deals||[]).forEach(x=>deals[x.id]=x);
  clients={};(d.clients||[]).forEach(x=>clients[x.id]=x);
  plans=d.plans||{}; archOps=d.archOps||[]; opsCut=null;
  opsByMonth={};
  (d.ops||[]).forEach(o=>{const m=o.date.slice(0,7);(opsByMonth[m]=opsByMonth[m]||[]).push(o)});
  ME=d.me||null;
}

/* ====== вычисления пульса ====== */
function monthRange(n){ // последние n месяцев включая текущий, но не раньше месяца старта учёта
  const out=[],cm=curMonth(),start=(cfg&&cfg.startMonth)||addM(cm,-(n-1));
  for(let i=n-1;i>=0;i--){const m=addM(cm,-i);if(m>=start)out.push(m)}return out;
}

function computePulse(){
  const months=monthRange(12);
  const cm=curMonth();
  // помесячный P&L
  const series=months.map(m=>{const ops=reportOps();const p=pnlMonth(m,ops);const c=cashMonth(m);return{m,revenue:p.revenue,profit:p.profit,tax:p.tax,agent:p.agent,exp:p.fixT+p.varT,tin:c.tin,tout:c.tout,net:c.net}});
  const cur=series[series.length-1];
  const prev=series[series.length-2]||cur;

  // деньги
  const bal=balances(), L=liabilities(), hs=new Set(holders());
  const companyMoney=cfg.accounts.reduce((s,a)=>s+(a.holderId?0:(bal[a.id]||0)),0)+Object.values(L.inv).reduce((s,v)=>s+Math.max(0,-v),0);
  const free=companyMoney-L.tax-Math.max(0,L.agentsTotal)-L.invTotal;

  // воронка сделок
  const openDeals=Object.values(deals).filter(d=>d.status==='work'||d.status==='deal');
  let pipe=0;openDeals.forEach(d=>{pipe+=dealStats(d).left});
  const stCount={work:0,deal:0,closed:0,lost:0};
  Object.values(deals).forEach(d=>{stCount[d.status]=(stCount[d.status]||0)+1});

  // загрузка агентов (по сделкам в работе + начисления за текущий год)
  const agents={};
  const year=cm.slice(0,4);
  const ensure=id=>{if(!agents[id])agents[id]={id,name:(agById(id)||{}).name||id,active:0,deal:0,pipe:0,accrued:0,closed:0,won:0};return agents[id]};
  Object.values(deals).forEach(d=>{
    const list=dealAgents(d);
    const st=dealStats(d);
    list.forEach(x=>{const a=ensure(x.agentId);
      if(d.status==='work'||d.status==='deal'){a.active++;a.pipe+=st.left}
      if(d.status==='closed'||d.status==='deal')a.won++;
    });
  });
  // начисления агентам за год
  reportOps().forEach(o=>{if(o.type!=='in')return;if(pm(o).slice(0,4)!==year)return;
    agentAccruals(o).forEach(a=>{ensure(a.agentId).accrued+=a.amount})});
  const agentList=Object.values(agents).sort((a,b)=>b.accrued-a.accrued);

  return {series,cur,prev,companyMoney,free,L,openCount:openDeals.length,pipe,stCount,agents:agentList,months};
}

function delta(cur,prev){
  if(!prev)return '<span class="delta flat">—</span>';
  const d=cur-prev, pct=prev?Math.round(d/prev*100):0;
  const cls=d>0?'up':d<0?'down':'flat';
  const sign=d>0?'+':'';
  return `<span class="delta ${cls}">${sign}${money(d)} · ${sign}${pct}%</span>`;
}

function bars(data,key,color){
  const max=Math.max(...data.map(x=>Math.abs(x[key])),1);
  return '<div class="spark">'+data.map(x=>{
    const v=x[key],h=Math.round(Math.abs(v)/max*100);
    return `<div class="col ${v<0?'neg':''}" style="height:${Math.max(h,2)}%" title="${x.m}: ${money(v)}"></div>`;
  }).join('')+'</div>'+
  '<div class="spark-x">'+data.map(x=>`<span>${x.m.slice(5)}</span>`).join('')+'</div>';
}

function render(){
  const el=document.getElementById('app');
  let P;try{P=computePulse()}catch(e){el.innerHTML='<div class="card empty" style="margin-top:24px">Не удалось построить дашборд: '+esc(e.message)+'</div>';return}
  const s=P.series,cur=P.cur,prev=P.prev;

  const wonThisYear=Object.values(deals).filter(d=>(d.status==='closed'||d.status==='deal')&&String(d.date||'').slice(0,4)===String(curMonth().slice(0,4))).length;

  let h='';
  // --- верхние KPI ---
  h+='<div class="pulse-hero"><div><h1>Пульс компании</h1><div class="sub">Обновлено: '+new Date().toLocaleString('ru-RU')+' · текущий месяц: '+curMonth()+'</div></div></div>';

  h+='<div class="grid tiles ptiles">';
  const freeNote = P.free<0
    ? 'отрицательно: обязательства (налог, долги агентам) превышают доступные средства — взгляните на резервы ниже'
    : 'компания − резервы УСН, долги агентам и учредителям';
  h+=`<div class="tile hero"><span class="k">Свободные деньги</span><span class="v">${money(P.free)}</span><span class="s">${freeNote}</span></div>`;
  h+=`<div class="tile"><span class="k">Выручка за месяц</span><span class="v">${money(cur.revenue)}</span><span class="s">мес. назад: ${money(prev.revenue)} · ${delta(cur.revenue,prev.revenue)}</span></div>`;
  h+=`<div class="tile ${cur.profit>=0?'good':'bad'}"><span class="k">Прибыль за месяц</span><span class="v">${money(cur.profit)}</span><span class="s">маржа: ${cur.revenue?Math.round(cur.profit/cur.revenue*100):0}% · ${delta(cur.profit,prev.profit)}</span></div>`;
  h+=`<div class="tile"><span class="k">В работе (pipeline)</span><span class="v">${money(P.pipe)}</span><span class="s">открытых сделок: ${P.openCount}</span></div>`;
  h+='</div>';

  h+='<div class="grid tiles ptiles" style="margin-top:12px">';
  h+=`<div class="tile"><span class="k">Деньги компании на счетах</span><span class="v">${money(P.companyMoney)}</span><span class="s">без личных карт учредителей</span></div>`;
  h+=`<div class="tile warnv"><span class="k">Резерв на УСН</span><span class="v">${money(P.L.tax)}</span><span class="s">налог к уплате</span></div>`;
  h+=`<div class="tile warnv"><span class="k">Должны агентам</span><span class="v">${money(Math.max(0,P.L.agentsTotal))}</span><span class="s">начислено комиссий</span></div>`;
  h+=`<div class="tile ${P.stCount.lost?'bad':''}"><span class="k">Сорвано за всё время</span><span class="v">${P.stCount.lost||0}</span><span class="s">закрыто успешно: ${P.stCount.closed||0} · в работе: ${P.stCount.work||0}</span></div>`;
  h+='</div>';

  // --- графики ---
  h+='<div class="pulse-grid">';
  h+=`<div class="card"><h3>Динамика выручки, 12 мес</h3>${bars(s,'revenue')}</div>`;
  h+=`<div class="card"><h3>Динамика прибыли, 12 мес</h3>${bars(s,'profit')}</div>`;
  h+='</div>';

  h+='<div class="pulse-grid">';
  h+=`<div class="card"><h3>Денежный поток (приток / отток)</h3>${bars(s,'net')}<div class="pulse-note">Зелёное — месяц с положительным сальдо, красное — с отттоком.</div></div>`;
  h+=`<div class="card"><h3>Статистика сделок</h3>
      <div class="kv"><span class="k">В работе</span><span class="v">${P.stCount.work||0}</span></div>
      <div class="kv"><span class="k">Договор подписан</span><span class="v">${P.stCount.deal||0}</span></div>
      <div class="kv"><span class="k">Закрыто (оплачено)</span><span class="v">${P.stCount.closed||0}</span></div>
      <div class="kv"><span class="k">Сорвалась</span><span class="v" style="color:var(--neg)">${P.stCount.lost||0}</span></div>
      <div class="kv"><span class="k">Закрыто в этом году</span><span class="v">${wonThisYear}</span></div>
      <div class="kv"><span class="k">Всего в базе</span><span class="v">${Object.keys(deals).length}</span></div>
    </div>`;
  h+='</div>';

  // --- агенты ---
  h+='<div class="pulse-grid" style="grid-template-columns:1fr">';
  h+=`<div class="card"><h3>Загрузка и результативность агентов (${curMonth().slice(0,4)})</h3>`;
  if(!P.agents.length)h+='<div class="empty">Нет данных по агентам.</div>';
  else{
    h+='<div class="tbl-wrap"><table class="pulse-table"><thead><tr><th>Агент</th><th class="r">В работе, шт</th><th class="r">Pipeline</th><th class="r">Закрыто</th><th class="r">Начислено за год</th></tr></thead><tbody>';
    P.agents.forEach(a=>{h+=`<tr><td><b>${esc(a.name)}</b></td><td class="r">${a.active}</td><td class="r">${money(a.pipe)}</td><td class="r">${a.won}</td><td class="r pos">${money(a.accrued)}</td></tr>`});
    h+='</tbody></table></div>';
    h+='<div class="pulse-note">«Начислено» — комиссия агента, рассчитанная по правилам выплат из финансов.</div>';
  }
  h+='</div></div>';

  el.innerHTML=h;
}

(async()=>{
  const el=document.getElementById('app');
  try{apply(await api('loadAll'))}catch(e){el.innerHTML='<div class="card empty" style="margin-top:24px">'+esc(e.message)+'</div>';return}
  render();
  // автообновление раз в 60 сек
  setInterval(async()=>{try{apply(await api('loadAll'));render()}catch(_){}},60000);
})();
</script>
</body></html>
